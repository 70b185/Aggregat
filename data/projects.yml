      2026-11-27 (README, manual, tag 5.10): the manual now names Machinedrum MDX X.14 or X.20 (some features need X.20)
      and Monomachine X.01. With MDX X.20 MCL handles parameters 24-37 (second envelope and LFO, retrig, bus sends,
      envelope destination), shows USR machine labels, fills from the MD's keys, imports locks on steps without a trig and
      keeps the extra parameters when it sends a kit. Projects from before 5.00 must first go through a separate upgrader
      firmware, and projects opened in 5.10 do not open in older MCL. Turbo MIDI on a Machinedrum MK1 should stay at 4x or
      lower.
