    notes: >
      An elekloader module that turns a source trig into an arpeggio or an evolving phrase, for audio tracks (ONESHOT
      only) and MIDI tracks; opened with FUNC + TRIG. The repo holds a README, the module and a source archive with
      licences and test reports. Declared conflicts: DigiPoly, DigiMatrix and project-data-dt1; a Modwerk audit also
      found overlaps with Machine Pages, digichain, NEIGHBOR, Digi Perform and Euclidean Sequencing. LFO 3 locks are not
      implemented. Modwerk catalogue integration is in preparation. The author names Codex as coding assistant. Not the
      same project as digiarp-midi (Digitone, aleks-karachevtsev); whether it shares code with it is not stated.
      Found by GitHub search 2026-11-16.
