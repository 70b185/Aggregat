    version: "v1.15 (tag, 2026-11-26): envelope followers saved with their source track, GROOVE keeps the count-in straight and plays with RESET INF. v1.14 (tag, 2026-11-26): arp speed NOTE (one step per trig or played note), undo and redo on [-]/[+] (50 steps of pattern and kit), THRU follows its source's arp, MACHINEDRUM fades the quietest voice instead of the oldest. v1.13 (tag, 2026-11-24): MACHINEDRUM voices managed (at most 8 ring, fewer when the DSP is busy; the oldest fades out in 2.7 ms) so polyphony, fast arps and unison stay inside the DSP budget. v1.12 (tag, 2026-11-24): stock clear, reload and copy key combinations also act on Overtone parameters. v1.11 (tag, 2026-11-24): polyphonic MACHINEDRUM with unison, LIVE KNOBS setting. v1.10 (tag, 2026-11-22): arp SHUF and RAND, ARP 2 RANGE and SLIDE"
    last_activity: "2026-11-26"
    notes: >
      Python 3.11+ patcher (patcher/patch.py) that builds Overtone from the user's own OS 1.12 and only saves
      the result if it matches the tested build byte for byte; install via Elektron Transfer over USB.
      Adds machines SOPHIE, MACHINEDRUM, LOOP, THRU, per-track insert effects, envelope followers, two
      arpeggiators, parameter slides and GROOVE (replaces swing). 1.0.1 fixes installing an OS sent with
      Transfer while Overtone runs. About 160 checks per build in two emulators (digikit for the main OS, a
      SHARC emulator for the DSP program); author states 1.0.1 passes all of them, is played on a Digitone II
      and Transfer installs were checked on the unit. Opening Overtone projects on stock OS is untested.
      Recovery section is detailed (FUNC + TRIG 4, DIN MIDI, ~15 min). AGPL-3.0-or-later (includes dnfw),
      5 commits. Related: dnfw, digikit, dn2-cfw, Schwung Sophie (MIT), and the author's
      digitone-2-modding-skill used with Claude Code.
      2026-11-17 (README, v1.6): arps, LFOs and followers also work on MIDI tracks to play and modulate external gear;
      a follower can listen to the main mix or the audio inputs; a trig with only locks now slides too.
      2026-11-20 (README, v1.7/v1.8): the README now says Overtone 1.8 is played on a Digitone II and passes about
      190 emulator checks per build (160 before); the patcher also stores the packer's choices (no OS bytes), so it
      rebuilds the tested file in seconds instead of 1 to 3 minutes.
      2026-11-22 (README, v1.9): GROOVE's presets are now listed with their step weights (the SW presets reproduce
      Elektron's SWING 54-71 %, and any swing value can be typed in as two weights); unlike Elektron's swing, GROOVE
      moves every step, the arpeggiators and micro timing. GROOVE now also works while the Digitone follows external
      MIDI clock; early steps play ahead of their clock from the measured tempo and can sit slightly off in the
      first beat after PLAY. The README says 1.9 passes every check (about 190) and installs and boots on a Digitone
      II, but its GROOVE changes are not yet played on a unit (1.8 was).
      2026-11-23 (README rewrite, v1.10 commit message): v1.10 adds arp modes SHUF (held notes over RANGE in one
      random order, redrawn on each trig or chord) and RAND (a random note and octave each step) on both arps. ARP
      2 runs while a track key is held with the sequencer stopped, gains RANGE (x1-x8) and SLIDE, and has no TRUE
      mode. Fixed: FREE mode and the 1/128 speeds were lost when a sound loaded. At the tag the README said 1.10
      installs and boots on a unit and SHUF/RAND were played there; the shorter README now omits this.
      2026-11-25: v1.11-v1.13. MACHINEDRUM is polyphonic (each voice its own engine) and takes unison; picking it
      switches the track unison off. SETTINGS > SYSTEM > LIVE KNOBS OFF makes knobs show stored values as on stock
      (kept over power cycles). v1.11 fixed crackles on MACHINEDRUM P-I models when many notes or unison voices
      started at once (altstrument notes). TRK + PLAY, PARAMETER + NO and FUNC + COPY/PASTE/CLEAR in the arp menus now
      cover Overtone parameters.
      2026-11-27 (README, tags v1.14 and v1.15): undo and redo with [-] and [+] (not in KEYBOARD mode) over up to 50 steps
      of what a pattern save would store, pattern and kit, grouped by a pause of about two seconds; changing the pattern
      starts a new history. Arp speed NOTE moves the arp one step per trig or key (ARP 1) or per note played (ARP 2),
      restarting at PLAY/STOP. MACHINEDRUM voice management now fades out the quietest voice when a new note needs room,
      and while the DSP is busy it cuts only inaudible tails unless the load passes 90 %. The README makes no new
      statement about unit tests of these versions.
    latest_seen: >
      altstrument: v1.1 (2026-10-30) reworks GROOVE with presets, a random drift control, random weights and arrow-key editing, and restores FUNC + TEMPO as tap tempo; v1.0.1 (2026-10-29) fixes installing Elektron's OS or an Overtone update with Transfer while Overtone runs.
