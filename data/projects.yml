  - id: telos
    name: telos (elekloader OS)
    author: elekloader
    kind: loader
    devices: [digitone, octatrack, analog-rytm, analog-four-keys]
    repo: https://github.com/elekloader/telos
    license: "GPL-2.0-or-later (mod.json files; LICENSE holds the GPL-2.0 text)"
    status: wip
    tested: partly
    tested_note: "0.2 ran on a Digitone mk1 with OS 1.44 (three mods sent over USB, restarted into, switched off and on from the unit); OS 1.43 only in digiemu; 2026-11-15 the poc branch loaded each kind of shop mod from the store on a Digitone mk1 (OS 1.44; PRG/CHK/LOOP, GAIN, SINE, EUCLID, digihealth, DigiTide, Mutiny, Tone+FX), not yet all thirteen in one boot; the Octatrack 0.4 port (octatrack/) runs in octabam's emulator only (read 2026-11-17); the Rytm MKII 0.1 and A4 MKII 0.3 ports are built and linted only, not run (read 2026-11-22)"
    base_os: "Digitone mk1 / Keys OS 1.43 and 1.44 on elekloader core-dn1 5.0 or newer; Octatrack MKI/MKII OS 1.40C on core-ot 0.41 or newer (emulator); Analog Rytm MKII OS 1.74 on core-ar2 0.18; Analog Four MKII OS 1.56 on core-a4mk2 0.10 (both built against stock only)"
    version: "Digitone 0.2 (2026-11-14); Octatrack 0.4 (2026-11-16); Analog Four MKII 0.3 and Analog Rytm MKII 0.1 (built only, 2026-11-22)"
    last_activity: "2026-11-22"
    notes: >
      An elekloader build that is flashed once and then links more mods at every boot from a store on the unit, so new
      mods need no new firmware: .elemod files go over USB (SysEx with the non-commercial id 0x7D, each file read back and
      checked by CRC-32), and a MODS (TELOS) page at the end of SETTINGS switches them on or off for the next boot. A boot
      that crashes within 10 s of linking makes the next boot link nothing (one safe boot). Only +Drive-style mods (code
      and .bss, no patch sites). On the Digitone mk1 the store is 2 MB of raw +Drive sectors outside every area stock
      uses, so it never shows in Transfer; up to 63 files. Planned for the other devices elekloader supports. Found by
      GitHub search 2026-11-15; README read 2026-11-15.
      2026-11-17: the Octatrack port is in the repo (octatrack/, 0.4, emulator only): .elemod files on the CF card in
      /ELEKLOADER/MODS (copied by USB DISK MODE or a card reader) are linked at the card's first mount, before the
      project load; unlike the Digitone's, these mods may patch the OS (sites), checked against stock bytes, written
      with interrupts masked when no task is stopped inside a site, and refused when the OS already ran them before the
      mount (code 23). 14 of the shop's 15 non-USB octabam conversions link together (about 61 KB); USB mods stay
      flash-only. DSP code from the card goes through elekloader's dspload-ot. On both devices each saved project now
      keeps the list of mods that ran, and loading one whose mods differ offers to switch them (LOAD PROJECT MODS?).
      A poc branch adds site-writing and memory-region mods for the Digitone (POC.md).
      2026-11-22 (README, ar2/ and a4mk2/ README and mod.json, vendor/drive-loader-*): ports for the Analog Rytm
      MKII (ar2/, 0.1, OS 1.74, core-ar2 0.18) and the Analog Four MKII (a4mk2/, 0.3, OS 1.56, core-a4mk2 0.10).
      Both are elekloader's Drive Loaders copied unchanged into vendor/ and shipped under TELOS's name; only the
      SETTINGS row is TELOS's own. The module id stays drive-loader, so a build holds TELOS or the Drive Loader,
      never both, and +Drive mods for the Drive Loader load unchanged. Mods go to /mods through the unit's own data
      transfer (Elektron Transfer, Elektroid). The A4 keeps them in raw +Drive sectors that FORMAT +DRIVE empties.
      Projects do not yet keep their mods on either device. Neither port has run in an emulator or on a unit.
    features:
      - "flash once, then add and remove mods without new firmware"
      - "mods sent over USB from a command-line tool (Digitone) or copied to the CF card (Octatrack), each checked by CRC-32"
      - "MODS page: switch mods on or off with a check for clashes, apply and restart"
      - "crash guard: a boot that crashes right after linking is followed by one safe boot (Octatrack, Rytm MKII, A4 MKII: holding NO at power-on also skips the mods)"
      - "projects remember their mods and offer to switch to them on load (Digitone, Octatrack)"
      - "Analog Rytm MKII and Analog Four MKII: elekloader's Drive Loader under TELOS's name; mods uploaded to /mods with Elektron Transfer or Elektroid"
      - "Octatrack: card mods may patch the OS and send DSP code (via dspload-ot)"
    sources: [state/NEW.md 2026-11-15, "README (2026-11-15)", "README, POC.md, octatrack/README.md and design/*.md (2026-11-17)", "README, a4mk2/ and ar2/ README and mod.json, vendor/drive-loader-*/README (2026-11-22)"]
    relations:
    - {type: builds_on, id: elekloader, evidence: 'README: part of elekloader; built as an elekloader mod with core-dn1 and its +Drive boot linker'}

  - id: trig-seedr
    name: trig-seedr
    author: a1o1
    kind: mod
    devices: [analog-rytm, syntakt]
    repo: https://github.com/a1o1/trig-seedr
    links:
      homepage: https://a1o1.github.io/trig-seedr/
    license: "GPL-2.0-or-later; a build with the MAP data (from Mutable Instruments Grids) is GPL-3.0-or-later, as the shipped mod is"
    status: beta
    tested: unit
    tested_note: "0.9.0 passed checks 1-25 (incl. TURING 16-25) on one Analog Rytm MKII (OS 1.74) and one Syntakt (OS 1.42) on 2026-11-24, the first Rytm unit pass since 0.7.1 (0.8.0 itself never ran on a unit); not tried on a unit: FUNC + SCALE on the Syntakt, track speeds other than 1x, pattern changes while the live page runs. 0.5.1, 0.6.0 (2026-11-16) and 0.7.1 (2026-11-17, checks 1-15 incl. range knobs, YES after a revert, the pending dot and YOLO) passed on one Analog Rytm MKII with OS 1.74; 0.7.0 never ran on a unit (use 0.7.1). Every release passes the full analog-emu run (477 checks at 0.7.1) (docs/flashing.md, docs/testing.md, read 2026-11-18). Syntakt OS 1.42: the 0.7.1-labelled build of 0.8.0's code passed a first hardware pass on one unit (2026-11-19: way back to stock, round-tripped stock file, a memory canary with all 64 sample slots loaded, first checks 1-15; docs/flashing-st.md, read 2026-11-21); 0.8.0's Rytm build is emulator only so far (31 files, 499 checks), 0.7.1 is the last Rytm build with a unit pass"
    base_os: "Analog Rytm MKII OS 1.74, elekloader core-ar2 0.13; Syntakt OS 1.42 (from 0.8.0), on a minimal hook-bus core built from Synfact's sources"
    version: "v0.9.0 (tag, 2026-11-24): TURING, a Turing-machine loop for a track on both devices, boot screen TS09. v0.8.0 (tag, 2026-11-20): the Syntakt (OS 1.42) ready for testing as a beta, code split into a shared frame and one part per device, boot screen TS08; v0.7.1 (tag, 2026-11-17): the beta for users: YOLO fix (a roll could be undone by a missing return value), the manual on the site, boot screen T071; v0.7.0 (tag, 2026-11-16): TOOLS YOLO, range knobs whose ends stop at each other, a dot for a take not applied, YES after a revert brings the same take back; v0.6.0 (tag, 2026-11-16): integration milestone, fuzzed, screen idle cost cut; v0.5.1 (tag, 2026-11-16): generate and apply (YES needs grid recording, FUNC + YES applies); v0.5.0 (tag): all version-1 features. Earlier: v0.4.1, v0.4.0 (2026-11-15), v0.3.0 (2026-11-14)"
    last_activity: "2026-11-24"
    notes: >
      Offline pattern algorithms as an elekloader mod, opened as a third TRIG page after EUCLIDEAN: generate rhythms,
      notes, accents, trig conditions, retrigs and sample locks for a track, audition takes with undo, apply groove
      timing and velocity, and rotate a track or the whole pattern. Everything it writes is ordinary pattern data that
      plays and saves on a stock OS. Analog Four MKII and Syntakt are planned. Groove tables can be made from the user's
      own Ableton Live grooves; none are shipped. The author names Claude as coding assistant. Found by GitHub search
      2026-11-15; README and firmware notes read 2026-11-15.
      2026-11-16 (v0.4.0/v0.4.1, README 0.5): navigation is LEFT/RIGHT, PAGE and the TRIG keys stay stock's while the
      page is open. 0.4.1 is the build to flash: 0.4.0 wrote new trigs without the stock SYN/SMP/ENV flag bits, and a
      compiler optimisation (store merging in m68k-elf-gcc 16.2) broke a step move in the emulator (I112). Recipes live
      in RAM only and are lost at power-off or a pattern change. The MAP source copies Grids' drum map (GPL-3.0, Mutable
      Instruments, not catalogued).
      2026-11-17 (v0.5.0-v0.7.0, README, release notes, flashing, testing, firmware notes): first hardware passes on a
      Rytm MKII (0.5.1, 0.6.0). Since 0.5.1 YES writes a take only with grid recording on and a take stays only after
      FUNC + YES; changing track or pattern, closing or turning RECORD off restores the original. Fuzzing found that two
      lock lanes on one parameter lost locks (the Rytm keeps one lock per parameter and step); refused since 0.6.0. The
      mod is 62 KB of code and 107 KB of RAM. Planned after 1.0: a TURING page that rewrites the track at each loop end.
      2026-11-18 (v0.7.1, README, manual, flashing, testing, status M2.6): 0.7 is declared a beta for users; feedback
      decides what changes before 1.0. 0.7.1 fixes YOLO: take() fell off its end without a return value, so whether a
      roll stayed depended on a leftover register; the emulator passed by chance (I142). The mod now builds with
      -Werror=return-type. Boot screen shows T071 (a patch release shows Txyz, a minor one TSxy).
      2026-11-20 (README, docs/firmware-notes-st142.md, flashing-st.md, plan-syntakt.md, status S0.2-U3,
      mods/*-st, manual): a Syntakt OS 1.42 port is in development, tested in analog-emu only (102 emulator checks),
      with no file offered to flash; the beta stays Rytm-only, so `devices` stays analog-rytm. The mod's code is split
      into a device-neutral frame/ and one part per device. On the Syntakt it uses a minimal hook-bus core of its own
      (456 bytes, from Synfact's GPL sources) because Synfact's core-st 2.0.3 does not link with gcc 16.2, so it does
      not run beside Synfact's mods. Code and data sit at 0x47a00000-0x47b00000, a range the emulator never saw the OS
      use; a canary mod is to check that on a unit with all 64 sample slots loaded. Differences from the Rytm: no
      retrigs, accent or slide; NOTE only (chord notes kept); LOCK lists the track's machine's controls; no lock-row
      limit. The unit file is stock 1.42 rebuilt by elektron-firmware-tool with only MAIN changed. A device header
      (st_params.h) is generated from the user's own stock file and never committed. Unit steps planned: practise the
      startup-menu recovery, flash a round-tripped stock file, the canary, then the mod. Rytm manual: YES + SCENE does
      not save a pattern while the mod is open (the mod takes YES, SCENE closes it).
      2026-11-21 (v0.8.0, README, release-0.8, flashing-st, testing, requirements, adding-a-device, site device pages):
      0.8.0 makes the Syntakt (OS 1.42) a second device, "ready for testing" (beta), so `devices` now lists it. Its
      first hardware pass (2026-11-19, one unit, on the 0.7.1-labelled build of the same code) went in steps: the
      startup-menu way back on stock, a stock file round-tripped by elektron-firmware-tool, a memory canary over
      0x478b0000-0x47bf0000 with all 64 sample slots loaded (OK), then the 15 first checks, including a take kept across
      a power off (I184). The Rytm build of 0.8.0 is the same instrument on reorganised code and has no unit pass yet.
      Analog Four MKII and Digitone II are named as the next devices (docs/adding-a-device.md).
      2026-11-25: v0.9.0 TURING (DJVU, CRPT and SHFT modes) works as a RHYTHM source, as a value source for NOTE, VEL
      and LOCK, and as a live page that rewrites steps behind the playhead; SCALE (19 scales) and ROOT on NOTE. YOLO
      does not roll TURING. The Syntakt build drops the Live groove tables to fit (swing grooves only). Credits name
      Marbles, the Labyrinth manual and the Turing Machine (descriptions only).
    features:
      - "one recipe per track: a trig source (the track's own, random, Euclid, a Grids-style drum map or another track) shaped by pages"
      - "random rhythms with density, strong-step bias and roles, weighted by Barlow's indispensability in six meters"
      - "placement: rotate, anticipation, mask against another track, skip"
      - "velocity shapes, accents, humanize; notes and two lock lanes from ranges, lists or noise"
      - "trig conditions, retrigs, Ableton grooves and micro-timing drift (retrigs and accents on the Rytm only)"
      - "takes: seed, VARY, phrases of takes, best of N; a preview before YES; a take is heard, then applied with FUNC + YES or undone with NO"
      - "ROTATE ALL for the whole pattern, and YOLO: a random but musical recipe rolled for the track"
      - "TURING: a 1-16 step loop that changes each pass, as rhythm, note/velocity/lock source or a live rewrite behind the playhead"
    sources: [state/NEW.md 2026-11-15, "README (2026-11-15)", "docs/firmware-notes-os174.md (2026-11-15)", "README, release-0.4/0.5, firmware-notes-os174.md, status D1/F2 (2026-11-16)", "README 0.7, release-0.5/0.6/0.7, flashing.md, testing.md, firmware-notes-os174.md, status F12/M2.1-M2.3 (2026-11-17)", "README 0.7.1, release-0.7.md, flashing.md, testing.md, requirements.md, status M2.6, site manual (2026-11-18)", "README (2026-11-20)", "firmware-notes-st142.md, flashing-st.md, plan-syntakt.md, status S0.2-U3, site manual (2026-11-20)", "README v0.8.0, release-0.8.md, flashing-st.md, testing.md, adding-a-device.md, site device pages (2026-11-21)", "tag v0.9.0, release-0.9, design-turing, status T0a-T3, flashing docs (2026-11-25)"]
