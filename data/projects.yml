      apply without a restart (deferred to stop while playing); the MODULES list applies changes live. Service files
      can carry 1, 2 or 4 byte patches that are checked against the stock bytes before writing and restored in reverse
      order at unload. Runtime 0.13.0 adds per-service sections to the MODULES reply (caps bit 21); hosts refuse the
      older layout. Patch-time machine fixtures removed: every machine is a run-time .dkm.
      2026-11-26 (HEAD de6f2a1; plan dsp-development-workflow, INSTRUMENTATION, MODULE-AUTHORING, sdk/dsp, debug
