  # ---------------------------------------------------------------- Digitone II
  - id: overtone
    name: Overtone
    author: complex-ping
    kind: mod
    devices: [digitone-2]
    repo: https://github.com/complex-ping/overtone
    links:
      forum: https://elektronmods.com/thread-90-overtone-custom-digitone-2-firmware
