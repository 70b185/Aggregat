      are not), and the built-in sounds ship as a DX7 bank for Dexed. v1.3 fixes four machine bugs, among them a RUMBL
      tail that could hum on and keep using CPU. The repo no longer holds any bytes of Elektron's firmware: each patch
      checks the original bytes by length and SHA-256.
      2026-11-18 (CHANGELOG v1.4-v1.6, README, MACHINES.md): 27 machines with UBSAW (seven detuned saws on the curves
      of a published JP-8000 analysis, written from scratch); an Attack stage after the filter and insert effect on
      all 27 machines; the CPU budget's default raised to 80 % because a project made before flashing already counts
      about 74 % with the six stock machines (I140). The README now documents what happens to projects moved between
      this firmware, the official OS and other mods, and a clean switching procedure.
      2026-11-19 (README, CHANGELOG v1.6.1-v1.6.2): the web builder and patch.py --machine samples take both official OS
      1.13 files (Cycles and Samples) and pack this firmware inside the Samples OS, as Modded-Cycles does, so
      bootloader, startup menu and signature stay Elektron's; the result turns a Model:Samples into a modded
      Model:Cycles. Installed through the startup menu (FUNC at power-on, TRIG 4) over MIDI IN; after that Transfer can
      no longer update it. Going back: the official Samples OS through the startup menu, after setting tracks on added
      machines back to stock machines. A Model:Cycles running the Samples OS would accept the file and then refuse
      Cycles firmware over USB until the Cycles OS is reinstalled over MIDI.
      2026-11-20 (README, CHANGELOG v1.6.3-v1.9, MACHINES.md): 28 machines with 707 (machine 28, after UBSAW so
      project machine numbers stay; six synthesised parts at 24 kHz and 8 bits, cymbals 6 bits). Trig preview (hold a
      trig, press PAGE while stopped) taken from drumkilla's mod. Turing Machine LFO waves T3-T16 (a looping random
      sequence of 3 to 16 steps; a stock OS reads them as RND). UBSAW lost its own filter and Attack in v1.6.5, so its
      projects from v1.5-v1.6.4 sound different. v1.9: the Cycles' mute only holds back sequencer trigs, so ATMOS's
      trigless GATE drone kept sounding on a muted track; it now stops on mute (user report).
      2026-11-23 (CHANGELOG v1.10, README): v1.10 turns the retrig into an arpeggiator on every track (FUNC +
      RETRIG: Arp, Oct, Chd with 12 chord types, Gat, Lat); a retrig on a trig arpeggiates that note and its chord
      at the retrig rate, or RETRIG held plays it live. The live arpeggiator comes from the original Modded
      Cycles; chords, sequencer use, gate and latch are new. Tested in emulation, not yet on hardware.
      2026-11-24 (CHANGELOG v1.10.1, v1.11): LFO 2 on every track (FADE, Sph, MODE and Pol shared with LFO 1; both
      on one destination add up), an LFO 2 page in the plug-in; PUNCH now acts on the machines that use the Cycles'
      own amp envelope (projects saved with PUNCH on them sound punchier); the manual is at its eighteenth edition
      (56 pages). Tested in emulation, not yet on hardware.
      2026-11-25: v1.12: SLR tested in the emulator only and the new plug-in look built and tested on Linux; neither
      played on hardware yet (CHANGELOG).
    features:
