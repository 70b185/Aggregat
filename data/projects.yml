      check. Syntakt 1.42's image now fits with about 108 KB to spare (branch measurement). Modules can publish
      settings Workbench edits; new docs/FIRMWARE.md (per-release analysis databases for DT2 1.17, DN2 1.12, Syntakt
      1.42); desktop Workbench gains patch-and-flash and flash-emulator flows. The Overdrive curves module was
      deleted. No new unit run.
      2026-11-25 (RC4-4): the image points dynreg, params, machines and fxpages became one platform module, core/rows
