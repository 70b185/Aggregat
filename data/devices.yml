    phase: 1
  - slug: analog-heat
    name: Analog Heat (MKI, MKII, +FX)
    family: Analog Heat
    phase: 1
    note: >
      No community mod found yet (2026-10-31). Only generic tooling (elektron-firmware-tool) lists
      Analog Heat MKI/MKII/+FX. Last official OS we saw on elektron.se: Analog Heat MKI/MKII OS 1.22
      (2024-10-16); the +FX has its own OS (release notes last updated 2024-10-16) and MKII firmware
      is not interchangeable with +FX.
