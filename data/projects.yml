  - id: dnx
    name: DNX
    author: "NoiseAndMatter (all 1,042 commits by Ángel Linares García, author of dn2_firmware_explore; git log 2026-11-18)"
    kind: tool
    list: musician
    devices: [digitone, digitone-2]
