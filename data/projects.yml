  - id: digitone-drum-mode
    name: Digitone Drum Mode
    author: morriess
    kind: mod
    devices: [digitone]
    repo: https://github.com/morriess/Digitone-Drum-Mode
    license: "GPL-2.0-or-later"
    status: beta
    tested: partly
    tested_note: "0.11.0 emulator only (238 checks; ratchets, note repeat and the kit-pinning reload fix are not yet on a unit, 2026-11-25); the wrong-kit reload was found on the unit with 0.10.6 (I217). 0.10.6 passed on the author's Digitone (OS 1.44) on 2026-11-24: running light, page counters, one DRUM page, new pattern starts off, SCALE-menu pattern length, PTN/BANK LEDs, chains, ROOT box on a held step; LED colours match the emulator; the 1.5 s bank-key rule seems to work. 0.10 tested on a real Digitone (OS 1.44) on 2026-11-22: boot, pads, live and grid recording, held-step locks, running light, lane strip, DRUM pages, mutes, FUNC + trig keys in recording, settings per pattern, copy/paste, FUNC + NO reload, save/load and synth tracks passed; bugs found there (I193, I194). 0.10.1-0.10.4 emulator only (test_stock_keys 33 checks). Earlier: 0.8.2/0.8.3 on the unit (2026-11-17/18), 0.8/0.8.1 recorded into the wrong pattern (I153). LED colours not checked on a unit (README, MANUAL, read 2026-11-23)"
    base_os: "Digitone mk1 / Keys OS 1.44; elekloader core-dn1 5.3 or later (the build pins 5.4) and seq-events"
    version: "Drum Mode 0.11.0 on main (2026-11-25, D110, emulator only): ratchets (ROLL x2-x4 per drum per step), note repeat (RPT 1/16-1/64, recorded live), a pattern reload brings back its saved kit (at most 8 kits now). Drum Mode 0.10.6 (tag v0.10.6, 2026-11-24, D106): running light on keys 1-16 lit red for the whole step, LFO/DRUM page counters fixed; 0.10.5 moved the running light to the trig keys. 0.10.4 (2026-11-22): one DRUM page (mod page 27 only), builds pin core-dn1 5.4"
    last_activity: "2026-11-25"
    notes: >
      Mods for the Digitone mk1 on elekloader. Drum Mode turns a MIDI track into an 8-lane drum sequencer on the track's
      own MIDI channel. Found by GitHub search 2026-11-16. 2026-11-17: Drum Mode 0.8 (build shows OS version DRM8) adds
      grid editing per lane in GRID RECORDING, per-lane trig LEDs and two DRUM pages behind the MIDI LFO page (mod pages
      27/28); a user manual (docs/MANUAL.md) covers install, recovery via the startup menu's OS UPGRADE, and limits (the
      corner strip hides the tempo; no p-locks by holding a trig key in GRID RECORDING). The DigiArp build recipe and notes
      were removed; the README now points to DigiArp MIDI in the elekloader Mod Shop. Planned, after unit tests: drum kit presets, synth tracks as extra drum or MIDI tracks.
      2026-11-18: a new digiarp-core5 folder rebuilds DigiArp MIDI 0.9-dev11 for core 5.3 (two exported names changed,
      since core 5.3 now exports fw_note_on/fw_note_off for other routines) and builds one firmware with Drum Mode (OS
      DMA1): DigiArp's 8 tests and Drum Mode's 119 checks pass on it in digiemu, plus 13 side-by-side checks; not yet
      on a unit and not reviewed by DigiArp's author. Known bugs listed: step 1 after PLAY follows the previous
      setting; a UI hang with the Mod Menu open in one emulator sequence; the lane strip vanishing on page switches
      (unit); a mod page slot clash with DigiTables (slot 27). The repo offers no ready-made .syx; users build their
      own.
      2026-11-18 (README, docs/debugging.md): status beta, working on the unit. On a Digitone at OS 1.44, beats recorded
      by 0.8 never played: three on-screen debug builds and the emulator showed that the project keeps one set of track
      edit objects per pattern, and 0.8 always wrote through A01's (0.8.1 also tried A02's); every emulator test had run
      on A01. 0.8.2 uses the active pattern's set (I153). New known bug from the emulator: on a Drum Mode track the trig
      keys after PTN or BANK play pads instead of choosing a pattern. Planned: select a lane by its pad alone, and Drum
      Mode settings per pattern and track.
      2026-11-20 (README, drum-mode README/MANUAL/design/ui, mod.json): the repo was renamed Digitone-mods ->
      Digitone-Drum-Mode (same history; the old URL redirects) and now holds Drum Mode only. The digiarp-core5 folder
      was removed on 2026-11-19: the DigiArp MIDI core 5.3 rebuild and the build of one firmware with both mods moved to
      the author's fork morriess/Digitone-MIDI-Arpeggiator (branch core-5.3), still emulator only; a unit test and a
      pull request to DigiArp's author are to do. 0.8.3 to 0.10 (2026-11-19): 0.8.3 fixes empty DRUM pages and the
      vanished lane strip after a pattern pick (seen on the unit on H02; a firmware view left on top of the view stack,
      probably I141's cause); a pad selects its lane (0.9); keys 9-16 are a running light (0.9.1); PTN, BANK, chains
      and held grid steps reach the stock again (0.9.2); step 1 follows a change made while stopped (0.9.4, through
      seq-events' sq_rearm); settings per pattern and track with up to 10 kits per project (0.10, project block DRMK and
      core lane parameter 191). Saving on the stock OS drops the Drum Mode settings (the steps stay). Open: pattern
      copy with PTN, MUTE mode and STEP RECORDING are unchecked; the DigiTables page 27 clash stays. Ideas after v1:
      ratchets, note repeat, Euclidean fills, lengths and probability per lane; a separate generative melody mod.
      2026-11-23 (README, drum-mode README, MANUAL, ui README, mod.json): 0.10 was tested on a Digitone (OS 1.44)
      on 2026-11-22; pads, recording, grid editing, running light, DRUM pages, mutes, per-pattern settings,
      copy/paste and save/load passed. Found there: the trig keys did not reach the stock SCALE menu and covered
      the PTN/BANK LEDs (fixed in 0.10.1/0.10.2, emulator only), and a MIDI track showed "Drum Mode off" and
      became unusable (open). 0.10.3: a new pattern starts with Drum Mode off. 0.10.4 needs one mod page (27), so
      it links with machines-dn1, Filter-FX and CTRL-PLUS; builds pin core-dn1 5.4. Planned: kit presets with a
      browser.
      2026-11-24: the repo was restructured (the mod's README, docs and mod.json moved from drum-mode/ to the root;
      the README now carries the feature list, plans and known bugs). No new version or unit result.
      2026-11-25: the Drum Mode off report (I194) was a page left on screen from the previous track; the DRUM page now
      says DRUM MODE IS OFF on such tracks. Known: pads still play in MUTE mode, STEP RECORDING acts like GRID
      RECORDING, PTN + trig copy does not take Drum Mode settings. Passes elekloader's combine check with the OS 1.44
      Mod Shop mods (only Filter-FX run together, in the emulator); OS 1.43-only mods cannot be combined.
      2026-11-26 (README, MANUAL, ui README, design, mod.json, LICENSE): tag v0.10.6; a LICENSE file (GPL-2.0-or-later,
      as elekloader) was added. 0.11.0 on main adds ratchets and note repeat and fixes a reload found on the unit with
      0.10.6: patterns keep only a kit number, so a saved pattern's kit could be changed or reused and FUNC + NO gave
      another kit or Drum Mode off; even a reload the stock refused dropped the kit (I217). 0.11 pins the kits of
      the last 8 saved pattern tracks (an edit makes a copy), allows 8 kits instead of 10 and swaps kits only after the
      pattern is read back. v0.10.6 was submitted to the elekloader Shop on 2026-11-25 (pull request open). Not in
      Modwerk: its Digitone base is core-dn1 2.2 and refuses modules that require others; the author asked whether it
      moves to core 5.x.
    features:
      - "Drum Mode: trig keys 1-8 play eight drum lanes on one MIDI channel, several at once"
      - "note and velocity per pad, with a held pad or on one DRUM page behind LFO (knobs A-H = lanes 1-8)"
      - "live recording writes the pads into the pattern as normal MIDI trigs"
      - "grid editing: a pad picks a lane, the 16 trig keys place its steps; stock locks and micro timing kept"
      - "FUNC + pad mutes a lane; trig LEDs, a lane strip in the screen's corner and a running light on keys 9-16 follow playback"
      - "settings per pattern and per MIDI track, with up to 8 kits per project; a pattern reload brings back its saved kit"
      - "ratchets (2-4 hits per step per drum) and note repeat on held pads at 1/16, 1/32 or 1/64, recorded in live recording"
    sources: [state/NEW.md 2026-11-16, "README (2026-11-16)", "README and MANUAL (2026-11-17)", "README, digiarp-core5/README+NOTES, drum-mode README/MANUAL/design (2026-11-18)", "README, drum-mode/docs/debugging.md (2026-11-19)", "README, drum-mode README/MANUAL/design/ui (2026-11-20)", "README, drum-mode README/MANUAL/ui, mod.json (2026-11-23)", "README, docs, src/mod.json (2026-11-24)", "README, MANUAL, docs/ui, mod.json 0.10.6 (2026-11-25)", "README (2026-11-26)", "MANUAL, design, ui README, mod.json 0.11.0, LICENSE (2026-11-26)"]
    relations:
    - {type: mod_for, id: elekloader, evidence: 'drum-mode/src/mod.json: needs core-dn1 5.3 and seq-events'}
    - {type: uses_tool, id: digiemu, evidence: 'drum-mode README: tests run the firmware in digiemu'}
    - {type: builds_on, id: digiarp-midi, evidence: 'README: a DigiArp MIDI rebuild for core 5.3, in the fork morriess/Digitone-MIDI-Arpeggiator (branch core-5.3; until 2026-11-19 the digiarp-core5 folder), builds one firmware with Drum Mode'}

  - id: supersaw-ot
    name: SuperSAW-OT
    author: jokobol
    kind: mod
    devices: [octatrack]
    repo: https://github.com/jokobol/SuperSAW-OT
    license: "per file (no single licence)"
    status: wip
    tested: "partly"
    tested_note: "2026-11-22: private RAM trials on the author's Octatrack MKII with Modwerk base 0.7.13: sound on T1 with sequencing, p-locks on TUNE, DETN and WIDE, a filter in FX1 and a delay in FX2, beside short FLEX samples on T2-T4, no clicks or saturation reported; whole-unit CPU peaked at 57.1 % over 600 readings (not SuperSAW's own cost); a timed RAM-trial exit ended in needs-recovery once (the unit was then found in normal mode with no modules), two later exits with operator confirmation restored the previous identity; V0.31 earlier passed 18 emulator checks; saved projects, Keep and reboot persistence not yet qualified (README, JOURNAL, REVIEW, read 2026-11-23)"
    base_os: "Octatrack MKII; Modwerk runtime"
    version: "V0.32 source review archive (2026-11-22, REVIEW.md; not installable); V0.31 source snapshot (2026-11-16)"
    last_activity: "2026-11-22"
    notes: >
      A detuned-saw track machine for one Octatrack audio track, for the Modwerk runtime, with six controls (tune,
      detune, mix, one to seven oscillators, width, level). A public source snapshot and test evidence only: no module
      or firmware, not ready to install. Before a first unit trial the base must recognise a missing module. Credits
      Tim Hastie, octabam and Modwerk/elekloader contributors. The author names AI coding assistance. Found by GitHub
      search 2026-11-16.
      2026-11-19 (README): a demo video was added; still no unit trial stated.
      2026-11-23 (README, README.fr, JOURNAL, REVIEW): the machine is monophonic, one instance per Part; OSC sets
      the oscillator count (1-7), not the voices; sub oscillator and chord mode are put off. First hardware trials
      ran in RAM on the author's MKII with Modwerk base 0.7.13 (see tested_note). A V0.32 source archive is posted
      for a Modwerk technical review; the tested package itself is private and no installable module is published.
      Open: missing-machine protection (SW/1), saved projects, Keep, reboot persistence.
    features:
      - "SuperSAW machine with one to seven detuned saws"
      - "stereo width and oscillator mix"
