    status: wip
    tested: emulator
    tested_note: "Pi 0.5.2 with Rytm firmware 0.5.2 is the tested pair (the Rytm side has run on the maintainer's unit since 2026-11-26, I251); Pi 0.5.2 with Rytm 0.5.1.1 or 0.5.0 is not hardware-tested; most feature marks stay in testing (README, what-works-now, 2026-11-28)"
    base_os: "Analog Rytm MKII OS 1.74 only from 0.5.0 (Rytm firmware 0.4.4 is the last for 1.73); the Rytm side is an elekloader module (core 0.1)"
    version: "Sidecar 0.5.2 with Rytm firmware 0.5.2 (2026-11-27; OS 1.74 only, a new flash): MORPH between two scenes on a fader (12 scenes per kit, edited on the Rytm's own pages), a sidechain PUMP or DUCK on every insert chain, WAVETABLE v2 (second table, nine warps, eight filter types), MIDI-page learn rows, CHORD REC; the looper is switched off for now. Earlier: Sidecar 0.5.1.2 (2026-11-24): Pi-only fix release; hello-gated features such as FILL work when the Pi starts after the Rytm, the CONNECTED screen no longer sticks; Rytm firmware stays 0.5.1.1 (0.5.0 works too). Sidecar 0.5.1.1 (2026-11-22), a fixes release between 0.5.1 and 0.5.2: one Pi update file that also runs with the Rytm still on Rytm firmware 0.5.0; an optional Rytm firmware 0.5.1.1 (OS 1.74 only) stops the stock sample layer under Sidecar machines and fixes the SMPL key; black box download, audio previews in the catalog, lag diagnostics. 0.5.1 (2026-11-17, Pi only): touchscreen themes, touch controls, a community machine catalog, BP303, a USB unplug fix. 0.5.0 with Rytm firmware 0.5.0 (2026-11-16): SAMPLER machine, SAMPLE EDIT, FILL, MIST, user send effects, the Rytm's own parameters on the XY pad and by MIDI learn, SD card images, web update; voices 9 dB quieter. The A4 mod stays 0.12, Sidecar Mini 0.1.0"
    last_activity: "2026-11-27"
    notes: >
      A Raspberry Pi 4B/5 on the Rytm's USB port adds digital voices, effects and a sequencer; the Rytm runs a patched
      OS. 0.3.2 adds experimental, emulator-only Digitakt support. The Teensy variant is frozen. GPL-2.0. On
      2026-11-09, Analog Four MKII support since 0.4.0 (A4 firmware a4-v0.12, OS 1.56); 0.4.3 caps the Rytm screen
      redraws after users saw a sluggish Rytm at 20-40 redraws a second. 2026-11-13: a card config editor on the
      documentation site writes the Pi's config.txt and cmdline.txt in the browser.
      2026-11-15 (INSTALL-PI): from Sidecar 0.5.0 a release is to ship a starter zip that fills one FAT32 card with
      the boot files, a new web app (in a hidden folder), every user machine and effect, starter content and demo
      samples; without the web-app folder the Pi serves the classic page.
      2026-11-16 (README, RELEASE-NOTES 0.5.0, KNOWN-ISSUES, docs): 0.5.0 drops the OS 1.73 build; the Pi 5 is now the
      recommended board (2 GB minimum, 4 GB recommended); MORPH, the looper and sidechain moved to 0.5.1. The 0.5.0
      features are marked in testing on their pages. The voices clipped at the stock Rytm's track ceiling in 0.4.x and
      now play 9 dB lower. Do not combine with newer elekloader cores: they store their settings in the bytes Sidecar
      uses.
      2026-11-18 (README, RELEASE-NOTES 0.5.1, docs): 0.5.1 updates only the Pi, from the web page (a .scu file, a
      trial boot, automatic return to 0.5.0 if it does not come back). MORPH, the looper, sidechain and a new
      WAVETABLE moved again, to 0.5.2. A catalog in the web page installs community user machines from a public
      registry (trigcondition/sidecar-machines): native code, no sandbox, not tested by Sidecar. A USB host that
      vanished mid-traffic on the Pi's USB-C port halted the Pi in 0.5.0; 0.5.1 recovers.
      2026-11-22 (docs: troubleshooting, web UI, start here): the docs for the coming 0.5.2 add a Lag now button
      that writes a marker into the Sidecar's black box log when the Rytm feels slow while the Sidecar is attached,
      and a procedure for sending that log (about the last 1.5 to 3 hours, in two files under /.rytm). 0.5.1 is
      still the current release.
      2026-11-23 (README, RELEASE-NOTES 0.5.1.1, INSTALL-PI, docs install-pi, patch-and-flash, start-here,
      upgrading, what-works-now): Sidecar 0.5.1.1 (2026-11-22) is a fixes release. The Pi update works alone, also
      with the Rytm on firmware 0.5.0; the optional Rytm firmware 0.5.1.1 (OS 1.74 only) stops stock Rytm samples
      playing under Sidecar machines (I195) and fixes the SMPL key. A 0.5.0 or 0.5.1 Pi cannot compare a four-part
      version, so the first update needs "Install it anyway". New: black box download with secrets masked, catalog
      audio previews, a Lag now marker. MORPH, the looper, sidechain and WAVETABLE stay in 0.5.2.
      2026-11-25: 0.5.1.2 (I210): /status gains hellos and capsKnown; updating from 0.5.0 or 0.5.1 still needs Install
      it anyway once. MORPH, the looper, sidechain, MIDI learn rows and WAVETABLE are due in 0.5.2.
      2026-11-28 (README, RELEASE-NOTES 0.5.2, KNOWN-ISSUES, INSTALL-PI, PATCHER, docs): 0.5.2 needs the Pi update
      first, then the Rytm's two .elemod files or the patcher build for OS 1.74. WAVETABLE in old projects sounds
      different (WARP above 14 maps to the new warps, chords are gone, P13-P16 are new parameters). Sidechain DUCK on
      a Rytm track or AUDIO IN needs Overbridge mode; PUMP keys off a track's MIDI trigs. Scenes are saved per kit on
      the Pi's card, never in the Rytm's kit or pattern. The elekloader builder pin moved to 2bcafa1.
    features:
      - "a Raspberry Pi 4B or 5 on the Rytm's USB port adds digital voices, effects and a sequencer"
      - "poly tracks on every Sidecar machine"
      - "moves the Rytm's own sound parameters (XY pad, MIDI learn, poly-track p-locks) as an offset; the kit is never written"
      - "user send effects and user machines (Plugin API 3)"
