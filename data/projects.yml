    author: kariGardarsson
    kind: mod
    devices: [digitakt-2]
    repo: https://github.com/karigardarsson/digitakt-ii-research
    license: "MIT (repo root); the Sample Editing Pack AGPL-3.0-or-later (derived from digikit)"
