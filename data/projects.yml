      re/os 1.73/1.74, registry/allocations.toml): a new allocation registry declares a 3 MB DDR pool
      0x47c00000-0x47f00000 for the bundle's buffers (UI and MIDI task buffers only, zeroed on first use), the same
      range Modwerk's own linker uses (O51). CONTRIBUTING keeps an 8 KB reserve in elekloader's area. The guard also
