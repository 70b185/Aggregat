    - {name: "Fast USB", path: "modules/tool/digikit/usb-fast", tested: "unit", note: "2026-11-16: speed round on a DN2 and a DT2 (finding 134, every file hash-checked): sample packs 3.56 / 3.07 MB/s, a 9.8 MB file 4.37 / 4.13 MB/s; 2026-11-14: the take-over from USB AUDIO/MIDI was deleted after I80; in USB AUDIO/MIDI mode an added bulk OUT endpoint (core/usb-bulk-audio, interface 5 on EP2 OUT, replies over SysEx, optional patch set device-audio-bulk) ran on a DN2 and a DT2 on 2026-11-13; Windows stays on SysEx. Earlier: Digitone II 1.12 and Digitakt II 1.17, 2026-11-11; from USB AUDIO/MIDI mode through a take-over to USB MIDI and back (hardware handover); in the standard device patch set since 2026-11-11, on the DT2 with a fast +Drive close; the take-over from USB AUDIO/MIDI lost a Digitakt II from USB until a power cycle in cycle 5 of 20 and, with a hold and PHY fix, cycle 11 (I80), so since 2026-11-13 it is off by default: a unit in USB AUDIO/MIDI stays on SysEx, and USB MIDI mode was fully reliable; 2026-11-18: core/usb-bulk-audio is in the default device patch sets", what: "Sends samples to the unit over an added USB bulk interface instead of SysEx: an 8 MB file at 3.9 MB/s on a Digitone II against 0.68 MB/s over SysEx; falls back to SysEx when the link fails"}
