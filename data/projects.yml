    repo: https://github.com/De-Pattern/DN2-Rift
    license: "AGPL-3.0"
    status: "released"
    tested: "emulator"
    tested_note: "v0.29 gated in the emulators 2026-11-28 (CLEARED TO FLASH, no unit result); it answers two tester reports from units, SMEAR SIZE 121-127 (I252) and a DIGIDRUM kick dropping out next to SPALL (I253); v0.27 and v0.28 gated in the emulators on 2026-11-26 (CLEARED TO FLASH, no unit result); users' units on v0.24-v0.27: RUBBER made voices go quiet and crackle, so v0.28 pulls it (I229); the time guard showed a false CPU marker and left voices out with time to spare (I227), and sample voices and SMEAR dropped out under load (I228), both fixed in the emulators only; v0.24-v0.26 gated in the emulators on 2026-11-25 (CLEARED TO FLASH, no unit result); a user's unit had a track go silent with RUBBER on v0.24/v0.25 (uncleared DDR state at power-on, I216), fixed in v0.26; v0.22 and v0.23 gated in the emulators on 2026-11-24 (CLEARED TO FLASH, no unit result; whether x1.25 removes every click on the unit is open); v0.3-v0.21 are gated in the emulators (v0.20 and v0.21 on 2026-11-23) (CLEARED TO FLASH; v0.13 on 2026-11-20, v0.14-v0.17 on 2026-11-21, no unit result); RIFT kept +24 dB for single-track FLEX takes until v0.21 took dn2mk2 v0.71's measured levels (+6 dB track, +4 dB MAIN/IN; see O48); SMEAR's second vocoder lane runs from DDR and its speed on a unit is unmeasured; PLATEAU's voice can be taken by the voice allocator; v0.9's LINE screens are not yet seen on a unit's display, DIGIDRUM is matched to the Syntakt by ear only, and v0.11 answers a user report of held notes being cut that the emulator did not reproduce at its CPU level; the release notes say RIFT has had very little time on real instruments; SILT's and RESONATOR's sound and DSP load are not yet tested on hardware; the owner reports a FASCIA fault (BEND up, DAMP near 0: uneven decay, voices cutting out, I135); voice counts and SILT costs are emulator estimates (read 2026-11-19; updated 2026-11-22); 2026-11-22: the owner and a tester found on their units that a SMEAR note silenced the whole Digitone until a reboot (v0.16/v0.17, I190); v0.18's fix and v0.19 are gated in the emulators and on a cost model of the unit only"
    base_os: "Digitone II OS 1.11 only (infrastructure from dn2mk2-firmware v0.51); the patcher also needs the user's own Digitakt II OS 1.17 and Machinedrum UW OS 1.63 files"
    version: "v0.29 MONO (tag, 2026-11-28): SMEAR plays one voice per track (a new note fades the old one), SMEAR SIZE and STRT on a fine 0.00-120.00 range, the DIGIDRUM guard priced per drum type, the plate's short delay lines in L2. v0.28 STABLE (tag, 2026-11-26): RUBBER pulled (saved RUBBER sounds load as Multi-Mode), sample machines and SMEAR keep sounding under load, master plate about a third cheaper and bit-exact, DIGIDRUM knob names follow TYPE. v0.27 FLOW (tag, 2026-11-26): no false CPU marker, several CONTOUR voices with FDBK, and from DN2 mk2 the live-record lag fix, FLEX following LEVEL, the MIDI-track arp, ARP OFS IN SCALE and in-key transpose. v0.26 VOC (tag, 2026-11-25): SMEAR VOC back as a keyframe time stretch after heavylight, CONTOUR FDBK as first released, RUBBER silent-track fix. v0.25 SPALL (tag, 2026-11-25): new resonator-particle synth, MIDI machine DIN logo. v0.24 APART (tag, 2026-11-25): RUBBER ladder filter in GLASS's place, SMEAR pitch and speed apart. v0.23 STEADY (tag, 2026-11-24): FASCIA crackle addressed (the DSP time guard budgets RIFT synths x1.25, reserve kept), CPU shown on RIFT machine pages when the DSP drops a voice for time, CONTOUR logo, quick guide. v0.22 FROST (tag, 2026-11-24): GLASS overload fixed (same arithmetic at about 4,200 instead of 7,200 cycles a slot a block, now counted in the guard budget), SMEAR TUNE moves PLAY, new FRZ (freeze), page 2 redrawn. v0.21 PLATE (tag, 2026-11-23): the master reverb is a plate (Dattorro's tank in stereo behind the stock REVERB page), a new start-up logo, PLATEAU withdrawn for rework (a saved PLATEAU track opens as FM Tone), FLEX take levels from dn2mk2 v0.71. v0.20 NXT (tag, 2026-11-23): SLEN NXT (a slide lasts until the track's next trig, from dn2mk2), CONTOUR's FDBK rescaled and in key on high notes. v0.19 CONTOUR (tag, 2026-11-22): a wave-terrain synth"
    last_activity: "2026-11-28"
    notes: >
      A second Digitone II firmware by the dn2mk2 author, separate from that mod: no Machinedrum or Monomachine
      machines, starting with one engine, FASCIA (two exciters into two coupled modal bodies, TZFM, ring and frequency
      shift, a spectral morph, a low-pass gate). Its first commit carries the dn2mk2 infrastructure (build framework,
      SHARC DSL, release gate); FASCIA's model, its float32 DSP-order contract and a bit-exact SHARC program come from
      dn2mk2 branches. Plan (docs/rift.md): stand FASCIA alone, measure its voice count, then integrate and release.
      The test bench is private. Found by find_new (new repo of a catalogued author) 2026-11-13.
      v0.1 (2026-11-13) removes the Machinedrum and Monomachine engines from the DSP image to fit the 2 MiB upgrade
      buffer. The roadmap (docs/rift-roadmap.md) plans per-track insert effects, an LPG filter type, a looping
      function-generator envelope and a granular machine.
      2026-11-15 (releases/v0.3, ROADMAP): FASCIA fits about three voices of the heaviest patches and six to eight
      typical ones; sample voices get DSP time first. Planned next: an ORGAN engine, SILT, per-track insert effects, a
      granular sampler and stereo.
      2026-11-17 (FIRMWARE.md, releases/v0.4, docs/organ.md): v0.4 ORGAN ports the pipe organ of the author's Ravel
      firmware for the M-VAVE FM-1 (GPL-3.0) bit-exact to a float32 reference, then to the SHARC within a stated
      tolerance; it runs inside FASCIA's DSP program under the same guard and costs much less than a FASCIA voice.
      Known issue: FASCIA with BEND up and DAMP near 0 decays unevenly and sometimes cuts a voice (keep BEND at 10 or
      less). Next: SILT (material synthesis), the BEND fix, the reworked FLEX, then a bead engine and a Three
      Sisters-style filter.
      2026-11-18 (FIRMWARE.md, releases/v0.5-v0.6, docs/organ.md, docs/silt-dsp.md): v0.5 adds two ORGAN pages that
      leave v0.4's organ bit for bit at 0; v0.6 adds SILT (type 20) with a DSP cost plan: per-voice DDR delay lines, a
      4-voice cap with the oldest voice stolen, graceful degradation of ensemble size, cost and stress gate steps with
      a negative control. Known issues in v0.6: v0.5 ORGAN sounds with MIXT up change (old PHRM/VELO values read as
      MTUN/MCHR); FIBER plays about twice as loud as the other materials. Planned: SILT level matching, CPU guardrails
      for every engine, LIGATURE (a modular voice wired by the user), the reworked FLEX.
      2026-11-19 (FIRMWARE.md, releases/v0.8): v0.7 takes FLEX buffers, MUTE SRC and the NAME screen over from dn2mk2
      v0.54-v0.57; v0.8 brings back RESONATOR as machine type 22 (24 two-pole modes a voice, a mallet blended with a
      noise burst; notes ring through retriggers, a rung-out voice costs nothing, the newest notes are kept when time
      runs short). Next: a new screen style, LIGATURE and the first FX machines.
      2026-11-20 (FIRMWARE.md, releases v0.9-v0.11): v0.9 removes RESONATOR again at the owner's decision (a v0.8
      RESONATOR track opens as FM Tone), lists LIGATURE in MACHINE SEL and draws every RIFT machine on LINE pages (two
      rows of four moving glyphs, values shown the Syntakt way, locked cells inverted while their trig is held); a
      manual sits behind the patcher's MANUAL button. v0.10 puts DIGIDRUM on machine type 22, RESONATOR's old number,
      so a v0.8 RESONATOR track never re-saved in v0.9 opens as DIGIDRUM with its old values read as DIGIDRUM's. v0.11:
      the frame guard rendered voices newest first, so a melody or a re-struck note took the time and a held chord
      was stolen (a user report); now voices whose note is off go after every held voice. More held notes than the
      DSP can run still lose the oldest. Planned: THOLET (a piano leaning toward a Rhodes), a
      granular phase-vocoded looper in WERP's place, FX machines that other tracks feed, an own stretch algorithm.
      2026-11-21 (FIRMWARE.md, releases v0.13-v0.14, docs/microtuning.md): v0.13 PARITY ports the DN2 mk2 mod's
      v0.60-v0.63 sampler updates (live slice edits, zero-crossing snap, GRID's ALLOCATE SLICE fix, a FLEX save that
      does not normalise, +24 dB on single-track FLEX takes, which the mod itself cut to +12 in its v0.65 after a
      tester's measurement: I185). v0.14 MONTUNE adds recorder MON, microtuning (every RIFT machine retunes; SLICE and
      GRID never; the same +Drive record region as the mod, not cleared by ERASE MOD DATA yet) and +12 dB playback for
      FLEX takes of MAIN and IN. Planned: THOLET, the granular looper, more LIGATURE blocks, and the mod's keyboard HOLD.
      2026-11-22 (FIRMWARE.md, README, releases v0.15-v0.17, docs/smear.md, docs/tholet.md): v0.15 adds THOLET and
      the DN2 mk2 mod's KEYBOARD HOLD; the DSP upload then had 1.3 KB left of its 1 MiB. v0.16 SMEAR takes WERP's
      place (a saved WERP track opens as SMEAR with odd settings) with three readers of one loop: a phase vocoder, a
      tape-like read and eight grains. To make room the ColdFire sends ORGAN's, THOLET's and SMEAR's tables to the
      DSP at power-on, and those machines stay silent until the tables arrive. v0.16 also adds eight LIGATURE blocks
      and machine logos in MACHINE SEL. v0.17 PLATEAU is RIFT's first FX machine: a track fed by the sum of chosen
      tracks (the BUS page); only one plays at a time. THOLET is removed (its tracks open as FM Tone). All gated in
      the emulators, no unit result. The README now says "in development, released in small steps".
      2026-11-23 (FIRMWARE.md, releases v0.18-v0.19, notices/2026-11-22-smear-plateau.md): a notice told users not
      to play SMEAR or PLATEAU on v0.16/v0.17: on the owner's and a tester's units a SMEAR note silenced every
      machine until a power cycle (I190). v0.18 turns SMEAR's vocoder off, makes the frame guard expect a voice's
      peak cost, replaces any non-finite or runaway block with silence, and prices every machine's worst block on
      a cost model of the unit (memory waits included) in the gate. It also adds GLASS, a filter type that a sound
      saved with it loads as Multi-Mode on stock or the DN2 mk2 mod. v0.19 adds CONTOUR, a wave-terrain synth
      whose idea comes from TERRAIN for the Digitone II (terrain-dn2); none of its code is used. The DSP image is
      1,042,588 of 1,048,575 bytes. Power-cycle once after flashing: the first start can leave ORGAN silent.
      2026-11-24 (v0.20, v0.21): a slide trig with no SLEN lock now lasts until the next trig, not one step (lock
      SLEN 1 for the old timing); a high CONTOUR note with feedback costs the DSP up to about four times more.
      v0.21's plate replaces the call of the stock reverb core and keeps sends, routing and LFO destinations;
      PLATEAU's 9 KB of DSP upload went to the plate. Takes a track recorded on earlier versions stay 18 dB hot
      (GAIN -18). Known: GLASS on several busy tracks can run the DSP past its frame and SMEAR's TUNE does nothing
      at BLND 0, both fixed in a gated v0.22 not yet released.
      2026-11-25: owner reports from the unit drove v0.22/v0.23: GLASS on many busy tracks sounded crushed like a
      Monomachine overload (fifteen tracks cost 279k cycles over an idle frame of 415k), and FASCIA crackled on v0.21
      even with one note because the guard dropped a lone voice. SMEAR VOC (phase vocoder) stays off since v0.18. Next
      planned: RUBBER filter, SPALL machine.
      2026-11-26 (FIRMWARE.md, releases v0.24-v0.26, docs/smear.md): v0.24 replaces the GLASS filter with RUBBER, an
      SH-101-style four-pole ladder (zero-delay feedback, soft saturation, self-oscillation; sounds saved with GLASS open
      with RUBBER), and SMEAR now moves pitch and speed apart. v0.25 adds SPALL (machine type 26: tiny events on a
      stochastic clock rung through two resonators) and a DIN logo for the MIDI machine; on the way to the gate a test
      found SPALL's DSP routine labels duplicated SILT's, so a unit test now fails any label defined twice. v0.26 brings
      SMEAR's VOC back as a keyframe time stretch modelled on heavylight's Capicola and dt2-keyframer (credited, with
      permission; about 5,000 cycles a voice a block against 200,000-270,000 for the old phase vocoder), restores
      CONTOUR's original FDBK range, and fixes a user's report that RUBBER left a track silent: its DDR state was never
      cleared at power-on (I216). All three gated in the emulators (CLEARED TO FLASH), no unit result.
      2026-11-27 (FIRMWARE.md, releases v0.27/v0.28, docs QA.md, inkey.md, midiarp.md, qa/LEDGER.md,
      qa/TAKEN-v0.27/v0.28): the DSP time guard now prices a voice at its last block x 1.25 and charges a higher floor
      only on the block that triggers it, after the old peak-on-every-block pricing left voices out with time free (I227,
      I228). Every release also gets an advisory review by a separate agent session against a frozen release branch; each
      finding is recorded as taken, deferred or declined, and a per-release ledger lists each machine's worst block on the
      cost model. The v0.28 gate was stopped and restarted after that review found two time floors set too low. The DSP
      program is nearly full (about 2 KB left in the 1 MiB program and about 800 bytes in the 2 MiB image), so DN2 mk2's
      PERFORM and extra project RAM banks do not fit. v0.27 takes the MIDI-track arp and in-key transpose code from
      upstream dnfw through DN2 mk2; those were tested on upstream's units, not on RIFT's.
      2026-11-28 (FIRMWARE.md, releases/v0.29.md, docs/qa/TAKEN-v0.28.md): v0.29 compiles out RUBBER's page code, adds
      a gate case that retriggers 16 ONESHOT voices together, and plays the whole loop for a project saved with SIZE
      above 120. Known: one report of FASCIA silent until its patch was cleared, not reproduced.
    features:
      - "SMEAR: looper after the Qu-Bit Nebulae (in WERP's place) with pitch and speed apart: keyframe time stretch (VOC), tape-like read and grains"
      - "RUBBER ladder filter (v0.24-v0.27) pulled in v0.28; saved RUBBER sounds load as Multi-Mode"
      - "SPALL: tiny clicks, dust, grains or chips on a stochastic clock rung through two resonators"
      - "PLATEAU: plate-reverb FX machine fed by a BUS of chosen tracks; FLEX can record the BUS"
      - "FASCIA: physical and spectral percussion and tuned-body engine (two exciters into two coupled modal bodies), 32 p-lockable controls"
      - "ORGAN: pipe organ (stops, drawbar ranks, chiff, wind, tremulant, celeste) plus ATTACK and BREATH pages"
      - "SILT: material synthesis (string, grains, skin, fluid) played by ten gestures, alone or as an ensemble"
      - "Digitakt II sample machines from the DN2 mk2 mod (ONESHOT, STRETCH, REPITCH, GRID, SLICE)"
      - "FLEX live-buffer machine with MUTE SRC and buffer locks"
      - "+Drive sample library, recorder, Direct Jump and parameter slides kept from the DN2 mk2 mod"
      - "DIGIDRUM: six digital drum voices after the Syntakt's, the voice p-lockable per trig; LIGATURE, a modular voice (22 blocks)"
      - "arp on MIDI tracks, ARP OFS IN SCALE and in-key transpose, taken from upstream dnfw through DN2 mk2"
    sources: [state/NEW.md 2026-11-13, "README (2026-11-13)", docs/rift.md, "FIRMWARE.md, docs/rift.md, releases/drafts/v0.1.md (2026-11-13)", "README, releases/v0.3.md (2026-11-15)", "FIRMWARE.md, releases/v0.4.md, docs/organ.md (2026-11-17)", "FIRMWARE.md, releases/v0.5-v0.6, docs/organ.md, docs/silt-dsp.md (2026-11-18)", "FIRMWARE.md, releases/v0.8.md (2026-11-19)", "FIRMWARE.md, releases v0.9-v0.11 (2026-11-20)", "FIRMWARE.md, releases v0.13-v0.14, docs/microtuning.md, docs/memory-map.md (2026-11-21)", "FIRMWARE.md, README, releases v0.15-v0.17, docs/smear.md, docs/tholet.md (2026-11-22)", "FIRMWARE.md, releases v0.18-v0.19, SMEAR/PLATEAU notice (2026-11-23)", "FIRMWARE.md, releases/v0.20.md, v0.21.md, docs/slides.md (2026-11-24)", "FIRMWARE.md, releases v0.22/v0.23, docs/smear.md (2026-11-25)", "FIRMWARE.md, releases v0.24-v0.26, docs/smear.md (2026-11-26)", "README (2026-11-26)", "FIRMWARE.md, releases v0.27/v0.28, docs QA.md, inkey.md, midiarp.md, qa/* (2026-11-27)", "tag v0.29, FIRMWARE.md, releases/v0.29.md, TAKEN-v0.28 (2026-11-28)"]
