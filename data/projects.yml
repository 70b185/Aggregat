  # ---------------------------------------------------------------- Digitakt II
  - id: digitakt-ii-research
    name: digitakt-ii-research (Deja Vu LFOs, ONESHOT zoom)
    author: kariGardarsson
    kind: mod
    devices: [digitakt-2]
    repo: https://github.com/karigardarsson/digitakt-ii-research
    links:
      releases: https://github.com/karigardarsson/digitakt-ii-research/releases
      release_latest: https://github.com/karigardarsson/digitakt-ii-research/releases/tag/v0.2.0-beta
      forum_deja_vu: https://elektronmods.com/thread-80-good-news-everyone-i-got-deja-vu-lfos-running-on-the
      forum_waveform_zoom: https://elektronmods.com/thread-83-good-news-everyone-i-added-waveform-zoom-to-the-digitakt-ii
    status: beta
    base_os: "Digitakt II OS 1.17 (recommended; Deja Vu + ONESHOT zoom) and 1.16 (Deja Vu only)"
    version: "v0.3.0-beta \"All-in-One\" (2026-10-23) per altstrument; GitHub releases page showed v0.2.0-beta (18 Oct) as newest when read"
    last_activity: 2026-10-21
    notes: >
      Windows standalone builder (portable, no Python/Git/WSL needed) that takes the user's own official OS file, identifies it by
      SHA-256, writes the patched .syx; the user installs it with Elektron Transfer. The builder never connects to the instrument
      and never flashes. Adds two random-loop LFO waveforms on all three LFOs: DV-F (WAVE 7, free-running) and DV-T (WAVE 8, read
      position resets on track trigger); MODE = 2/4/8/16/32 steps; SPH = randomness (0 new values each step, 64 locks values and
      order, 127 keeps values but reorders, in between blends); stock WAVE 0-6 stay on stock paths. v0.2.0-beta adds a ONESHOT waveform
      zoom (encoder C cycles 1x, 2x, 3.75x, turning C pans; only in the combined 1.17 edition). Hardware: all three outputs validated
      on a physical unit for normal boot and operation, described by the author as beta evidence, not exhaustive. Open: broad MIDI /
      sequencer / transport / sync regression, save-reload-power-cycle persistence, long-duration stability. Unsigned .exe (SmartScreen
      warns). Repo: docs/INSTALLATION.md and docs/RECOVERY.md, windows-builder/, src/dv/ (host model), coldfire/ (DV, routing, trampoline,
      startup-allocation source), research/ (byte-backed findings), tools/midisniff.py (passive SysEx capture, does not transmit).
      Evidence ladder used by the author: SOURCE/STATIC, HOST, SYNTHETIC UNICORN, NATURAL EMULATED, HARDWARE. MIT, 7 commits, 4 stars.
      Credits: Marbles (concept only), Bezronczek's Syntakt Firmware Workbench (behavioural reference), ElekLabs digikit (research tooling,
      not bundled), elektron-firmware-tool (vendored).
    latest_seen: >
      altstrument lists it as "Digitakt II All-in-One" v0.3.0-beta (2026-10-23) for OS 1.17: patches in Plaits models, DX7 banks, the Deja Vu random-loop LFO, WAVE tables and the one-shot zoom; brick-risk flag set. LICENSE CONFLICT: the repo README/LICENSE we read says MIT, altstrument says AGPL-3.0-or-later - check the repo before reuse. Earlier releases 0.2.0-beta (2026-10-18), 0.1.1-beta (2026-10-17).
    sources: [forum threads 80 and 83, GitHub README, GitHub releases]

