      Pi 5, send-effect slot) puts the resonance on the fourth knob (Smear) and fixes flutter; TIME can sync to the
      Rytm's tempo. Projects saved with 1.0.0 would read Flutter as Smear, so 1.1.0 is not compatible with them. Tested
      on a Pi 5 by the porter; no Rytm-side facts.
