    base_os: "Octatrack MKII only; replaces the OS (Elektron's bootloader and Startup Menu stay untouched); the install file is built from the user's own copy of the official OS file, OS 1.40C"
    version: "v0.9.5-beta (tag, 2026-11-19): a repair release, no new features (headphones from a cold start, MKII headphone L/R order, level lamps, NO backs out, sequencer lock and MIDI timing, kits A to Z); simulator-tested only. v0.9.4 (not released separately): eight MIDI tracks, crossfader modes, Dutch, 8 patterns and song mode. v0.9.3-beta (2026-11-13): BBD removed, engine in DSP core 0's private memory"
    last_activity: "2026-11-19"
    notes: >
      An operating system of its own for the Octatrack MKII, not a patch of Elektron's OS: a weather-driven multi-effect
      on inputs A-D (up to seven effects whose knobs the chosen weather moves) and an 8-track sequencer groovebox
      (sampler, sub, FM, noise, Karplus-Strong and polyphonic MIDI machines, p-locks, ratchets, per-track cellular
      automata), plus LFOs, a Lorenz attractor and boids as modulators. ColdFire part in C, effects in hand-written
      DSP56300 assembly. Installing it removes the stock OS until it is reinstalled from the card; both keep their
      saved data in the same battery-backed SRAM, so back up before switching. The build uses the Modwerk SDK's tools
      (not included); aeria-os/HARDWARE.md and AUDIO.md map the MKII for writing an OS from scratch, largely from
      octabam's and Modwerk's documents. Some effect folders (head, tap) are marked as someone else's work. Made with
      Claude Code (README). Found by GitHub search 2026-11-13.
      2026-11-14: docs/CHANGELOG.md lists every release build and what was checked on the unit; docs/LOG.md is the
      request log of the 9-13 Nov build, with the hardware findings now on the Octatrack page and incidents I83-I86.
      2026-11-20 (tag v0.9.5-beta, README, new docs/AERIA_PROJECT_SPECIFICATION.md, CHANGELOG, LOG, aeria-fx
      test_results): the weather is trimmed to CLEAR, RAIN, FOG and AURORA (with a WX OFF switch); DIST, WIND, HAIL,
      TWISTER, BBD and the master EQ are gone. Builds of 2026-11-15/16 added eight MIDI tracks beside the audio tracks,
      a sequencer reverb bus, per-track routing to main, cue and headphones, crossfader modes, Dutch, 8 patterns and
      song mode, and were flashed on the unit. On 2026-11-15 a mis-encoded DSP multiply put garbage on the headphones;
      the build now refuses that form. After flashing the headphones were still silent (2026-11-17); v0.9.5 blames the
      cold-start order of the DSP clock and the output ring (a RAM boot cannot show it) and is not yet tested on the
      unit. New: aeria-os/sim runs the real image and both DSP programs on octabam's emulators with ten test suites;
      the specification lists the MKII facts used (output slot order, level lamp ids, battery RAM layout) and what
      only the unit can show. Cheaper effects since 2026-11-13: SMEAR with a 512 hop (1,165 -> 641 instructions a
      sample), VERB and AURORA at half rate (1,145 -> 736, 216 -> 165).
    features:
