    contains: "modules/ (2026-11-25: new browse-path-guard, midi-loopback-scenes; 2026-11-22: new fet76, vca160; 2026-11-20: new page-loop, trig-mute, track-trig-mode, lock-edit, chop-tempo; 2026-11-19: lazy-chop, src3-key, zoom-keep; 2026-11-16: new remote; 2026-11-11: new drummer and drummer-probe; 2026-11-12 free-loop documented; 2026-11-10 wavecf, xfcurve, keybus, sc-keybus-bridge, dlcopy; DSP wave removed), among them: analog-bassdrum, bbd, blackpyramids-303, browse-path-guard, busdelay, busverb, cc-map, chords, cxosc, direct-jump, drummer, distorx, fet76, free-loop, euclid, fx2-lock, lofi-amf-fix, lofi2, midi-follow, midi-loopback, midi-loopback-scenes, midi-scales, midi-scenes, miniverb, morph, mute-modes, octa303, quantizer, rec-trig-mute, recorder-loop-fix, remote, resonator, scenes-p2, scope, shatter, sidechain-compressor, slow-lfo, spectrum, stuttr, synth, tapeecho, trackpatterns, tuner, usb, varispeed, vca160, verb-parts, verberation (with the hall, plate and room rows), vibrato, vocoder (others are probes and infrastructure); modules/README.md lists every module by group with its author; 2026-11-28: new octa303-seam (aCiDtRacK's hybrid 303 in the test remix test/octa303-seam only)"
    tested: partly
    tested_note: "2026-11-27/28 (v0.6, HARDWARE_V06): release candidate OCTABAM R1 flashed on the author's MKII; 12 of 12 REMIX SWITCH boots between three R1 images came back; the octabam (7 layouts) and octabam-verbs (9 layouts) matrices ran with no crash, freeze or overload; the DISK MODE corruption fix measured against a pre-fix image (79 of 3,306 blocks wrong before, 0 after, I203); driving DISK MODE from the cable was refused after the unit sat idle (I249); not run on a unit: TEMPO BUS copy and scene locks, KIT templates, a switch on an MKI, octabam-bus this round. 2026-11-27: REMIX SWITCH's USB controller reset measured on the author's MKII: stops fell from 6 in 22 to 3 in 170 self-boots (I231); FRAME GUARD's 140 µs edge let an MKII stall at 135.6 µs and is back at 110 µs, which brings back the MKI's bar-start click (I232; the 110 µs edge not yet soaked on the image that stalled). 2026-11-16/22: USB MIDI TRACKS ran on the author's MKII via REMIX SWITCH (no flash): no stall, longest frame entry gap 367 µs; ARR ROW CAP, the DISK MODE fix, FRAME GUARD 140 µs and VERBERATION changes not flashed. 2026-11-24: the revised SHATTER FOLD was tested on an MKII by a contributor; COPY PROJECT's first SAVE TO NEW version ran on a unit (I202), the current one has not; TEMPO BUS and SCENES P2 changes emulator only. v0.4 as the web builder publishes it ran a 32-transition loader soak on a contributor's MKII (2026-11-08, 32/32 applied); DLCOPY at the end of the DSP frame ran 12 of 12 clean runs with 251 loads on an MKII (2026-11-15, I108); each module's proof is graded BUILD, EMULATOR, RENDER, UNIT or UNIT_MEASURED; REMOTE measured on an MKII (one of ten commanded REMIX SWITCH boots hung, I110); 2026-11-22: the three v0.5 images, booted by REMIX SWITCH on the author's MKII (none flashed), passed the meter, transport, USB and DSP-watch checks; the 32-program-change soak left 3 of 32 unapplied on octabam, 0 on octabam-verbs (with 32 bad DSP records) and 0 on octabam-bus; the long mixed soak did not complete on any (INEW1); module changes after the tested commit are in v0.5 without a unit run; FET76 and VCA160 ran by ear on a contributor's MKI in his own images (VCA160 as dB666 since 2026-10-11), not in their octabam form; 2026-11-25/26: OCTABAM 82/83 SEQ changes confirmed on a contributor's MKII, CX OSC's new renderer measured there with LOAD METER (four fully engaged tracks fit, five pass the frame); BROWSE PATH GUARD, MIDI LOOPBACK SCENES and the USB/DIN MIDI fix not flashed"
    base_os: 1.40C
    version: "v0.6 (tag 2026-11-28, the web builder's version): the same three remixes; since v0.5 REMIX SWITCH resets USB before its soft reset, a USB attach watchdog, the USB/DIN running-status fix, USB MIDI paused in DISK MODE, FRAME GUARD back at 110 µs, ARR ROW CAP, BROWSE PATH GUARD, KIT templates, OCTA303 v10.0, MIDI LOOPBACK with MIDI SCENES, VERBERATION modes and TEMPO BUS copy, paste and scene locks; the release candidate OCTABAM R1 was flashed on the author's MKII. Earlier: v0.5 (tag 2026-11-22, the web builder's version): the builder and the site publish three remixes, octabam, octabam-verbs (VERBERATION in place of the three stock reverbs, plus VIBRATO, TRANSIENT and RESONATOR always loaded) and octabam-bus (delay and reverb bus with a SEND on every track, no demand loader); octabam gains over v0.4 SCOPE, SCALES, WAVE (ColdFire), CHORDS FACTORY with PAGES, SCREEN, SLOW LFO, BAR LED, REC CS1 SKIP, KEYBUS, FRAME GUARD and REMOTE; EUCLID FILL renamed SEQ; ships with the DARK REV + MODULATION stall as a known fault. Unreleased (2026-11-22/23): FET76 (1176-style limiter) and VCA160 (dbx 160-style compressor keyed through KEYBUS), KEYBUS publishes a mean-square word per track"
    last_activity: "2026-11-28"
    notes: >
      Modular Octatrack OS 1.40C "remixer": bus and track effects, FM synth machine, 255 kits, USB audio/MIDI, stock bug fixes. Base of Modwerk. Licence: MIT; distribution: patch-your-own. Listed by altstrument; README, CHANGELOG and contributing docs read 2026-11-10. 2026-11-03: new midi-follow module (docs/site/usage/midi-follow.md, a test remix); not read further. 2026-11-10: WAVE (wavecf) is a 4-voice wavetable machine on the ColdFire, reduced from CHOMPI WAVE, heard on an MKII in builds W1-W6 (I58); XF CURVE offers 13 crossfader curves, run on a contributor's MKII on 2026-11-06; KEYBUS publishes each track's block peak for side-chain keys (make check only); a demand-loader soak with STEM REC froze an MKII (I57, open). 2026-11-12/13: new FRAME GUARD module holds a late frame interrupt out of a window in which the DSP's frame exchange stalls at START or a program change (I82); with it 32 first STARTs and 192 program changes ran clean on an MKII with a 20-channel USB capture. MIDI SCENES: CLEAR, COPY and PASTE SCENE act on the MIDI and audio locks together in either track mode, and a scene held across the MIDI key shows its locks as a fresh press does.
      2026-11-15 (FAILURE_MODES, TRAPS, CHIP, MODULES): a program change to a demand effect that was not loaded
      stopped the audio in about two runs of three on an MKII while panel and USB still answered (I108); moving the
      loader's copy from the head to the end of DSP core B's frame cured it in 12 of 12 runs. A new gate lets a DSP
      instruction form ship only with a stock site, a register row or a module proven on a unit; a tool lists modules
      changed since their unit proof.
      2026-11-16 (unreleased, 2026-11-14/16): REMOTE, an event ring a host reads over USB with PEEK and four commands;
      SCOPE and TUNER share the TEMPO key in the octabam remix; DRUMMER's KIT BALANCE takes step and scene locks; a LIM
      stereo peak limiter after MIX on RESONATOR and SHATTER; MIDI SCENES sends the Part's value when no scene locks a
      CC; SCALES keeps one audio scale per bank and Part; a ColdFire instruction-form check reports forms but refuses
      none yet.
      2026-11-17 (CONTRIBUTING, remixes, TESTING): contributors' own remixes now live in remixes/community/<name>/
      and may not use the octabam name; cxosc-core moved there. One module per pull request. CI runs one unit per
      gate job and skips units whose gates already passed for the same image.
      2026-11-18 (CHANGELOG, TRAPS, firmware docs, module READMEs): PATTERN MUTE's per-pattern layer had been stored
      in byte 40 of each audio track record, which is the low byte of the one-shot trig mask; on an MKI a one-shot on
      step 1 or 2 read as a mute and an unmute deleted it (I146). The layer now lives in its own pmute.work side file
      and a 48-byte battery copy, and the double-FUNC switch ignores FUNC chords. DIRECT_JUMP_KYOTI V7.3 is pinned.
      New stock reading: SAVE PROJECT's job path, the PART window and its edit menu, the key-layer list per window,
      and the stock WAV header's RIFF size 8 bytes over the specification.
      2026-11-19 (README, modules lazy-chop, src3-key, zoom-keep, CYCLE_SCAN, COSTS, CHIP, TRAPS): three audio-editor
      modules by a contributor, all on main and unreleased: LAZY CHOP slices a playing sample by tapping TRIG 1-16 (four
      pages, up to 64 slices, STUDIO and LIVE CHOP, ZERO SNAP, undo), SRC3 KEY starts and stops an SRC3-only recording
      with [MIDI] in the audio editor (MKI only), ZOOM KEEP keeps the editor's zoom per page; all three ran on the
      contributor's MKI (2026-11-10..14) with no issues found, ZOOM KEEP's across-tracks part in the emulator only. A
      new tool prices every module and stock effect from the DSP56300 manual's cycle table; against the unit's LOAD
      METER it reads about 3 % high on average (38 settings, 22 effects).
      2026-11-20 (README, five new module READMEs and usage pages, FAILURE_MODES, HARDWARE_TESTING, TRAPS, DSP module
      READMEs): five new contributed modules, unreleased. From Hteah's ot-mods (entry ot-mods-hteah), ported by a contributor: PAGE LOOP (GRID
      REC: PAGE + trig 1-4 loops that page of the current track, in time), TRIG MUTE (hold a step + FUNC; the mute is
      kept as the trig's condition + 65, so stock plays such a trig and shows ERR) and TRACK TRIG MODE (CHROMATIC /
      SLOTS / SLICES per audio track, saved as a comment line stock skips); the readmes report each on an MKI in
      the author's ACCLOOP images since 2026-10-25/28, the octabam table grades them emulator only. By the LAZY CHOP contributor: LOCK
      EDIT ([TRIG] + [BANK] in grid recording opens the audio editor on the step's sample and slice; on an MKI
      2026-11-14) and LAZY CHOP TEMPO (a BPM popup from the chop spacing; a personal build on an MKI read a 73.5 BPM
      take within 1 %, 78 % of 27 known-tempo takes within about 1 BPM offline; the final build not yet on a unit).
      Ten DSP effects got bit-identical speed passes (modelled, not measured on a unit; STUTTR no longer writes an
      M register inside its sample loop). New unit reports on an MKII (BUILD 05): the remote-commanded REMIX SWITCH
      boot hang is now seen three times (I110); a project reload after a demand-loader phase left the DSP frame count
      stopped three times; DARK REV picked on all eight tracks while MODULATION was loaded stopped the DSP in 6 of 9
      replays. A host tool now loads projects and switches images over USB.
      2026-11-22 (README, DSP_AUDIT (new), CYCLE_SCAN, FAILURE_MODES, TRAPS, module READMEs, remixes): no new
      release. A DSP audit register lists 34 techniques that make effect code shorter or cheaper with bit-identical
      output, applied to most DSP effects (MINIVERB's modelled cost 13.4 to 11.2 % of a frame, VERBERATION's 10.1 to
      8.7 %); modelled only, not measured on a unit. The DARK REV stall (I170) was narrowed on an MKII: it needs
      MODULATION loaded when DARK REV starts on many tracks; a stock-effects image without the demand loader did not
      stall in 60 starts. Two diagnostic builds had placed SIDECHAIN_COMPRESSOR's stubs inside the window DARK REV
      writes (I188), so their results were discarded and the build now refuses such placements. Commanded REMIX
      SWITCH boots (I110) failed mostly while the DSP was stalled. New author reports on units: BATCH_BUGFIXES
      lights [BANK] for banks with trigless locks and ERASE_EMPTY_TRIGLESS_LOCKS works on MIDI tracks (MKI, KYOTI
      release candidate), CX OSC's INDX changes the saw and triangle carriers, VOID's NBR follows the KEYBUS level
      (MKII).
      2026-11-23 (CHANGELOG, tag v0.5, README, modules/README, fet76, vca160, keybus and morph READMEs, GLOSSARY,
      remix pages, FAILURE_MODES): v0.5 is the web builder's version, with three remixes. Its release check on the
      author's MKII left 3 of 32 program changes unapplied on octabam (INEW1); it ships with the DARK REV stall as
      a known fault, which octabam-verbs (no stock DARK REV) and octabam-bus (no demand loader) avoid by design
      but were not run against. A contributor's FET76 and VCA160 arrived after the tag; VCA160's KEY now reads a
      mean-square word that KEYBUS publishes for every track, so it no longer needs a hook of its own. MORPH v1.2
      adds a way back (RET, CURV, END), simulator only. Most of the diff moves or shortens docs.
      2026-11-24 (CHANGELOG, module READMEs, untagged): TEMPO BUS takes scene locks on the bus delay and reverb
      knobs; SCENES P2 also locks from scene B; COPY PROJECT makes stock SAVE TO NEW carry the sidecar files except
      .strd (I202); KITS now needs BATCH_BUGFIXES; WAVE ends every note on STOP; SHATTER gets DRV and FOLD gain
      compensation; THIRD_PARTY.md credits PAGE LOOP, TRACK TRIG MODE and TRIG MUTE as MIT code from Hteah/ot-mods.
      TRIG MUTE's docs now say stock turns a muted trig into an unmuted 8:8 trig on project load.
      2026-11-25: unreleased since v0.5: ARR ROW CAP (works around SB38), USB MIDI TRACKS (audio-track trigs out as
      USB MIDI, CC 16-21 with the scene morph), USB MIDI paused while the host has the card (I203), FRAME GUARD lower
      edge 140 µs (I204), MACHINES (one machine-list holder for added machines, up to three clients such as DRUMMER
      and ANALOG BD), VERBERATION modes (80S replaces GATED). In octabam-verbs VERB PARTS rewrites a stock reverb id
      to VERBERATION; BRAIN's PART tab is now KIT; RESONATOR's page layout changed, so saved Parts read some slots
      differently. REMIX SWITCH now refuses with DSP STOPPED: REBOOT when no frame comes in 20 ms (I110).
      2026-11-26 (CHANGELOG, TRAPS, module READMEs, unreleased): BROWSE PATH GUARD keeps the sample browser working on a
      file whose path passes the card's 259 characters (the stock browser locked up until a power cycle, SB42);
      USB MIDI no longer corrupts DIN running status in the one shared stock framer (I222); MIDI LOOPBACK is now in
      octabam and octabam-verbs, and a bridge sends MIDI SCENES' CCs to each track's loopback destination. CX OSC's
      renderer costs about half as much with its morphs in use, but the docs now say four tracks, not six, when every
      morph, PWM, FOLD and feedback is engaged (measured on an MKII). LOFI2 steps through useful values with FUNCTION
      held; PLOCKS P2 toggles a lock with a knob press; SEQ RAND starts at a random pitch and JUMP sets its largest move.
      2026-11-27 (CHANGELOG, FAILURE_MODES, TRAPS, frame-guard and remix-switch READMEs; unreleased): FRAME GUARD's lower
      edge is back at 110 µs because an MKII stalled with an entry 135.6 µs late, under the 140 µs edge set for the MKI
      (I232); no single edge separates the two models on the data so far. REMIX SWITCH stops and resets the USB controller
      before its soft reset, which cut stops after a self-boot but did not end them (I231). Most of the rest of the diff
      is a wording pass over the README, guides and usage pages.
      2026-11-28 (tag v0.6, release notes, CHANGELOG, HARDWARE_V06 (new), FAILURE_MODES, HARDWARE_SUITE, module
      READMEs octa303-seam (new), octa303, devilish, usb): v0.6 is tagged; OCTABAM R1 was flashed on an MKII and 3
      stops in 170 REMIX SWITCH self-boots remain open (I231). Driving USB DISK MODE from the cable is refused after a
      few minutes idle until a panel key is pressed, cause unknown (I249). Leaving DISK MODE reloads every bank but
      the current one, so the loader now moves to bank H first (I250). OCTA303 v10.0 loses its 11 kHz whistle and VCA
      clipping, DRIV tops out at +10 dB (was +18) and WAVE gains R variants with Roland's factory cutoff trim; a FLEX
      track on a sample named TB303* now just plays the sample. The new OCTA303 SEAM module (from aCiDtRacK) takes
      ANALOG BD's DSP seam, so the two cannot share an image. The USB attach watchdog restarts USB when the
      session-valid edge was lost; it fired 0 times in 51 real boots.
    features:
      - "pick modules and build your own Octatrack OS 1.40C image in the browser; install from the card or over MIDI"
      - "three ready remixes: octabam, octabam-verbs (one reverb for rooms to halls) and octabam-bus (delay and reverb bus)"
      - "track effects and dynamics, among them FET76 (1176-style limiter) and VCA160 (dbx 160-style, keyed from any track)"
      - "machines: FM synth, two 303 voices, analog-style bass drum, wavetable, complex oscillator, a drummer"
      - "sequencer and editor additions: SEQ, PAGE LOOP, TRIG MUTE, LAZY CHOP, MORPH, 255 kits, PATTERN MUTE"
      - "USB audio and MIDI, MIDI scenes, MIDI loopback to its own tracks, a MIDI-pedal looper"
      - "fixes for stock bugs (among them the arranger row limit and the sample browser's path overflow), and FRAME GUARD against DSP stalls at START and program changes"
      - "audio-track trigs sent as USB MIDI notes and CCs (USB MIDI TRACKS, unreleased)"
