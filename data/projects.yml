    - {name: "usb-audio-in-ot", devices: [octatrack], path: "mods/usb-audio-in-ot", tested: "emulator", note: "octabam's emulator with a USB host harness", what: "Audio from a computer over USB in place of the Octatrack's inputs"}
    - {name: "dspbusy-dn2", devices: [digitone-2], path: "mods/dspbusy-dn2", tested: "not-stated", what: "Optional DSP load meter for core-dn2 0.3 on the Digitone II (OS 1.12)"}
    - {name: "Drive Loader", devices: [analog-rytm], version: "0.11", path: "mods/drive-loader-ar2", tested: "partly", note: "0.4's timing fixes came from a unit; 0.5-0.11 (top staging, +Drive storage, parked data, sites, knob ids, claims, std1, saved-data mark, APPLY & RESTART on core-ar2 0.18) are checked in host tests and the emulator gate; no unit run of 0.6 or later stated; the README build line still names 0.10", what: "Links linkable mods from a /mods folder on the Rytm's +Drive at boot, so they need no new flash; a MODS page in SETTINGS > GLOBAL picks the set; from 0.6 a mod file may be as large as the +Drive area, and +Drive mods may keep storage fields and patch the OS (core-ar2 0.14, OS 1.74); from 0.8/0.9 +Drive mods get knob ids by count, claims, abs16 relocations and payloads kept on the +Drive, as on the A4 loader"}
