    notes: >
      An operating system of its own for the Octatrack MKII, not a patch of Elektron's OS: a weather-driven multi-effect
      on inputs A-D (up to seven effects whose knobs the chosen weather moves) and an 8-track sequencer groovebox
      (sampler, sub, FM, noise, Karplus-Strong and polyphonic MIDI machines, p-locks, ratchets, per-track cellular
      automata), plus LFOs, a Lorenz attractor and boids as modulators. ColdFire part in C, effects in hand-written
      DSP56300 assembly. Installing it removes the stock OS until it is reinstalled from the card; both keep their
      saved data in the same battery-backed SRAM, so back up before switching. The build uses the Modwerk SDK's tools
      (not included); aeria-os/HARDWARE.md and AUDIO.md map the MKII for writing an OS from scratch, largely from
      octabam's and Modwerk's documents. Some effect folders (head, tap) are marked as someone else's work. Made with
      Claude Code (README). Found by GitHub search 2026-11-13.
