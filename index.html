<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aggregat - Elektron mods and hardware knowledge</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1c1a; --mute:#6b675f; --line:#e3dfd6; --acc:#b4451f; --chip:#efebe2; --hw:#2f7d4a; --emu:#3a62a8; --doc:#8a6d1f;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s5:#e87ba4; --s0:#b9b4aa; --person:#3d3a35; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161513; --fg:#ece8df; --mute:#9a958a; --line:#2e2c28; --acc:#e7804f; --chip:#24221f; --hw:#6cc28b; --emu:#86a8e8; --doc:#d6b65c;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s5:#d55181; --s0:#5d5a54; --person:#d8d3c8; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:20px 24px 8px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:20px; letter-spacing:.02em; }
  h1 span { color:var(--acc); }
  .sub { color:var(--mute); font-size:13px; margin-top:2px; }
  nav { display:flex; gap:4px; flex-wrap:wrap; margin-top:14px; }
  nav button { border:1px solid var(--line); background:transparent; color:var(--fg); padding:6px 12px; border-radius:999px; cursor:pointer; font:inherit; font-size:14px; }
  nav button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .bar { display:flex; gap:8px; flex-wrap:wrap; padding:12px 24px; position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); z-index:1; }
  .bar input, .bar select { font:inherit; padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  .bar input { flex:1 1 280px; } .bar select:disabled { display:none; }
  .count { color:var(--mute); font-size:13px; align-self:center; }
  main { padding:8px 24px 40px; max-width:1100px; }
  .item { padding:12px 0; border-bottom:1px solid var(--line); }
  .head { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .title { font-weight:600; }
  .meta { color:var(--mute); font-size:13px; }
  .chip { background:var(--chip); border-radius:4px; padding:1px 6px; font-size:12px; color:var(--mute); white-space:nowrap; }
  .ev-hw { color:var(--hw); font-weight:600; } .ev-emu { color:var(--emu); font-weight:600; } .ev-doc { color:var(--doc); font-weight:600; }
  .text { margin-top:4px; overflow-wrap:anywhere; }
  code { font:13px ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--chip); padding:0 3px; border-radius:3px; }
  a { color:var(--acc); }
  mark { background:#f3d27a66; color:inherit; }
  .empty { color:var(--mute); padding:24px 0; }
  footer { color:var(--mute); font-size:12px; padding:0 24px 24px; }
  main.wide { max-width:none; }
  /* network map */
  .net-ctl { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; padding:8px 0; font-size:14px; }
  .net-group { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .net-group label { white-space:nowrap; cursor:pointer; }
  .net-ctl select, .net-btn { font:inherit; font-size:13px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer; }
  .net-wrap { position:relative; display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; height:calc(100vh - 230px); min-height:460px; }
  .net-svg { flex:1; min-width:0; height:100%; cursor:grab; touch-action:none; user-select:none; }
  .net-svg:active { cursor:grabbing; }
  .net-panel { width:300px; flex:none; border-left:1px solid var(--line); padding:12px 14px; overflow:auto; font-size:14px; }
  .net-panel h3 { margin:0 0 4px; font-size:16px; } .net-panel h4 { margin:12px 0 4px; font-size:14px; }
  .net-panel ul, .net-panel ol { padding-left:18px; margin:4px 0; } .net-panel li { margin:3px 0; }
  .net-panel dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:8px 0; } .net-panel dt { color:var(--mute); } .net-panel dd { margin:0; }
  .net-tip { position:absolute; pointer-events:none; background:var(--fg); color:var(--bg); padding:5px 8px; border-radius:6px; font-size:12px; max-width:260px; z-index:3; line-height:1.35; }
  .net-legend { display:flex; flex-wrap:wrap; gap:6px 16px; padding:8px 0; font-size:13px; align-items:center; }
  .net-legend i, .cm-legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .net-legend svg { vertical-align:-1px; margin-right:4px; }
  .e { stroke:var(--line); stroke-width:1; } .e-rel { stroke:var(--mute); stroke-width:1.5; } .e-unclear { stroke-dasharray:4 3; }
  .e-own { stroke:var(--mute); stroke-opacity:.45; } .e-strong { stroke:var(--fg); stroke-opacity:.8; }
  .n-unchecked { stroke:var(--fg); stroke-width:.8; stroke-dasharray:2.5 1.5; vector-effect:non-scaling-stroke; fill-opacity:.75; }
  .net-kinds { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; font-size:13px; padding-bottom:8px; }
  .net-kind { font:inherit; font-size:13px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:999px; padding:2px 10px 2px 6px; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
  .net-kind.off { opacity:.4; text-decoration:line-through; }
  .i-dash { background:transparent !important; border:1.5px dashed var(--fg); } .e-dev { stroke-opacity:.35; }
  .e.hi { stroke:var(--fg); stroke-opacity:1; stroke-width:2; } .e.dim { stroke-opacity:.08; }
  .n { stroke:var(--bg); stroke-width:2; cursor:pointer; transition:opacity .15s; } .n-d { stroke:var(--mute); stroke-width:1; vector-effect:non-scaling-stroke; }
  .n.dim { opacity:.15; } .n.sel { stroke:var(--fg); stroke-width:3; } .n.hit { stroke:var(--acc); stroke-width:3; }
  .lbl { fill:var(--mute); text-anchor:middle; pointer-events:none; paint-order:stroke; stroke:var(--bg); display:none; }
  .lbl-big, .zoomed .lbl, .lbl.show { display:block; } .lbl.dim { display:none; }
  .lbl-o { fill:var(--fg); font-weight:600; } .lbl-d { fill:var(--fg); font-weight:600; stroke:none; }
  /* mods */
  .md-lead { color:var(--mute); font-size:14px; max-width:760px; margin:12px 0 10px; }
  .md-ctl { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-bottom:6px; font-size:13px; }
  .md-ctl select { font:inherit; font-size:13px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  .md-chk { color:var(--mute); cursor:pointer; } .md-chk input { accent-color:var(--fg); vertical-align:-2px; }
  .md-h { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin:22px 0 10px; display:flex; gap:10px; align-items:baseline; }
  .md-h span { color:var(--mute); font-weight:400; text-transform:none; letter-spacing:0; }
  .md-x { font:inherit; font-size:12px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:999px; padding:1px 8px; cursor:pointer; text-transform:none; letter-spacing:0; }
  .md-loaders { display:grid; grid-template-columns:repeat(auto-fill, minmax(165px, 1fr)); gap:8px; }
  .md-ld { font:inherit; text-align:left; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:8px; padding:8px 10px; cursor:pointer; display:flex; flex-direction:column; gap:2px; }
  .md-ld span { color:var(--mute); font-size:12px; } .md-ld:hover { border-color:var(--mute); } .md-ld.on { border-color:var(--fg); box-shadow:inset 0 0 0 1px var(--fg); }
  .md-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:12px; }
  .md-card { border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; min-width:0; }
  .md-card:hover { border-color:var(--mute); } .md-dim { opacity:.6; }
  .md-card h3 { margin:0; font-size:15px; line-height:1.3; overflow-wrap:anywhere; } .md-card h3 a { color:var(--fg); text-decoration:none; } .md-card h3 a:hover { color:var(--acc); }
  .md-card p { margin:0; font-size:13.5px; line-height:1.45; }
  .md-by, .md-os, .md-note { color:var(--mute); font-size:12px; } .md-os { margin-top:-2px; }
  .md-top { display:flex; gap:6px; align-items:center; font-size:12px; } .md-date { margin-left:auto; color:var(--mute); font-variant-numeric:tabular-nums; }
  .md-new { font-size:11px; font-weight:600; color:var(--acc); border:1px solid var(--acc); border-radius:999px; padding:0 6px; }
  .md-st { font-size:11px; color:var(--mute); border:1px solid var(--line); border-radius:999px; padding:0 6px; }
  .md-foot { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin-top:auto; padding-top:4px; }
  .md-tag { background:var(--chip); color:var(--fg); border-radius:4px; padding:1px 6px; font-size:12px; } .md-via { color:var(--mute); font-size:12px; margin-left:2px; }
  .md-card details { font-size:12.5px; color:var(--mute); } .md-card summary { cursor:pointer; color:var(--fg); } .md-card details div { margin-top:4px; }
  /* community */
  .cm-kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin:10px 0 16px; }
  .cm-kpis div { border:1px solid var(--line); border-radius:8px; padding:10px 12px; } .cm-kpis b { display:block; font-size:26px; line-height:1.1; } .cm-kpis span { color:var(--mute); font-size:13px; }
  .cm-card { border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; position:relative; }
  .cm-card h3 { margin:0 0 4px; font-size:16px; } .cm-card ol, .cm-card ul { padding-left:20px; margin:6px 0; }
  .cm-two { display:grid; grid-template-columns:repeat(auto-fit, minmax(360px, 1fr)); gap:0 14px; }
  .cm-svg { width:100%; height:auto; display:block; margin-top:6px; } .cm-ax { font-size:10px; fill:var(--mute); } .cm-grid { stroke:var(--line); }
  .cm-hit:hover path { opacity:.8; }
  .cm-row { display:grid; grid-template-columns:170px 1fr 36px; align-items:center; gap:8px; margin:5px 0; font-size:13px; }
  .cm-lab { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .cm-val { color:var(--mute); text-align:right; }
  .cm-track { height:12px; } .cm-stack { display:flex; gap:2px; height:12px; } .cm-seg:first-child { border-radius:4px 0 0 4px; } .cm-seg:last-child { border-radius:0 4px 4px 0; } .cm-seg:only-child { border-radius:4px; }
  .cm-bar { display:block; height:12px; background:var(--s1); border-radius:0 4px 4px 0; }
  .cm-legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--mute); margin:4px 0 8px; }
  .cm-table { border-collapse:collapse; width:100%; font-size:14px; } .cm-table th { text-align:left; color:var(--mute); font-weight:500; border-bottom:1px solid var(--line); padding:4px 8px 4px 0; }
  .cm-table td { padding:4px 8px 4px 0; border-bottom:1px solid var(--line); } .cm-num { white-space:nowrap; } .cm-inl { display:inline-block; height:8px; background:var(--s1); border-radius:0 4px 4px 0; vertical-align:0; }
  @media (max-width:760px) { .net-wrap { flex-direction:column; height:auto; } .net-svg { height:70vh; } .net-panel { width:auto; border-left:0; border-top:1px solid var(--line); } .cm-row { grid-template-columns:110px 1fr 30px; } }
</style>
</head>
<body>
<header>
  <h1><span>Aggregat</span> - Elektron mods and hardware knowledge</h1>
  <div class="sub" id="sub">Loading export/aggregat.json ...</div>
  <nav id="tabs"></nav>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Search (all words must match; an address like 0x40000400 works too)" autofocus>
  <select id="dev"><option value="">All devices</option></select>
  <select id="ev" title="Evidence"><option value="">Any evidence</option><option value="hw">[hw] seen on a unit</option><option value="emu">[emu] emulator</option><option value="doc">[doc] documented</option><option value="?">[?] unsure</option></select>
  <span class="count" id="count"></span>
</div>
<main id="out"></main>
<footer>Generated from the repo by <code>scripts/export_db.py</code>. Data CC0. Edit the Markdown/YAML in the repo, not this page.
  <a href="https://github.com/70b185/aggregat">github.com/70b185/aggregat</a></footer>
<script src="assets/network.js"></script>
<script src="assets/community.js"></script>
<script src="assets/mods.js"></script>
<script>
const REPO = "https://github.com/70b185/aggregat/blob/master/";
const TABS = [["mods","Mods"],["network","Network map"],["community","Community"],["facts","Hardware facts"],["projects","Projects"],["rules","Agent rules"],["incidents","Incidents"],["stock_bugs","Stock bugs"],["hypotheses","Tests to run"],["tasks","Tasks"],["goals","Goals"],["conflicts","Conflicts"],["sources","Sources"]];
let D = null, tab = "mods", srcUrl = {}, devName = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list = s => String(s || "").split(",").filter(Boolean);

function md(s, base) {
  // Small Markdown subset: code, bold, links (relative links resolve against the source file), {source-keys}.
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, href) => {
    let u = href;
    if (!/^https?:/.test(href)) { try { u = new URL(href, REPO + (base || "")).href; } catch (e) {} }
    return `<a href="${u}">${txt}</a>`;
  });
  t = t.replace(/\{([a-z0-9][a-z0-9-]*)\}/g, (m, k) => srcUrl[k] ? `<a class="chip" href="${esc(srcUrl[k])}">${k}</a>` : m);
  return t;
}
function hl(html, words) {
  if (!words.length) return html;
  const re = new RegExp("(" + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return html.split(/(<[^>]+>)/).map(p => p.startsWith("<") ? p : p.replace(re, "<mark>$1</mark>")).join("");
}
function evChip(e) {
  return list(e).map(x => `<span class="chip ev-${x === "?" ? "q" : x}">[${esc(x)}]</span>`).join(" ");
}
function devChips(d) { return list(d).map(x => `<span class="chip">${esc(devName[x] || x)}</span>`).join(" "); }

const INC_GROUP = {stock: "stock firmware", mod: "mod on a unit", "emulator-or-tool": "emulator / tool vs unit", "recovery-or-link": "recovery / link"};
const VIEWS = {
  network: {
    custom: true, rows: () => D.projects, dev: p => p.devices, hay: () => "",
    draw: (words, dev) => AggNetwork.draw($("out"), D, {words, dev, devName}),
    count: () => `${D.relations.length} relations`
  },
  mods: {
    custom: true, rows: () => D.projects, dev: p => p.devices, hay: () => "",
    draw: (words, dev) => AggMods.draw($("out"), D, {words, dev, devName}),
    count: () => ""
  },
  community: {
    custom: true, rows: () => D.projects, dev: p => p.devices, hay: () => "",
    draw: (words, dev) => AggCommunity.draw($("out"), D, {words, dev, devName}),
    count: () => ""
  },
  facts: {
    rows: () => D.facts,
    hay: f => [f.text, f.section, f.file, f.addresses, f.sources].join(" "),
    dev: f => f.devices, ev: f => f.evidence,
    html: (f, w) => `<div class="head"><a class="meta" href="${REPO}${esc(f.file)}#L${f.line}">${esc(f.file.replace("hardware/",""))}:${f.line}</a>
        <span class="meta">${esc(f.section)}</span> ${evChip(f.evidence)} ${devChips(f.devices)}</div>
        <div class="text">${hl(md(f.text, f.file), w)}</div>`
  },
  projects: {
    rows: () => D.projects,
    hay: p => [p.id, p.name, p.author, p.kind, p.list, p.notes, p.base_os, p.version, p.repo].join(" "),
    dev: p => p.devices,
    html: (p, w) => {
      const rel = D.relations.filter(r => r.project === p.id || r.target === p.id)
        .map(r => r.project === p.id ? `${r.type.replace(/_/g," ")} <b>${esc(r.target)}</b>` : `<b>${esc(r.project)}</b> ${r.type.replace(/_/g," ")} this`).join("; ");
      return `<div class="head"><span class="title">${p.repo ? `<a href="${esc(p.repo)}">${esc(p.name)}</a>` : esc(p.name)}</span>
        <span class="meta">${esc(p.author)}</span> <span class="chip">${esc(p.kind)}</span> <span class="chip">${esc(p.list)}</span>
        ${p.status ? `<span class="chip">${esc(p.status)}</span>` : ""} ${devChips(p.devices)}</div>
        <div class="meta">${[p.version && "version " + esc(p.version), p.last_activity && "last activity " + esc(p.last_activity), p.base_os && "base OS " + esc(p.base_os)].filter(Boolean).join(" · ")}</div>
        ${p.notes ? `<div class="text">${hl(md(p.notes, "data/projects.yml"), w)}</div>` : ""}
        ${rel ? `<div class="meta">Related: ${rel}</div>` : ""}`;
    }
  },
  rules: {
    rows: () => D.rules,
    hay: r => [r.id, r.section, r.text, r.sources].join(" "),
    dev: r => r.devices, ev: r => r.evidence,
    html: (r, w) => `<div class="head"><span class="title">${esc(r.id)}</span> <span class="meta">${esc(r.section)}</span> ${evChip(r.evidence)} ${devChips(r.devices)}</div>
        <div class="text">${hl(md(r.text, "hardware/AGENT-RULES.md"), w)}</div>`
  },
  stock_bugs: {
    rows: () => D.stock_bugs || [],
    hay: b => [b.id, b.title, b.device_os, b.area, b.symptom, b.trigger, b.cause, b.workaround, b.test_tip, b.found_by, b.status].join(" "),
    dev: b => b.devices,
    ev: b => b.evidence,
    html: (b, w) => `<div class="head"><span class="title">${esc(b.id)}</span> ${evChip(b.evidence)}
        <span class="title">${hl(esc(b.title), w)}</span> ${devChips(b.devices)}</div>
        <div class="meta">${hl(esc(b.device_os), w)} · ${esc(b.area)} · ${esc(b.status)}</div>
        <div class="text"><b>Symptom:</b> ${hl(md(b.symptom, "hardware/STOCK-BUGS.md"), w)}</div>
        ${b.trigger ? `<div class="text"><b>Trigger:</b> ${hl(md(b.trigger, "hardware/STOCK-BUGS.md"), w)}</div>` : ""}
        ${b.cause ? `<div class="text"><b>Cause:</b> ${hl(md(b.cause, "hardware/STOCK-BUGS.md"), w)}</div>` : ""}
        <div class="text"><b>Workaround:</b> ${hl(md(b.workaround, "hardware/STOCK-BUGS.md"), w)}</div>
        ${b.test_tip ? `<div class="text"><b>Test tip:</b> ${hl(md(b.test_tip, "hardware/STOCK-BUGS.md"), w)}</div>` : ""}
        <div class="meta">Found by ${esc(b.found_by)}${b.incidents ? ` · incident ${list(b.incidents).map(i => `<a href="?t=incidents&q=${i}">${esc(i)}</a>`).join(", ")}` : ""}
        · <a href="${REPO}hardware/STOCK-BUGS.md">STOCK-BUGS.md</a> · <a href="https://github.com/70b185/Aggregat/issues/new?template=stock-bug.yml">Report a stock bug</a></div>`
  },
  incidents: {
    rows: () => D.incidents || [],
    hay: i => [i.id, i.group, i.title, i.unit, i.seen, i.cause, i.cause_found_by, i.fix, i.status, i.rules].join(" "),
    dev: i => i.devices,
    ev: i => i.evidence,
    html: (i, w) => `<div class="head"><span class="title">${esc(i.id)}</span> <span class="chip">${esc(INC_GROUP[i.group] || i.group)}</span> ${evChip(i.evidence)}
        <span class="title">${hl(esc(i.title), w)}</span> ${devChips(i.devices)}</div>
        <div class="meta">${hl(esc(i.unit), w)}</div>
        <div class="text"><b>Seen:</b> ${hl(md(i.seen, "hardware/INCIDENTS.md"), w)}</div>
        <div class="text"><b>Cause${i.cause_found_by ? ` (${esc(i.cause_found_by)})` : ""}:</b> ${hl(md(i.cause, "hardware/INCIDENTS.md"), w)}</div>
        <div class="text"><b>Fix:</b> ${hl(md(i.fix, "hardware/INCIDENTS.md"), w)} <span class="meta">${esc(i.status)}</span></div>
        <div class="meta">Rule${list(i.rules).length > 1 ? "s" : ""}: ${list(i.rules).map(r => `<a href="?t=rules&q=${encodeURIComponent(r)}">${esc(r)}</a>`).join(", ")}
        ${i.fact_file ? ` · <a href="${REPO}hardware/${esc(i.fact_file)}">fact</a>` : ""}
        · <a href="${REPO}hardware/INCIDENTS.md">INCIDENTS.md</a></div>`
  },
  conflicts: {
    rows: () => D.conflicts,
    hay: c => [c.id, c.status, c.topic, c.a, c.b, c.details].join(" "),
    dev: c => c.devices,
    html: (c, w) => `<div class="head"><span class="title">${esc(c.id)}</span> <span class="chip">${esc(c.status)}</span> <span class="title">${hl(esc(c.topic), w)}</span> ${devChips(c.devices)}</div>
        <div class="text"><b>A:</b> ${hl(md(c.a, "hardware/CONFLICTS.md"), w)}</div>
        <div class="text"><b>B:</b> ${hl(md(c.b, "hardware/CONFLICTS.md"), w)}</div>
        ${c.details ? `<div class="meta">${md(c.details, "hardware/CONFLICTS.md")}</div>` : ""}`
  },
  hypotheses: {
    rows: () => D.hypotheses || [],
    hay: h => [h.id, h.goals, h.inference, h.derived_from, h.devices, h.test, h.kind].join(" "),
    html: (h, w) => `<div class="head"><span class="title">${esc(h.id)}</span> <span class="chip">${esc(h.kind)}</span>
        ${list(h.goals).map(g => `<span class="chip">${esc(g)}</span>`).join(" ")} <span class="meta">${hl(esc(h.devices), w)}</span></div>
        <div class="text">${hl(md(h.inference, "hardware/HYPOTHESES.md"), w)}</div>
        <div class="meta"><b>Test:</b> ${hl(md(h.test, "hardware/HYPOTHESES.md"), w)} · <b>From:</b> ${md(h.derived_from, "hardware/HYPOTHESES.md")}</div>
        <div class="meta"><a href="https://github.com/70b185/Aggregat/issues/new?template=test-result.yml">Report a result</a></div>`
  },
  tasks: {
    rows: () => D.tasks || [],
    hay: t => [t.id, t.task, t.devices, t.needs, t.effort, t.value, t.status].join(" "),
    html: (t, w) => `<div class="head"><span class="title">${esc(t.id)}</span> <span class="chip">${esc(t.status)}</span>
        <span class="chip">${esc(t.needs)}</span> <span class="chip">effort ${esc(t.effort)}</span> <span class="meta">${esc(t.devices)}</span></div>
        <div class="text">${hl(md(t.task, "RESEARCH-MAP.md"), w)}</div><div class="meta">${md(t.value, "RESEARCH-MAP.md")}</div>`
  },
  goals: {
    rows: () => D.goals || [],
    hay: g => [g.id, g.goal, g.status, g.moved_by].join(" "),
    html: (g, w) => `<div class="head"><span class="title">${esc(g.id)}</span> <span class="title">${hl(esc(g.goal), w)}</span></div>
        <div class="text">${hl(md(g.status, "RESEARCH-MAP.md"), w)}</div><div class="meta"><b>Moved by:</b> ${md(g.moved_by, "RESEARCH-MAP.md")}</div>`
  },
  sources: {
    rows: () => D.sources,
    hay: s => [s.key, s.what, s.url].join(" "),
    html: (s, w) => `<div class="head"><span class="chip">${esc(s.key)}</span> ${s.url ? `<a href="${esc(s.url)}">${hl(md(s.what, "hardware/SOURCES.md"), w)}</a>` : hl(md(s.what, "hardware/SOURCES.md"), w)}</div>`
  }
};

function render() {
  const v = VIEWS[tab];
  const words = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const dev = $("dev").value, ev = $("ev").value;
  $("dev").disabled = !v.dev; $("ev").disabled = !v.ev;
  const rows = v.custom ? [] : v.rows().filter(r => {
    if (dev && v.dev && !list(v.dev(r)).includes(dev)) return false;
    if (ev && v.ev && !list(v.ev(r)).includes(ev)) return false;
    if (!words.length) return true;
    const h = v.hay(r).toLowerCase();
    return words.every(w => h.includes(w));
  });
  $("out").classList.toggle("wide", !!v.custom);
  if (!v.custom && window.AggNetwork) AggNetwork.stop();
  if (v.custom) {
    $("count").textContent = v.count();
    v.draw(words, dev);
    const q = new URLSearchParams(); q.set("t", tab); if ($("q").value) q.set("q", $("q").value); if (dev) q.set("d", dev);
    history.replaceState(null, "", "?" + q);
    return;
  }
  if (v.ev && !ev) rows.sort((a, b) => (list(v.ev(b)).includes("hw") ? 1 : 0) - (list(v.ev(a)).includes("hw") ? 1 : 0));
  $("count").textContent = `${rows.length} of ${v.rows().length}`;
  const shown = rows.slice(0, 300);
  $("out").innerHTML = shown.length ? shown.map(r => `<div class="item">${v.html(r, words)}</div>`).join("")
    + (rows.length > 300 ? `<div class="empty">Showing the first 300. Narrow the search.</div>` : "")
    : `<div class="empty">Nothing matches.</div>`;
  const p = new URLSearchParams(); p.set("t", tab); if ($("q").value) p.set("q", $("q").value); if (dev) p.set("d", dev); if (ev) p.set("e", ev);
  history.replaceState(null, "", "?" + p);
}

function init() {
  const p = new URLSearchParams(location.search);
  if (VIEWS[p.get("t")]) tab = p.get("t");
  $("q").value = p.get("q") || "";
  $("tabs").innerHTML = TABS.map(([k, l]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${l} <span class="meta">${k === "network" || k === "community" ? "" : (k === "mods" ? D.projects.filter(p => String(p.list || "").split(",").includes("mods") && !["loader","tool"].includes(p.kind)).length : (D[k] || []).length)}</span></button>`).join("");
  $("tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; tab = b.dataset.t;
    [...$("tabs").children].forEach(x => x.classList.toggle("on", x === b)); render(); };
  D.devices.forEach(d => { devName[d.slug] = d.name; $("dev").insertAdjacentHTML("beforeend", `<option value="${esc(d.slug)}">${esc(d.name)}</option>`); });
  $("dev").value = p.get("d") || ""; $("ev").value = p.get("e") || "";
  D.sources.forEach(s => srcUrl[s.key] = s.url);
  $("sub").textContent = `${D.projects.length} projects, ${D.facts.length} hardware facts, ${D.rules.length} rules, ${D.conflicts.length} conflicts - data checked ${D.meta.checked}`;
  let t; $("q").oninput = () => { clearTimeout(t); t = setTimeout(render, 120); };
  $("dev").onchange = render; $("ev").onchange = render;
  render();
}

fetch("export/aggregat.json").then(r => r.json()).then(d => { D = d; init(); })
  .catch(e => { $("sub").textContent = "Could not load export/aggregat.json: " + e; });
</script>
</body>
</html>
