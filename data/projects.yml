  - id: multi-sampler
    name: MULTI-SAMPLER (Octatrack multisampler)
    author: Slingdinger
    kind: mod
    devices: [octatrack]
    repo: https://github.com/Slingdinger/MULTI-SAMPLER
    license: "MIT"
    status: wip
    base_os: "Octatrack MKI/MKII OS 1.40C"
    tested: partly
    tested_note: "README (2026-11-25): plays on the author's MKI, still being tuned for CPU load; the newest changes tested only in octabam's emulator"
    version: "main (2026-11-25), untagged"
    last_activity: "2026-11-25"
    notes: >
      Two octabam modules built into the user's own copy of the OS (no Elektron code in the repo). MULTI is a sixth
      machine beside STATIC, FLEX, THRU, NEIGHBOR and PICKUP: up to eight voices on one audio track, each with its own
      sample, pitch, envelope and filter, from a folder of files named by note (AUDIO/MULTI/<set>/); voices mix at
      -12 dB each and are rendered on the main processor, with a load guard that steals or fades voices when the load
      is high. MIDI ROUTING adds a map in a MIDI track's NOTE SETUP that sends MIDI tracks (and external MIDI on their
      channel) to audio tracks, saved with the project. MULTI is a fork of repeat98's POLY MACHINE module from the
      octamad repo (MIT); the MIDI sender hook follows octabam's MIDI LOOPBACK. MIT. Same author as STEP VIEW, which
      draws MULTI's pages when both are built in. First commit 2026-11-15, 20 commits by the author. Found through
      STEP VIEW's README 2026-11-26.
    features:
    - "MULTI machine: up to eight voices per audio track, each with its own sample, pitch, envelope and filter"
    - "a folder of note-named files plays as one instrument (nearest file per note)"
    - "single-cycle samples loop, with band-limited copies per octave"
    - "MULTIFILTER, sets and presets, voice stealing and a CPU load guard"
    - "MIDI ROUTING: a map in NOTE SETUP sends MIDI tracks and external MIDI to audio tracks"
    sources: ["README, multi/README.md, commit log (2026-11-26)"]
