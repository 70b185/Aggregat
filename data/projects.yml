  # gdeo607's Digi2 family for the Digitakt II (OS 1.17), elekloader mods on core-dt2 2.x; found 2026-11-10 (user's tip),
  # READMEs read 2026-11-10. Each repo holds one squashed commit and the built .elemod files, no Elektron code.
  - id: digi2core
    name: Digi2Core (core-dt2 2.6.1)
    author: gdeo607
    kind: mod
    devices: [digitakt-2]
    repo: https://github.com/gdeo607/Digi2Core
    status: wip
    tested: partly
    tested_note: "2.6.1 runs on units under Digi2Sophie and Digi2Digiseq (their READMEs); 2.4 and the pattern service of 2.6 checked in the emulator only; 2.4-2.6 crash a unit at boot"
    base_os: "Digitakt II OS 1.17"
    version: "core-dt2 2.6.1 (2026-11-09)"
    last_activity: "2026-11-09"
    license: "AGPL-3.0-or-later"
    notes: >
      Base mod for gdeo607's Digitakt II machine mods; on its own it changes nothing. It keeps irpina's core 1.0 hook
      bus and adds digikit's machine, parameter and DSP-inline frameworks as core services: added machine types 7-23
      and parameter codes 275-338, DSP voices as relocatable objects placed in free DSP L2, a second SRC page with four
      saved, p-lockable controls (stored in the sound record's spare slots 77 and 78; such projects still load on the
      stock OS), and since 2.6 a pattern service that reads and edits trigs and locks through the firmware's own
      editors. Building needs an elekloader with `sharc_raw` support for the Digitakt II (a branch of gdeo607's
      elekloader fork, proposed upstream). Do not flash 2.4, 2.5 or 2.6: they crash the unit at boot (I67).
    features:
      - "shared base that the Digi2 machine mods need"
      - "adds room for new machines, parameters and DSP voices; changes nothing on its own"
    sources: [GitHub README 2026-11-10, "README (2026-11-11)"]
    relations:
    - {type: mod_for, id: elekloader, evidence: 'README: an elekloader mod (core 2.6.1)'}
    - {type: builds_on, id: elekloader, evidence: 'README: starts from core 1.0 (irpina''s boot copier and hook bus, unchanged)'}
    - {type: vendors, id: digikit, evidence: 'README: adds the frameworks DigiKit''s All-in-One builds its machines on'}
