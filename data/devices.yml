# Device catalogue. Focus phase 1: the small boxes (Digitakt, Digitone, Syntakt, Analog Heat),
# including their MKII / second-generation versions.
# phase 2 (later): Octatrack, Analog Four/Rytm/Keys, Model:Cycles/Samples, Tonverk, Machinedrum, ...

devices:
  - slug: digitakt
    name: Digitakt (MKI)
    family: Digitakt
    phase: 1
  - slug: digitakt-2
    name: Digitakt II
    family: Digitakt
    phase: 1
  - slug: digitone
    name: Digitone (MKI) / Digitone Keys
    family: Digitone
    phase: 1
  - slug: digitone-2
    name: Digitone II
    family: Digitone
    phase: 1
  - slug: syntakt
    name: Syntakt
    family: Syntakt
    phase: 1
  - slug: analog-heat
    name: Analog Heat (MKI, MKII, +FX)
    family: Analog Heat
    phase: 1
    note: >
      No community firmware mod found yet (2026-10-31). Generic tooling covers it: elektron-firmware-tool
      (firmware container), Elektroid (sample/SysEx manager) and Overwitch (Overbridge audio on Linux)
      list Analog Heat MKI/MKII/+FX. screendump names it as 'not implemented'. Neither the Lapin list
      nor altstrument.org has a firmware entry for it. Last official OS we saw on elektron.se: Analog Heat MKI/MKII OS 1.22
      (2024-10-16); the +FX has its own OS (release notes last updated 2024-10-16) and MKII firmware
      is not interchangeable with +FX.
