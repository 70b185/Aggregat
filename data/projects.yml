  - id: mezclando
    name: Mezclando (transition mode for Digitakt II)
    author: Lucioic (Oicul)
    kind: mod
    devices: [digitakt-2]
    repo: https://github.com/Lucioic/mezclando
    links:
      web_patcher: https://lucioic.github.io/mezclando/
    status: active
    tested: not-stated
    base_os: "Digitakt II OS 1.17 only"
    license: GPL-3.0-or-later
    last_activity: '2026-11-04'
    notes: >
      A DJ-style mix mode on the SONG key: pick a reference pattern and bring its tracks, with their sequences and
      sounds, into the playing pattern one by one, with per-track levels, mutes and a one-step undo; YES loads the whole
