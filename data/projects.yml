    base_os: "hardware-verified 2026-11-23: Digitakt II 1.17 (0082), Digitone II 1.12 (0062), Analog Four MKI 1.56 (0204): track 1 of A16 written, read back in full and restored byte for byte on each; older verified builds (DT2 1.16, DN2 1.11, A4 1.55D) stay enabled, unknown builds are read-only; the numbers in parentheses are the OS build numbers the units report"
    version: "v0.6.1 (tag, 2026-11-23; v0.6.0 the same day)"
    last_activity: "2026-11-23"
    notes: >
      Native Rust desktop sequencer for Digitakt II, Digitone II and Analog Four, built from digi-roll. Writes to hardware:
      README recommends throwaway projects. Safe-write ceremony of five rules (re-read and back up the destination pattern first,
      OS build on an allowlist, user confirmation, change only needed bytes, read back and byte-compare). Gen-2 dump protocol
      (digis) vs gen-1 (Analog Four). +Drive file-write commands 0x57/0x58/0x59 hardware-verified for a single chunk only,
      not called by the app (writes above 16 KiB refused); 0x5A/0x5B/0x5C (move/copy/delete) not implemented. Protocol code
      ported from elk-herd (BSD-2, (c) mzero). Fixtures: 34 real .syx dumps. 124 commits, GPL-3.0-or-later.
      Not firmware modding. Windows/Linux write testing incomplete.
      2026-11-24 (v0.6.0/v0.6.1): Drum Steps, a 16-step grid editor beside the piano roll (paint, erase, velocity
      drag, per-track playheads); Kit Builder (K), a track grid and preset browser with filters, revert per track or
      for all auditioned tracks, a recovery backup kept even when verification fails; A4 writes keep the destination
      pattern's kit and refuse a blank pattern whose kit reference is unset (I201). A contributed Syntakt p-lock map
      (OS 1.42) is merged but enables no Syntakt writes. Saving a whole kit to the +Drive is planned for DN2 only.
    features:
      - "piano roll and Drum Steps grid editor for patterns on the unit"
      - "Kit Builder: track grid and preset browser with name, bank and tag filters, audition and revert"
      - "safe writes: OS-build allowlist, backup, full readback and restore"
      - "Analog Four writes keep the pattern's kit assignment"
    sources: [GitHub README, search 2026-10-31, "tags v0.6.0/v0.6.1, README, PLAN, release notes, KIT-SAVE-WORK-PACKAGE, fixture and dump notes (2026-11-24)"]
