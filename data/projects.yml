    status: released
    base_os: "Digitone II OS 1.12 only (patcher refuses any other file); NOT compatible with dn2mk2 (OS 1.11)"
    version: "v1.2 (tag seen 2026-10-31; release notes not read yet)"
    last_activity: 2026-10-31
    notes: >
      Python 3.11+ patcher (patcher/patch.py) that builds Overtone from the user's own OS 1.12 and only saves
      the result if it matches the tested build byte for byte; install via Elektron Transfer over USB.
      Adds machines SOPHIE, MACHINEDRUM, LOOP, THRU, per-track insert effects, envelope followers, two
      arpeggiators, parameter slides and GROOVE (replaces swing). 1.0.1 fixes installing an OS sent with
      Transfer while Overtone runs. About 160 checks per build in two emulators (digikit for the main OS, a
      SHARC emulator for the DSP program); author states 1.0.1 passes all of them, is played on a Digitone II
      and Transfer installs were checked on the unit. Opening Overtone projects on stock OS is untested.
      Recovery section is detailed (FUNC + TRIG 4, DIN MIDI, ~15 min). AGPL-3.0-or-later (includes dnfw),
      5 commits. Related: dnfw, digikit, dn2-cfw, Schwung Sophie (MIT), and the author's
      digitone-2-modding-skill used with Claude Code.
    latest_seen: >
      altstrument: v1.1 (2026-10-30) reworks GROOVE with presets, a random drift control, random weights and arrow-key editing, and restores FUNC + TEMPO as tap tempo; v1.0.1 (2026-10-29) fixes installing Elektron's OS or an Overtone update with Transfer while Overtone runs.
    sources: [forum thread 90, GitHub README]

