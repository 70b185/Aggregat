    last_activity: 2026-10-11
    notes: >
      Free browser-based pattern/sequence editor, not a firmware mod. Repo includes sysexmap/, a public
      reverse-engineered SysEx format map (CC BY 4.0): 45 mappings, map version 1.13.0, each with a confidence level
      (A = hardware-confirmed on a DN2: 23; B = corpus-confirmed by repo fixtures: 12; C = inherited, one value exercised:
      9; D = unknown, do not rely: 1). Narrowed by bisection on 2026-09-08 against a Digitone II (OS 1.10E) and a
      Digitakt II. Not decoded: parameter locks, sound parameters (filter, amp, FX, LFO), synth machine choice.
      Needs the DN2 in SYSEX RECEIVE mode; Web MIDI needs Chromium over HTTPS or localhost (Chrome/Edge 152 break SysEx
      receive on macOS). App is AGPLv3 since v22.46 (MIT through v22.37). 6 commits.
    sources: [forum thread 43]

  - id: dn2-dt2-firmware-research
    name: DN2 DT2 firmware research (T1E2)
    author: armio
    kind: firmware
    devices: [digitone-2, digitakt-2]
    repo: https://github.com/armio/dn2-dt2-firmware-research
    status: released
    base_os: "Digitone II OS 1.11 (target) + Digitakt II OS 1.16 (donor); both official files supplied locally"
    version: "T1E2 stable; experimental R003 (Recorder) and R008 (USB diagnostics, 2026-11-02, not validated on hardware)"
    last_activity: "2026-11-02"
    notes: >
      Source-only recipes that rebuild T1E2, a Digitone II 1.11 research firmware that transplants the Digitakt II
      sample machines (ONESHOT, WERP, STRETCH, REPITCH, GRID, SLICE) with stereo samples, sample browsing, DT2
      parameter graphics and a SLICES trig mode, plus class-compliant USB audio with 42 capture channels at
      48 kHz/24 bit (21 pairs: MAIN, tracks 1-16, DELAY, REVERB, CHORUS, INPUT; stereo return). Donor code, fonts and
      graphics are extracted at build time from the user's official DN2 1.11 and DT2 1.16 files; 115 MAIN stages and
      46 DSP stages are each hash-checked, and the output must match a pinned SHA-256 (2,537,120 bytes, c79c42d2...).
      Exact reproduction also needs the author's private 47,104-byte sample bank, which is not distributed, so
      without it the build cannot match the release. Builds on dnfw (angellinares/dn2_firmware_explore), selache,
      digikit and elektron-firmware-tool (pinned commits). Stable = owner-tested with USB streaming, not every workflow.
      Nothing is flashed by the tools. AGPL-3.0-or-later. One commit at first sight.
      R008 (2026-11-02) adds checksummed records of rejected USB audio publications. Captured on a unit: USB audio froze while headphones and UI kept working; accepted publications stopped while rejected ones rose by 16,392 in about 10.9 s, and USB transfers kept running with old audio. Cause not identified; R008 is a diagnostic build, not a fix.
    sources: [GitHub README, releases/t1e2.json]

