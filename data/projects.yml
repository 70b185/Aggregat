  - id: digicmi
    name: Digi CMI
    author: neutronrabbit
    kind: mod
    devices: [digitakt]
    repo: https://github.com/neutronrabbit/digicmi
    license: "MIT"
    status: active
    tested: partly
    tested_note: "builds up to 0.14 and 0.25 ran on the author's Digitakt mk1; unit reports for 0.26 (notes stopped dead, I89), 0.30 (freeze on an ENG switch, I90), 0.31 (UI lag with RETRO, I91) and 0.34 (SUS stopped dead in ping-pong, I92); the fixes in 0.28-0.39 ran only in digiemu; the OS 1.53 amp-envelope address is now given by elekloader's core notes (2026-11-15)"
    base_os: "Digitakt mk1 OS 1.54 (1.53 untested); elekloader core 4.3 and machine-pages 1.10"
    version: "0.42 (tag, 2026-11-15): HARM, a harmonic (Fourier) synth as the third ENG place between SMPL and TIME: the time synth's sixteen waves rebuilt from their first 32 harmonics, HARMS takes harmonics away down to a sine; 0.41 (tag, 2026-11-14): time-synth voices skip the stock sample playback (OS 1.54 only), about 15 % less audio work with a chord; 0.40 (tag, 2026-11-14): TIME OFF follows the sample engine's PLAY, LOOP and LOOP END. 0.39 (tag, 2026-11-14): the time synth reads its waves' table points without smoothing between them (as the CMI did), about a third less audio work with a chord held; 0.38 (tag, 2026-11-14) works out each looping voice's loop points only when the sample or STRT/LEN/LOOP/LOOP END change. 0.27-0.37 switch silent voices off by the firmware's real amp envelope, bring back LOOP END, make RETRO much cheaper, fix SUS release in ping-pong, and steal voices by gate and age"
    last_activity: "2026-11-15"
    notes: >
      A Fairlight CMI-style polyphonic sample instrument as an elekloader mod: machine CMI on track 1 turns tracks 2-8
      into its voices and plays one sample across the keyboard, from trigs, chords or MIDI. Forked from Digi Poly 2.1
      (digi1_mods), whose polyphony, voice borrowing and kit storage it keeps. Conflicts with Digi Poly, dt8poly,
      DIGISLICER, Digi EQ and Digi Matrix (same patch sites or sound slots). Kits saved with CMI load that track as
      ONESHOT on the stock OS. The author names Claude as coding assistant. Found by GitHub search 2026-11-12.
      2026-11-12 (0.19-0.26): the meter shows the whole audio engine's peak load; on the unit it read about 85 % right
      after boot, and the author's instruction count in digiemu puts about 98 % of that in the stock render, so the UI
      gets what is left. Projects saved with 0.14-0.22's RETRO switch on open at 8 bit 8 kHz.
      2026-11-14 (0.27-0.37): the envelope value 0.26 used to end voices (core export fw_amp_env) is the filter
      envelope and cut sounding notes on the unit; 0.30 reads the real amp envelope found by disassembly (S20). Voice
      stealing takes a voice that is off, else the oldest released note, else the oldest sequencer note, never a held
      key.
      2026-11-15 (0.38-0.39, CLAUDE.md): an instruction profile in digiemu puts the stock render at about 83k
      instructions a block whether voices play or not (the stock render does all eight voices' work), and outside the
      render the UI costs about 2,300 a block; the lag in TIME mode was the time synth's own share (about 8.6k a
      block, cut to about 5.5k in 0.39). digiemu does not run the load-dependent paths, because the mod's CPU meter
      reads no timer there.
      2026-11-16 (0.40-0.42, CHANGELOG and CLAUDE.md): the author's earlier listings were made at 0x40000000, but the
      DT1 main section loads at 0x40000400, so readings made before 0.40 were 0x400 off. 0.41's skip of the stock sample
      player and 0.42's HARM ran only in digiemu and on the host, not yet on the unit.
    features:
      - "CMI machine: one sample played by eight voices from track 1"
      - "forward, reverse and ping-pong loops with hold or sustain looping; LOOP and LOOP END snap to zero crossings"
      - "RETRO dial: 16 bit 48 or 44.1 kHz, or 8 bit at 32 to 8 kHz"
      - "stereo spread; released notes ring on and their voices switch off once silent"
      - "TIME engine: sixteen single cycles cut from the sample, stepped or crossfaded"
      - "HARM engine: the same waves rebuilt from up to 32 harmonics, down to a sine"
      - "waveform page and a CPU meter in the title bar"
    sources: [state/NEW.md 2026-11-12, "README (2026-11-12)", "README (2026-11-13)", "CHANGELOG 0.19-0.26 (2026-11-13)", "CHANGELOG 0.27-0.37 (2026-11-14)", "CHANGELOG and CLAUDE.md 0.38-0.39 (2026-11-15)", "CHANGELOG and CLAUDE.md 0.40-0.42 (2026-11-16)"]
    relations:
