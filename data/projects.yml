    tested: partly
    tested_note: "README (2026-11-10): digikit has run on a real Digitakt II (OS 1.17: runtime, PLUCK, bootscreen per finding 117); the Digitone II only in the emulator; Frequency shifter, Overdrive curves and TB303 emulator only. 2026-11-11: Fast USB (a vendor bulk interface) ran on a Digitone II (OS 1.12) and a Digitakt II (OS 1.17) after a fix found on the DN2 (I70); 2026-11-11 also from USB AUDIO/MIDI mode by a take-over, with throughput ceilings measured on both units (findings 123-124)"
    base_os: "Digitakt II target 1.17 (emulator also runs 1.16 as default file; 1.15C kept for old analysis); Digitone II target 1.12 (also runs 1.11 as default file; 1.10E kept for old analysis)"
    version: null
    last_activity: "2026-11-13"
    own_mods:
    - {name: "PLUCK", path: "modules/machines/pluck", tested: "unit", note: "Digitakt II, OS 1.17; Digitone II emulator only", what: "Plucked-string synth machine (decay, pick position, brightness, colour), loaded at run time"}
    - {name: "Frequency shifter", path: "modules/fx/freqshift", tested: "emulator", what: "Shifts every frequency by the same number of Hz, as a send effect or master insert"}
    - {name: "bootscreen", tested: "unit", note: "one Digitakt II 1.17 (finding 117); Digitone II emulator only", what: "Loadable boot screens (.dkbs files) in place of the stock intro"}
    - {name: "Overdrive curves", path: "modules/core/adapters/overdrive", tested: "emulator", note: "Digitakt II 1.17, patched into the image; SHARC emulator only", what: "OVR ROUTING becomes OVR TYPE: pre or post times eight curves (stock, TNH4, HARD, SOFT, TUBE, FOLD, FUZZ, SQR), and the top of the OVERDRIVE range drives harder"}
    - {name: "Fast USB", path: "modules/tools/usb-fast", tested: "unit", note: "Digitone II 1.12 and Digitakt II 1.17, 2026-11-11; from USB AUDIO/MIDI mode through a take-over to USB MIDI and back (hardware handover); in the standard device patch set since 2026-11-11, on the DT2 with a fast +Drive close; the take-over from USB AUDIO/MIDI lost a Digitakt II from USB until a power cycle in cycle 5 of 20 and, with a hold and PHY fix, cycle 11 (I80), so since 2026-11-13 it is off by default: a unit in USB AUDIO/MIDI stays on SysEx, and USB MIDI mode was fully reliable", what: "Sends samples to the unit over an added USB bulk interface instead of SysEx: an 8 MB file at 3.9 MB/s on a Digitone II against 0.68 MB/s over SysEx; falls back to SysEx when the link fails"}
    - {name: "TB303", path: "modules/machines/tb303", devices: [digitakt-2], tested: "emulator", note: "checked against a Python model on the emulated SHARC; about 8,000 SHARC instructions per 32-sample block", what: "Run-time machine porting the Open303 bass-line synth (MIT)"}
    notes: >
      Native Rust emulator that runs the ColdFire and SHARC+ firmware together, with front panel, display and audio,
      plus a web panel (WASM core), a Tauri desktop app, the patch toolchain "patchkit" (applies modules to the user's
      own .syx), a headless scenario runner with pinned PCM hashes, a control socket for patch injection and
      DSP/ColdFire analysis databases with Ghidra tooling. README caveats: the DSP "does not run in real time yet", the
      browser host is parked on branch wip/browser-host, "no patched firmware has been installed on a device", and
      recovery via the bootstrap menu is "not tested on hardware". patchkit refuses to change sections 2, 4 and 8.
      2026-11-12 (b657f37, via altstrument): a USB take-over for fast sample transfer in the workbench with a read-back
      hash check per file, a diagnostic module that reads card information, a restructured SDK, fixes to the card image
      and the patch kit on Windows. 982 commits, AGPL-3.0-or-later with extra section-7 terms (attribution, origin,
      names) in NOTICE; page shows 46 open issues. GitHub marks it as not a fork. The org ElekLabs has 2 public repos:
      digikit and a fork of js216/selache. Original author: the GitHub profile m-dwyer is named "Em D" (Melbourne),
      which is exactly the credit ElekLabs' NOTICE requires ("digikit by Em D"); Overtone credits digikit to "Em D" as
      well. The earlier repo m-dwyer/digikit (196 commits, 4 stars, GPL-2.0-or-later, README at the time: "no audio",
      last visible file HANDOVER-2026-09-16) shows no move/archive notice and does not mention ElekLabs. ElekLabs has no
      public members, so the pages themselves do not show who runs it; the maintainer (user of this repo) states that Em
      D develops in ElekLabs/digikit (2026-10-31, not verifiable on the pages). The licence changed from
      GPL-2.0-or-later to AGPL-3.0-or-later with extra terms. Treat both repos as one project line, ElekLabs/digikit
      being the current one. Mod READMEs that say "digikit's emulator" mean this project.
    latest_seen: >
      altstrument (2026-10-31): main @ 283bb90, untagged, described as patch toolchain AND run-time module system plus emulator; AGPL-3.0-or-later. Its device-side tools (dkupload, dklog) belong to that module system.
      2026-11-08 (PR #321, finding 117): loadable boot screens. A `.dkbs` file (1-bit 128x64 frames at 30 ticks/s,
      at most 10 s and 64 KiB, authored as a Canvas 2D script) replaces the stock intro through the module
      `bootscreen`; an optional patch set `device-introblank` blanks the stock intro. Holding REC at power-on starts a
      safe mode that loads no modules. Finding 117 reports both on one Digitakt II 1.17 with a branch image; the
      Digitone II is emulator-only so far.
      2026-11-09: the README's module table now lists the runtime and PLUCK as run on a Digitakt II (OS 1.17), so
      the earlier caveat that no patched firmware had been installed on a device no longer stands; listed under
