    notes: >
      Mod loader: user supplies the stock OS file, the tool builds the custom .syx locally. Device table in the README
      (3016dca, 2026-11-08): Digitakt mk1 and Digitone mk1/Keys supported; Digitakt II 1.17 and Digitone II 1.12
      experimental; Octatrack 1.40C supported (linkable core boots on an MKII); Model:Cycles and Model:Samples 1.13
      supported (builds work on both units); Analog Rytm MKII 1.74 supported; Analog Four MKII 1.56 experimental proof
      of concept (hook bus, mod storage, unused DDR and recovery checked on a unit). Canonical repo is unclear: the
      forum post also embeds github.com/elekloader/elekloader (web app at elekloader.github.io/elekloader); forks exist
      (AvroraPolnareff, naturarum, toonst, simonjohansson); none is listed, as none has changes of its own. Forum:
      builder issue reported 2026-10-19. Licence GPL-2.0-or-later. 2026-11-10 (8daa2ea): the shop's list, forms and bots
      moved to elekloader/shop (#338); mods are submitted there. machine-pages 1.8-1.10, machines-dn1 0.5/0.6 and
      machines-dn2 0.5 add mono machines and MIDI CCs (emulator-tested per TESTS.md). The linker now refuses odd jump
      targets into mod RAM after a Digitakt II froze at boot (I61). The README offers a Windows .exe; not every release
      carries the macOS .dmg. 2026-11-10 (main): core-ar2 0.13 opens the Rytm MKII's TEST slots 44-52 to mod machines,
      adds per-voice trig and velocity getters, screen calls through stock's routines and per-mod knob ids;
      machine-pages 1.7 tagged. 2026-11-12 (main): core-a4mk2 0.6 brings core-ar2 0.10-0.13's foundations to the Analog
      Four MKII (field defaults, the modified mark, the project-save event, payloads, knob looks, screen calls) and a
      37.7 MB mods' area. Builds pick older core or helper versions by themselves when a mod patches a place a newer one
      took (Tone+FX's Digitakt files and Digi EQ 1.0c link with DT1 core 4.0 only; OB-1 0.6 with machine-pages 1.2), and
      released versions stay available while a listed mod needs them.
      2026-11-13 (main): a third file family, ELE2, for the Analog Rytm MKI OS 1.74 (Modwerk's Rytm MKI research holds
      the measurements behind the profile); the README's table also names 1.73, the profile only 1.74. core-ot
      0.9-0.40 opens about 40 more Octatrack events and tables to mods (mutes, sequencer moments, LFO waves, popup
      rows, PATTERN SETTINGS and PERSONALIZE rows, the playback increment, card file calls, the engine task's jobs, a
      block to DSP core 1).
      2026-11-15 (FORMAT, SDK, CORES): std1 'standard events': a mod that sets events std1 subscribes to device-
      neutral event names, each core maps them to its own tables, and a subscription the core does not map is refused
      at link time; std1 and native mods link in one build. core-a4mk2 0.7 is the first core with it and adds native
      A4 events for knob turns, the analog voice frame and modulation edits. A frame-check build that copied one
      voice's analog frame words over another's silenced track 1 and was fixed in 0.3 (unit or emulator not stated).
      2026-11-16 (docs/CORES.md, DRIVE.md, FORMAT.md, core-dn1 README): on the Digitone mk1 the build descriptor now
      carries the stock bytes of each flashed range (ABI 1.2), and TELOS's linker refuses a +Drive mod site that is not
      stock on the unit, overlaps the flashed build or another mod, or a region outside a free area (link codes 21-28).
      core-dn1 5.4's core_stock_info copies the OS image to 0x44200000 before the OS runs.
      2026-11-17 (ADAPTING, FORMAT, core-ot, settings-ot, dspload-ot, core-a4mk2 READMEs): core-ot 0.41/0.42 add 16
      Octatrack events (tempo, scenes, card mount and USB DISK MODE, previews, recorder commands, pages, track select,
      windows, crossfader, pattern select and edits, arrangement); new dspload-ot 0.2 sends DSP code at run time
      (mod.json `dsp_load`), also for TELOS card mods; refusal code 23 `early` for a site the OS ran before the
      +Drive or card link. On the Analog Four MKII the lock service is now checked on a unit.
      2026-11-18 (v0.11.0, docs/DRIVE.md, CORES.md, drive-loader-a4mk2 and drive-loader-ar2 READMEs): v0.11.0 ships
      the newest core of every device, core-a4mk2 0.9 included. The Analog Four MKII gets its own +Drive mods loader
      (drive-loader-a4mk2 0.1, not yet run): stock 1.56 keeps the +Drive as raw sectors with no file system, so the
      loader keeps its own two-copy store in sectors stock never addresses. The Rytm loader (0.6) now reads each file
      into the +Drive area itself (a 64 KB floor replaces the 512 KB staging buffer), and +Drive mods may hold storage
      fields, sites over the OS, claims, tables of their own, knob ids and std1 subscriptions where the build's
      descriptor flags allow (descriptor ABI 1.3). drive-loader-ar2's README asks for core-ar2 0.14 while core-ar2's
      mod.json at the tag reads 0.13. New A4 MKII check mods for live recording, the sequencer and moments (read as
      expected in the emulator, 2026-11-14).
      2026-11-20 (ADAPTING, CORES, DRIVE, FORMAT; core-ar2 README and SKIPS.md; core-dt2, core-dn2, core-a4mk2,
      drive-loader, smpl-machines READMEs; new AR2 and DT2 examples): core-dt2 1.1 keeps mods' project and kit data
      in bytes stock writes as zeros (191 bytes a kit), adds value rows, a per-frame parameter event and key LEDs;
      core-dt2 1.2 and core-dn2 0.5 add what TELOS needs on the unit (card ready, project save and load, crash,
      restart, task list), checked in digikit's emulator only, not yet on a unit. core-ar2 0.15: knob faces, mod
      folders in the +Drive sample browser, pad strikes before stock and LED colours, a held USB input gain step,
      note ends, track mutes, DIN MIDI out, machines given slots by count; 0.16: four optional CPU skips, off at
      boot (silent voices, idle sample layer, the UI's dynamic_cast, idle delay and reverb), two of which change the
      sound slightly, and GLOBAL submenus. The linker hands out machine slots, page ids and mod-declared id pools by
      count, kept in the lockfile. New smpl-machines (a SMPL page machine layer) and smpl-knob-c. Five new Rytm
      check examples and kit-memo-dt2. core-a4mk2 0.10's core_project_keep lets the A4 loader's APPLY & RESTART keep
      unsaved project changes. core-a4mk2's README now says core 0.2's pages drew identically on a unit (OS 1.56).
      2026-11-22 (AGENTS, ADAPTING, CORES, DRIVE; core-ar2, drive-loader-ar2 and drive-loader-a4mk2 READMEs and
      PAGE.md; five new Rytm check examples): core-ar2 0.17 brings the std1 standard events to the Analog Rytm MKII
      and adds knob flags: a mod's own knob can open a destination list as LFO DEST does (only the list bit is
      honoured). core-ar2 0.18 adds restart calls. drive-loader-ar2 now needs core-ar2 0.18, marks mods with saved
      data with * and has APPLY & RESTART, as the A4 loader. The new Rytm check examples (std, std-midi, ui, voice,
      knob-flags) are built and linked only. The core-ar2 README restates its OS-upgrade restart check: analog-emu
      hung on 5 of 15 upgrades without core's restart routine and 0 of 15 with it (0 of 30 with the panel link paced
      as on a unit).
      2026-11-24 (docs/DRIVE.md, drive-loader READMEs): drive-loader-ar2 0.12 and drive-loader-a4mk2 0.2 give mods a
      versioned +Drive payload API (drive_payload_abi, count, at, find, info with id, length and sha256,
      dl_payload_read; imported weakly by sidecar-core) and lock a loaded mod's file until the next boot: an upload
      over it is kept as <name>.new and swapped in at the next boot with the new CRC written first, so a power cut
      cannot leave the new file under the old CRC; the MODS page shows UPDATE or LOST and refuses DELETE (IN USE:
      RESTART FIRST). On the A4 reads that span a card sector go straight into the caller's buffer (a 4 KB read
      takes 7-10 card reads, not 64-80).
      2026-11-25: core-ar2 0.20 adds `ev_store_adopt` (a sound or kit saved with another layout or before core storage
      is handed to its mod once as it loads; example adopt-check-ar2) and mod storage fields can be pinned to fixed
      bits with `offset`. core-ar2 0.21 moves the Rytm MKII mods area to 0x47B48000-0x47FFF000 (4.7 MB), above stock
      1.74 USB audio feedback ring at 0x47B47440-0x47B47480, which stock rewrites while a host has the audio alternate
      setting selected; 0.11-0.20 started at 0x47B10000 and reached that ring once a build passed 221 KB.
      2026-11-26 (docs/ADAPTING.md, DRIVE.md, core-ar2 README and SKIPS.md, examples/drive-machine-check-ar2):
      core-ar2 0.22 lets +Drive mods add machines too: `core_machines` now spans all 19 hidden slots 34-52 (was 10,
      slots 34-43), and the Drive Loader's entries reach the machine table after `ev_boot_drive`, after which the
      project loads again (with 0.21 they never reached it). New example drive-machine-check-ar2 tests this without a
      +Drive.
      2026-11-27 (docs/ADAPTING.md): the build profiles pin -std=gnu17, so a gcc that defaults to C23 (15 and later)
      builds the same code; a mod's own cflags may name another standard.
    latest_seen: >
      altstrument.org and the repo (read 2026-10-31): canonical repo is github.com/elekloader/elekloader (183 commits, 103 stars, GPL-2.0-or-later); web app moved to elekloader.github.io/elekloader; the Mac app was absent from v0.9.0 because signing secrets need renewing. v0.9.0 cores: core-4.1 and core-4.1-os1.54 (Digitakt mk1), core-dn1-4.1.1 and -os1.44 (Digitone mk1), core-ar2-0.8 (Analog Rytm MKII 1.74), core-ot-0.8 (Octatrack 1.40C), core-mc-0.3 (Model:Cycles), core-ms-0.1 (Model:Samples), core-a4 0.1-0.4 (Analog Four MKII 1.56). Kit 0.7.0 catalog: 19 cores, 88 mods. machine-pages 1.2/1.3/1.5 need core 3.0+ on Digitakt mk1 and refuse NEIGHBOR 0.6, SOPHIE 1.1.13 and digichain-based machine mods beside them; fxkit 0.1 gives Digitone effect mods a shared mixer, two LFOs, pattern p-locks and a CPU guard; core-dn1 4.1 adds ev_note_queue; kit 0.6.0 gives 4.0 cores larger RAM areas (256 KB Digitakt, 1.25 MB Digitone). docs/ includes AGENTS.md, DEVICES.md, MACHINES-DN2, SHARC-DN2, CORES, FORMAT, BUILDING, ADAPTING (not all read yet - see hardware/MINING.md). The earlier irpina/elekloader repo is where the author's older releases lived.
