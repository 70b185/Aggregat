    notes: >
      2026-11-12: the Octatrack card firmware builder is retired: modules reach an Octatrack only through the Modwerk
      base, over USB or as one set file (MODWERK0.SET) on the card; Tuner, Stem Rec and Temp Save paused until they
      have base versions; Spectrum, Modulation, Character and MIDI Scenes removed for good; CPU-rendered machines get a
      budget (CPU FULL) after FM Synth froze an MKII (I79); POLY8 and FM Synth carry a Heavy CPU badge; checks refuse
      writes into the stock DELAY table and odd jump targets; the DT2 base hides the raw +Drive block write from
      modules; Octatrack modules moved to sdk/octatrack/modules; new experimental Crossfader and Live Looper for the
      Digitakt I (OS 1.54) and Amiga, a tracker-style sample machine, for the Octatrack.
      2026-11-11/12: the Octatrack base and USB installs are open to everyone (first install still from the card, at
      most 20 modules per set, 24 since 2026-11-14; Tuner, Stem Rec and Temp Save card-only); USB Audio is off unless the set has the USB Audio
      module; skipping modules at boot moved from FUNC to holding PROJ at power-on (MKI keeps FUNC); the octabam pin is
      frozen (Modwerk follows only elekloader upstream); Analog BD 0.1.7 has a new 909 model; base-update and SYNTIZ
      incidents I75 and I76.
      2026-11-09/10: Octatrack beta: the silence after USB DISK MODE (finding 72) was the base mistaking stock's DSP
      pause for a stall, fixed (I69); FM Synth with many FLEX tracks no longer loses the audio on PLAY; the Octatrack
      page asks for a power cycle when the DSP has stopped; Temp Save 0.1.0 withdrawn from USB installs (card build
      stays). Modwerk also loads effects onto Zoom MultiStomp pedals now (ZDL files over USB; not an Elektron device).
      Browser-based hub, builds locally from the user's own stock OS. Browse mods by device,
      forum with a section per device, shared SDK. Dubspot (13 Oct): several modules are still
      early prototypes. last_activity = date of the Dubspot article, not a forum post.
      2026-11-02: three Analog Rytm MKII modules by npp1993 moved into the library (Pipo Loop 0.1.1, Sample RATE 0.1.0, Silent Pad+Trig Settings 0.6.0, all experimental, OS 1.74; linkable together with core-ar2 0.7, Filter Hz and Loop Sync; the packages themselves not yet run on a unit). `_submissions/` takes no new modules. The Octatrack USB beta also works on the MKI.
      2026-11-03: the site now lets you download a built Analog Rytm MKII .syx (after confirming you know how to get back to stock); new Rytm module quick-velocity-aftertouch-assign with a verification note. Zoom pedals: an effect whose group+ID clashes with one already on the pedal is moved to a free local Delay ID 958-1023 (ID only in the ZDL header at 0x40-0x41, no checksum); two effects with the same group and ID froze an MS-70CDR at boot until its ROM was reprogrammed.
      2026-11-04/05: Rytm MKII downloads on (records); npp1993's Control In Actions (footswitch or 0-5 V gate on EXP/CV IN as ACTION for MUTE and more) and Quick Velocity+Aftertouch Assign join the library, Silent Pad+Trig Settings 0.7.0; euclidean 1.1.6 for Digitakt I 1.53/1.54 reported working on a unit by sumedho (all cases, save/reload, power cycle).
      2026-11-08 to 11-10 (74c9eb2): Rytm library gains comp-preview, kit-ab, lfo-rnd and voice-dac (from rytm2_mods, unit runs on the Modwerk base), ctrl-in-perf and scene-mutes (from rytm-mods-src 0017/0018, unit runs T208/T210/T221), Improved Machine Browser and MIDI Mute; the Octatrack key bus moved to the tail of the first FX2 slot (checked on an MKI and an MKII); a Digitakt II audio scheduler is proposed (emulator only); Zoom MS-70CDR pedal work (out of scope here).
      2026-11-12/13: Octatrack base: a stall record now keeps the 128 frames before it; an installed Sidechain no
      longer causes NO ROOM on every pick after a restart (I96); a new USB device revision (bcdDevice 0x0101) repairs
      Windows hosts that could not open the unit (I100); a machine engine's DSP price moved into its package; the base
      refuses a module machine or effect pick while the CPU meter is at 85 % or more; VECTOR 0.3.2 fixes a whole-bank
      reset (I95); SYNTIZ and Tape Echo get a Heavy CPU badge. Rytm MKII: the send-bus base gains digital voices; new
      Improved AMP and BD ANALOG (I97-I99). module:doctor covers Digitakt II modules; a Digitakt II pre-send render
      hook is proposed (emulator only). FRACT, an Octatrack granular machine draft by ex1010, has a functional unit
      report (2026-11-10).
      2026-11-14 (second pass): the Digitakt II moved from research to preview: the site builds core 1.0 with library
      modules in the browser, downloads stay off, OS 1.17 only; the first DT2 library module is Track Names; DT2 phrase
      modules can continue phrases across empty steps, follow microtimed trigs and save settings in a project archive.
      Octatrack: a two-step base update for units whose RAM stage is too small; the CPU guard counts the picked machine's
      price and judges a stopped unit by its last playing load (I105); POLY8 0.3.3 and FM Synth 0.1.3 cost far less
      while installed on no track (FM Synth 0.1.3 also fixes track 1's LFO 3); `device:price` measures a module's cost;
      a new Octatrack Diagnostics page on the site.
      2026-11-14 (changelog, verification): an Octatrack module set may hold 24 modules (was 20, still temporary); the
      base may grow to 1.5 MiB, so units on a base older than 2026-11-13 take it as two USB updates, and a base update
      retries up to four times when a reply goes missing before the write starts. New project and bank events (load,
      save, reload, new project, Part save and clear) let a module keep its own file beside the project. Amiga 0.3.0
      (experimental) adds a SYNC stretch mode that follows the project tempo; in a RAM trial on an MKII an earlier
      build of it restarted after about 90 s on a twin that also carried a base change under test (I109). Filter Hz
      1.2.1 (Rytm MKII, from rytm2_mods' port of 0008-filter-hz) widens the box behind a locked FRQ so kHz values fit;
      a maintainer ran it on a Rytm MKII on OS 1.74 on 2026-11-14.
      2026-11-16 (changelog 2026-11-14/15, LINK.md, TEST_RUNNER.md): Rytm MKII development bases carry a SysEx USB link
      (screen, memory, keys, encoders, remote flash, and a boot from RAM with no flash write), and a test runner plays
      scripted cases on rytm-emu or a unit over it. Filter Hz 1.3.0 shows the FX track's delay and reverb HPF, LPF and
      reverb FRQ in Hz.
      2026-11-17 (changelog 2026-11-16/17, verification, module docs): Octatrack base versions start at 0.7 (shown as
      MODWERK BASE 0.7 on the unit; 0.7.1 to 0.7.5 the same day): PROJ > MODWERK > MODULES switches installed modules
      on and off; a project remembers which machine each track uses, so a missing machine is named instead of playing
      FLEX; one module may use 288 KiB (was 128) and may borrow sample memory while installed; windowed modules such as
      Tuner can come over USB (base 0.7.5); packages are no longer refused for sharing byte runs with stock; every
      Octatrack module must name its CPU price (`resources.cpuPrice`); `module:doctor` reports DSP register writes
      against each hook site's contract; stall records name each DSP core's last packet. New Octatrack modules Kits
      and MIDI Scenes 0.3.0 (experimental ports of octabam's modules, short RAM trials on the owner's MKII); the
      Octakit draft is removed. New Digitakt I module CC Remap. Rytm MKII: a third base variant, voices; Ping Pong Loop
      folded into Improved SMPL 0.6.x; size-only updates of several modules run on the author's unit; Analog Rytm MKI
      builds are refused when the update exceeds the upgrade buffer or touches the boot-flash writers. Goal pages for
      contributors on the Digitakt II and the Syntakt (no Syntakt module yet). Field diagnostics 12-16 Nov: 87 units.
      A dialog on the site says the project's future is uncertain and asks for maintainers.
      2026-11-18 (changelog 2026-11-07..17, verification, machine guides): Octatrack base 0.7.7 skips stock's delay
      work for tracks whose delay is silent (CPU meter 41 to 34 % with DELAY on every track); a machine's CPU price is
      now its mean cost per playing track (FM Synth 0.1.4: 6 %, seven tracks a Part); DSP voices book only what the
      bank's Parts use (core 0 up to 3,120 cycles); a shared scale file for Octatrack modules. Rytm MKII: sets linked
      by Modwerk's own linker may use 704 KiB or 3.7 MiB of DDR above the 128 KiB mod area; the voices base drops the
      FX lock words (1,752 B more for modules). Rytm MKI SDK guide published (research). Digitakt II: the site builds
      Modwerk's base 8650bb8a on core-dt2 1.1 (elekloader#221 at 0df8409), downloads still off; new modules MIDI
      Engine (Rytm), Euclidean Scale and Mute Latch (DT2), Vibrato (Octatrack, from octabam). Machine maintainers may
      now merge a machine's first module releases; pull requests that change a built package stay drafts until that
      build ran on a unit. The dialog saying the project's future is uncertain was removed.
      2026-11-18, later (changelog, OCTATRACK_PACKAGE_DSP_HOOKS): Octatrack base 0.7.8 makes the per-track sound-source
      hook (DSP site 5) a chain (#1098): the base offers each track to every installed DSP track machine in turn and the
      first that owns it plays it, so a second DSP machine (BlackPyramids) can install over USB beside Analog BD; Analog
      BD's package and sound are unchanged. The key bus (option B) is merged (#737).
      2026-11-19 (changelog 2026-11-14..19, DESKTOP_APP, MACHINE_RECIPE, HOOKS, MODULE_PERFORMANCE, arr-rows, butter-
      fingers, Digitone II verification): every contribution, core work included, now comes to Modwerk as a pull
      request, and every machine is to get a Modwerk base (Digitone II and Analog Four MKII included). Octatrack base
      0.7.8 lets modules rest when unused; 0.7.9 adds a shared Part Edit menu and fixes an effect lost after a project
      load (I154). A desktop app (Electron, WebUSB and Web MIDI) is in development, Windows only so far, never run
      against a unit. Digitone II: core-dn2 0.3 builds booted on a second unit from Transfer, and stock 1.12 came back
      with a normal update; no Modwerk module can be built for it yet. Two stock Octatrack arrangement bugs found by Arr
      Rows (SB33, SB34).
      2026-11-20 (changelog 2026-11-18/19, verification 2026-11-19 beta diagnostics, OCTATRACK_DRIVING, MODULE_PERFORMANCE,
      machines guide, micro-timing README/TESTING, Digitone II GOAL): most of the day's changelog is web app, agent
      board and tooling. Octatrack: base 0.7.9 is the site's base since 2026-11-18 (about nine units by 2026-11-19);
      base 0.7.10 is to add a refusal code of its own when a module's DSP claims meet a delay buffer (code 12) and to
      log which check refused a module at start. The card holds two set slots (MODWERK0.SET, MODWERK1.SET); a set
      loaded from the card is made the one the next boot prefers while the other stays for recovery. A live CPU/DSP load card on the site (USB). The
      machine guide now explains the frame guard's budget and how to count skipped renders. New draft Micro Timing
      0.1.1-experimental (own_mods); its remembered row moved out of battery RAM into the module's own memory. Zoom
      MS-70CDR: Sync repairs an effect missing from the pedal's list; the list is written back only while the pedal
      stays connected. Digitone II: Modwerk's own linker knows OS 1.12 and links core-dn2 0.3 and 0.4 byte for byte
      as elekloader does, but refuses mods with DSP code; the site builds no Digitone II firmware yet. Base changes now
      collect in one draft pull request per machine, shipped by the owner after long tests on a unit; device
      reviewers (assigned per machine) approve first module releases.
      2026-11-21 (changelog 2026-11-17..21, verification 2026-11-19..21, OCTATRACK_USB_AUDIO_MODULE, TEST_PROCEDURE,
      DIGITONE_II_OS_RESEARCH): Octatrack base 0.7.10 gives a DSP claim that meets a delay buffer its own refusal
      (code 12, naming the FX2 slot to move), logs which check refused a module at start, brings Analog BD back after
      a rolled-back trial (I178), lets Undo finish once a module's page is closed, and cuts the UI-tick cost of large
      sets; 0.7.11 (served) waits for a project load to finish before it changes the DSP's effects (I180) and rests
      unused machine and effect modules; 0.7.12 (staged) installs USB Audio 0.3.0 as one module configured on the unit
      instead of seven base variants (reconnect failures fixed on the way, I176, I177). Installed but unused modules
      may cost at most 0.2 points of the frame interrupt from now on, or must rest. Every module or base change now
      goes through one test procedure that the submitter runs; reviewers only read its record. A fast MIDI soak and a
      queue for the shared unit are new tools. New modules: kitbank for the Digitone (OS 1.44) and Screen Off for the
      Octatrack; Improved SMPL 0.6.3 and Direct Jump Kyoti 0.2.0 (V7.3). Digitone II: the research page names the
      MCF5441x, the SHARC+ boot over DSPI2 and the ARM core; the site can read a development base and upload a module
      to its RAM, but no Digitone II module exists yet. Also 28 Zoom MS-70CDR effects (not an Elektron device).
      2026-11-22 (changelog 2026-11-21, verification 2026-11-21, MODULE_PERFORMANCE, MODULE_RESOURCE_GAUGES,
      TEST_PROCEDURE, OCTATRACK_DRIVING, effects guide, Grain, analog-bd and qperf docs, Rytm README): Octatrack
      base 0.7.13 judges a module machine pick on a busy unit by the CPU-meter points the machine adds (measured on
      a unit against Flex) instead of its frame price, which had refused Grain on a Part that played at 43.5 % on
      the owner's MKII. Module pages show measured CPU, DSP and memory figures where they exist and estimated tiers
      elsewhere. New track machine Grain (granular, up to six grains), measured at length on the owner's MKII; it
      still misses the frame deadline with 20-channel USB capture, and a panel freeze after one Grain trial is
      unexplained (I187). Under ot_emu the CPU meter reads 100 % from boot, so the emulator refuses every module
      pick. The effects guide explains the DSP56300 div half quotient. Rytm MKII: QPER Live Rec 0.3.0 follows
      pattern-length changes, BD ANALOG 0.2.2 drops the 808/909 badge, and Improved Performance (audio load 85.4 to
      72.1 % on the author's unit) entered the library and was retired the same day, to be folded into the Rytm
      base. Every machine now runs one test procedure; Rytm unit steps run over its link with a RAM boot. Base work
      now goes to one cumulative draft per machine.
      2026-11-23 (changelog 2026-11-22, verification 2026-11-22, MODULE_PERFORMANCE, MODULE_AUTHOR_UPDATES, Grain
      README/TESTING, Rytm README, Pad Pressure Fix README): testers run released Octatrack base 0.7.13; one
      logged a UI stop during playback with six modules installed (I191), and a Windows tester saw failed USB
      staging and a USB Audio trial rolled back at the reconnect (I192); the installer now retries claiming the
      returning interface. Grain 0.1.2 treats the sample as a ring and plays each grain 3 dB lower. Rytm MKII:
      package builds refuse audio code that needs over 512 B of stack; Pad Pressure Fix moves into the base. An
      unpublished Elemod update can be rolled back.
      2026-11-24 (changelog 2026-11-19..24, verification notes): base 0.8 admits modules by frame time instead of
      the mean meter (renders capped at 122 % of a frame) and holds late frame entries so the DSP skips a frame
      instead of stopping (I198, I199); a USB re-attach watchdog; LCD capture over USB at 5-30 fps; USB audio input;
      Part Edit rows can hide; sample-editor SNAP; restore outcomes named on the Status page; the site engine can
      upgrade a Digitone II's OS over USB MIDI (no UI yet). Base stock fixes: three are Zac-Kyoti's MIT code from
      octatrack-kyoti-fw, the USB input receiver is copied from octabam. Open: FM Synth 0.1.5 keeps costing about 11
      frame points after its notes (#2030), RAM boots not seen by the host about 1 in 3 (#1985), a card-save failure
      after a Keep on 0.8, a 0.7.12 stall and UI freeze on a tester's MKI.
      2026-11-25 (changelog 2026-11-20..24): new base table `ot_settings` (PROJ > MODWERK > SETTINGS) for whole-
      instrument settings; Kits 0.1.1 needs base 0.8; Mute Modes 0.2.3, Scale Quantizer 0.1.5 and SYNTIZ 0.1.1
      updated; a release dated from 2026-11-24 needs curve and admission evidence (only the owner can waive it);
      Python 3.12+ required; a widened identity gate caught 10 of 10 planted faults (old gate 1 of 10); device tools
      also drive an MKI (FUNC + MIDI opens the Part window). Base 0.8 stock fixes (SB10, SB12) passed on the owner's
      MKII; USB Audio INPUTS fail on Windows 10 (I205). Digitakt II: OS 1.17 saves a kit when only module kit data
      changed (2026-11-25, Euclidean Scale 0.2.0).
      2026-11-26 (changelog 2026-11-23..25, verification 2026-11-23 and 2026-11-25, Model:Cycles SDK and LINK.md):
      Model:Cycles (OS 1.13) gets a Modwerk base in development, built from elekloader's core-mc 0.3 plus a key-LED
      hook; it carries a USB MIDI SysEx link (identity, audio load, diagnostics log, the Octatrack's runtime loader for
      RAM trials; development bases add memory reads, keys, encoders and a RAM boot) and ran flashed on a submitter's
      unit; no module yet, the page is beta-only and downloads are off, so the Model:Cycles is not in this entry's
      devices yet. Octatrack: new FX modules Mackity (Airwindows port) and Midiverb I/II (Alesis programs); an
      oversized module set is now stopped before sending (787 kB of module memory on the unit); `device -- boot`
      refuses to RAM-boot over an unconfirmed two-slot update (each restart spends one of its two starts, I219);
      a test procedure with a preflight, an emulator rehearsal and a Part put-back; a shared DSP gate harness and an
      Airwindows port template. Midiverb's forced stock switch widget crashed the owner's MKII (I218). Rytm MKII:
      saved sets that name retired modules open again; all twelve pads once read as held in stock's key table.
      Modding guidelines gain "Respect the instrument" (build for the instrument's own panel, no one-to-one copies).
      2026-11-27 (changelog 2026-11-02..27, verification notes, module and machine docs): Octatrack base 0.8.2 skips two
      recorder writes to battery RAM that almost never change anything, keeps the fixes stock's checks make at power-up
      (I234), reads the recorder bank stock selects (I233), places big DSP effects under the words Sidechain claims
      (I235), caches UI-tick bookkeeping and adds MODWERK menu levels; POLY8 paused; FM Synth and UNGEMACH repriced on a
      medium pattern (I238). Digitakt II: added track machines (types 7-10) with their own DSP players, mixer hooks,
      linked voices (SETTINGS > VOICES) and Modwerk's own SHARC assembler; effect-slot and filter-type designs approved,
      no code yet. Model:Cycles: a status page and beta downloads. Rytm MKII: new Light Taps module. The changelog also
      documents a patch SysEx protocol for two Zoom effect pedals (another brand, not catalogued).
      2026-11-28 (changelog 2026-11-24..28, verification 2026-11-26/27 for OT base 0.8.3, DT2 bounded transmit and the
      newer Digitakt/Digitone cores, OCTATRACK_DRIVING, OCTATRACK_API, ELEMOD_SOURCE_BUILDS, TEST_PROCEDURE,
      MODULE_PERFORMANCE, machine READMEs, DT2 LINK.md, new module READMEs and TESTING files): Octatrack base 0.8.3
      reads the current Part from SRAM instead of CS1 inside the frame interrupt (one frame point saved), marks
      unreadable saved-set files DAMAGED and overwrites them on the next Keep, names knobs after the drawn track,
      counts USB Audio streams in the CPU limit, keys its attach watchdog on SET_CONFIGURATION (I243), clears stock's
      mass-storage replies at a USB reset (I241), logs usb_gone and stays off the bus for 10 s before a forced
      reconnect (I242). Known issue: a rare USB drop through a hub on a Mac, about 1 in 30 installs or removals.
      Digitakt and Digitone sets are pinned to elekloader core 4.4 and core-dn1 5.4; the builder falls back to the
      older core when a set does not combine (Digi EQ 1.0.2 needs core 2.1, KitBank 0.2.0 core 2.x), and CC Names now
      builds beside DIGISLICER. Modwerk now imports FLEXMODS' Ctrl All, Kit A/B, Real Units and Track Solo, DT-FM
      1.2.1 and MIDI Loopback 1.6 for the Digitakt, and DigiHoard, DigiPrism, DigiReel, DigiSwarm, DigiTide, DigiTriad
      and MUTINY for the Digitone, as the authors' released .elemod files, unchanged; none has run on a unit in
      Modwerk. Track Solo needs the seq-events dependency, so it cannot sit beside Euclidean (same step-fire sites).
      Set pages warn when modules have no CPU cost measured on a unit, after large Rytm sets froze a unit on a
      livestream (I248). Digitakt II: an offline USB binding preflight only, no responder yet. The compiler check now
      refuses GCC 16.2 objects where the late-combine pass folds a post-increment load and an indexed store (stores
      one byte late on the ColdFire); -fno-late-combine-instructions avoids it.
      2026-11-28 (later changelog, FRONTEND_MCP): the site's Status page now says when an Octatrack drops sound to
      keep up (50 or more frame-guard skips in a minute, read from one log page every 16 s) and names the tracks.
    sources: [gearnews, dubspot, forum thread 36, "changelog (2026-11-11)", "module READMEs (2026-11-12)", "changelog, verification 2026-11-12, sample-rate README (2026-11-13)", "changelog, docs/verification, MODULE_PERFORMANCE, OCTATRACK_* docs, Rytm module READMEs (2026-11-14)", "changelog, track-names README, OCTATRACK_TWO_SLOT_BASE (2026-11-14, second pass)", "changelog, verification filter-hz 1.2.1, OCTATRACK_TWO_SLOT_BASE, HOOKS, amiga TESTING (2026-11-15)", "changelog 2026-11-14/15, LINK.md, TEST_RUNNER.md, filter-hz 1.3.0 verification (2026-11-16)", "changelog 2026-11-16/17, docs/verification 2026-11-16, kits, midi-scenes, cc-remap READMEs, digitakt-ii and syntakt GOAL.md (2026-11-17)", "changelog 2026-11-07..17, docs/verification 2026-11-03/17, machine READMEs (Rytm MKI/MKII, DT2, OT), delay-harness, midi-engine, euclidean-scale, mute-latch, vibrato READMEs/TESTING (2026-11-18)", "changelog 0.7.8, OCTATRACK_PACKAGE_DSP_HOOKS (2026-11-18, later)", "changelog 2026-11-14..19, DESKTOP_APP, HOOKS, MODULE_PERFORMANCE, arr-rows RESEARCH, butter-fingers TESTING, verification 2026-11-18 (2026-11-19)", "changelog 2026-11-18/19, verification 2026-11-19, OCTATRACK_DRIVING, machines guide, micro-timing README/TESTING, digitone-ii GOAL (2026-11-20)", "changelog 2026-11-17..21, verification 2026-11-19..21, OCTATRACK_USB_AUDIO_MODULE, TEST_PROCEDURE, DIGITONE_II_OS_RESEARCH, kitbank and screen-off READMEs (2026-11-21)", "changelog 2026-11-21, verification 2026-11-21 (CPU guard meter cost, Rytm analog-bd 0.2.2, improved-performance, qperf 0.3.0), MODULE_PERFORMANCE, MODULE_RESOURCE_GAUGES, TEST_PROCEDURE, grain README/TESTING (2026-11-22)", "changelog 2026-11-22, verification 2026-11-22 (OT beta diagnostics, USB Audio trial reconnect), MODULE_PERFORMANCE, MODULE_AUTHOR_UPDATES, Rytm machine and Pad Pressure Fix READMEs, grain README/TESTING (2026-11-23)", "changelog 2026-11-19..24, verification 2026-11-19..23, MODULE_PERFORMANCE, OCTATRACK_DRIVING, HOOKS, stock-fixes, Impro