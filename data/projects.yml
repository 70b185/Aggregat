    tested_note: "SOLID with every other card ran on a Model:Cycles 2026-11-11 (six SOLID tracks about 60 % CPU, peaks 75 %) and was flashed from the web page the same day; SAMPLE 0.16 and 0.17 flashed with every card from the command line and from the page on 2026-11-12/13; Perform Kit ran on a unit alone and with every card and was flashed from the page on 2026-11-14 (pattern chains and FUNC + PLAY inside the mode not tried); the 0.64 pictures ran on a unit from the command line only; CHIPS ran on a Model:Cycles from the command line on 2026-11-15/16 and was flashed with every card from a locally served page on 2026-11-16 (its CPU load on the unit not measured); release 0.66 flashed from the live page 2026-11-15 and fixed held previews (I113); MAXSAW ran on a Model:Cycles from the command line and was flashed with every card (release 0.69) from a locally served page on 2026-11-16; TERRA ran on a Model:Cycles from the command line with the CPU page on 2026-11-17 (six tracks CPU 67 %, peak 80 %) and was flashed with every card (release 0.72) from a locally served page the same day; Chord Joy (CHORD+, release 0.76) ran on a Model:Cycles from the command line in a build with every card on 2026-11-19, after a fix found in its first unit test"
    base_os: '1.13'
    version: "release 0.76 (beta; 2026-11-19): CHORD Tables becomes CHORD+ and adds Chord Joy (chords of a major key on the TRIG keys), tested on a unit; release 0.75 (21 cards; 2026-11-18): VOSIM, a port of Braids' VOSIM oscillator with formant tracking, tested on a unit; 0.74: the way back to the official Model:Samples firmware is no longer experimental; 0.73: the flasher resends once after a USB timeout; release 0.72 (2026-11-17): TERRA"
    last_activity: "2026-11-19"
    notes: >
      Repo was offline 2026-11-07 to 11-09 (check_updates 2026-11-08); public again on 2026-11-09 (altstrument and SPOKES change reports; README read 2026-11-10). Beta fork of Modded Cycles 1.55 with a short mod list in the browser picker. Licence: MIT; distribution: browser-installer. Listed by altstrument. 2026-11-02: a web Manager keeps one Model:Cycles project per firmware: it backs up the current project, flashes the other firmware over USB and restores that firmware's project (notes/77).
      2026-11-15 (README, notes/81): Perform Kit (SETTINGS + PATTERN) keeps the six track sounds, levels and
      delay/reverb values across pattern changes, after the Digitakt II's PERFORM KIT mode; nothing is kept unless the
      pattern is saved. The README no longer offers the web Manager: it advises one project per set of machine cards,
      since a project belongs to the firmware it was made on (on the official OS a project that names an added machine
      can freeze the MACHINES page).
      2026-11-16 (README 0.68, notes/83, notes/60): CHIPS is model27's own fixed-point rewrite of Plaits' chiptune
      oscillators (MIT); Plaits' trigger arpeggio is replaced by an arpeggio inside each note. A CHIPS square costs
      about a third of TONE's instructions a block. One-Shot is pinned at v0.18. A note and its immediate note-off in
      one batch left previews held with GATE on (I113).
      2026-11-17 (README 0.69, notes/84, REGISTRY, PROVENANCE): MAXSAW is model27's own code (MIT) built from the numbers
      and formulas in Adam Szabo's KTH 2010 thesis, no code taken; the Syntakt's SY SWARM uses the same detune curve.
      MAXSAW costs about half of TONE's instructions a block (Sub off). The web Manager is linked from the site again.
      SAMPLE stays at One-Shot 0.18.
      2026-11-18 (README 0.72, notes/85, notes/57 section 7, BUILD.md, REGISTRY, PROVENANCE): TERRA is model27's
      fixed-point rewrite of Plaits' wave terrain engine (MIT); Plaits' wavetable data (about 50 KB) are copied
      unchanged. To fit them the builder learnt "far tables": large read-only tables placed in the variables' room
      above the code window. Six TERRA tracks showed CPU 67 %, peak 80 % on a unit; TERRA 0.2 stops clicks at trigs
      through the stock VCA (I144). The flasher now asks which device you own; the Samples OS tab and flasher/?samples
      are gone. The flasher refuses an OS file with more than 16,270 SysEx packets.
      2026-11-19 (README, CHANGELOG, MAKING-MODS, notes/86, 63, 57, 37): release 0.75 adds VOSIM (Braids' integer steps
      kept, MIT) with SWEEP formant tracking and a CONTOUR window; the dispatcher tables now hold eight machines, so all
      six added machines and CHORD Tables can be ticked together, and a full build ran on a unit. The normal return from
      the Cycles OS to the Samples OS worked on a real Model:Samples (2026-11-18). A tester's Model:Samples stalled at
      0-1 % on the first USB send with every flasher of this protocol, the second always worked; 0.73 resends once
      (I156). Packaging rules moved to MAKING-MODS.md; CHANGELOG.md is new.
      2026-11-20 (notes/87, CHANGELOG, README 0.76, BUILD.md, REGISTRY, PROVENANCE): release 0.76 renames CHORD Tables
      to CHORD+ and adds Chord Joy, model27's own code (the idea from Chord Keys, none of its code): MACHINES + PUNCH
      turns it on per sound; TRIG 1-7 play the degrees of a major key, each with its chord on SHAPE, TRIG 8 the root an
      octave up; TRIG 9-16 with a degree held change the chord's colour until released; with REC + PLAY the chords are
      recorded with a SHAPE lock. It sits in CHORD Tables' package because two packages that extend the same stock
      machine cannot be composed. The first unit test heard each new chord start on the old one and slide over; the
      cause was the OS's per-block parameter smoothing, and the fixed build passed on a Model:Cycles the same day.
    features:
      - "added machines you can combine freely in the browser builder"
      - "the builder checks that the chosen mods fit together"
      - "added machines: SOLID, CHIPS, MAXSAW (seven saws), TERRA (wave terrain), VOSIM (formant pulses)"
      - "CHORD+: the CHORD machine plays your own wavetables, and chords of a key with one finger on the TRIG keys"
      - "Track FX controllable by MIDI CC 74/71/75/76"
      - "SAMPLE: hear a +Drive sample from the browser on the pad or TRIG keys before loading it"
      - "Perform Kit: keep the track sounds, levels and effects across pattern changes"
