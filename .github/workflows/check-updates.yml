name: check-updates

# Fingerprints every watched repo (git ls-remote + blobless tree listing, no API token needed)
# and commits state/fingerprints.json + state/CHANGES.md when something moved.
on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scripts/first_seen.py reads the history of data/*.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check watched repos
        run: python3 scripts/check_updates.py --update
      - name: Refresh public GitHub numbers (creation date, stars, licence)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/repo_meta.py || echo "repo_meta failed; keeping the old file"
      - name: Rebuild pages (latest-tag column)
        run: python3 scripts/first_seen.py && python3 scripts/build.py
      - name: Export database and duplicate report
        run: |
          python3 scripts/research_snapshot.py   # before export_db, which records the snapshot hash
          python3 scripts/export_db.py
          python3 scripts/find_duplicates.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "aggregat-bot"
            git config user.email "aggregat-bot@users.noreply.github.com"
            git add state README.md INDEX.md devices MODS.md DEV-TOOLS.md MUSICIAN-TOOLS.md PROJECT-FAMILIES.md export hardware/DUPLICATES.md research
            git commit -m "check-updates: $(head -3 state/CHANGES.md | tail -1)"
            git push
          fi
