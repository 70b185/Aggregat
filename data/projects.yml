# Aggregat – project metadata (links + status only, no firmware, no binaries)
#
# Fields
#   id             unique slug
#   name           project name
#   author         handle(s) as published
#   kind           mod | loader | emulator | editor | tool | research | resource | request (a custom OS is a mod too:
#                  since 2026-11-11 there is no separate kind for it, the line between the two was never defined)
#   devices        list of device slugs (see devices.yml); for an entry in the mods list only the devices it ships mods
#                  for (tools or file support for other devices go into notes)
#   repo           primary source repository (null if none known)
#   links          other URLs: homepage / releases / forum thread
#   status         unreachable (repo gone or private) | active | beta | alpha | stable | wip | pre-release | released | done | request
#                  | unlabeled (README gives no maturity label) | unknown (could not be determined)
#   base_os        stock OS versions the project targets (as stated by the author)
#   version        latest version/release named in the sources
#   last_activity  YYYY-MM-DD of the latest forum post / release we saw (not a commit date)
#   notes          short free text
#   sources        where the information came from
#   license        optional: the licence the project states, as we read it (e.g. MIT, GPL-2.0-or-later,
#                  "not stated" when the repo shows none); leave it out when we have not read it
#   also_lists     optional: further topic lists the entry appears in (e.g. [mods] for a research repo that ships mods)
#   own_mods       optional: the mods a loader or platform ships itself that have no entry of their own, one per line:
#                  {name, what (our words), tested (unit|partly|emulator|not-stated), and optional author, devices
#                  (default: the entry's), version, path (in the entry's repo), note, origin (catalogue id it was
#                  ported from)}. The entry is then listed under "Loaders and platforms", and its own mods together
#                  as ONE mod entry "<name> mods" (one entry per repo, like any collection), installed via it; picking
#                  the loader on the website shows that entry, and its contents list each mod.
#                  A mod that lives in a repo of its own gets an entry with `mod_for` instead.
#   install        optional: how a user installs it, when no mod_for relation says so
#   features       mods: the main things the mod does, a few short points in our own words, read from its README
#                  (with "README (YYYY-MM-DD)" in sources); when the README changes, the daily update rereads it
#   contains       optional: the named mods/modules inside a collection, as its repo lists them (with the date read)
#   tested         mods and loaders: what the author (or a report we cite) says about tests -
#                  unit (ran on a real device) | partly (some builds or parts on a unit, others not) |
#                  emulator (emulator or host tests only) | not-stated (the sources we read say nothing).
#                  tested_note: optional one-line detail. This records claims, it is not our own test.
#   relations      optional: links to other entries, each {type, id, evidence}; evidence names what proves it
#                  (GitHub's fork flag, or a file of the project). Lineage types (grouped in catalog/PROJECT-FAMILIES.md):
#                  fork_of | copy_of | port_of | variant_of | builds_on | same_project | bundles | describes |
#                  unclear. Dependency types (network map only): mod_for (a mod or package for a loader or
#                  platform) | uses_tool (runs it, e.g. an emulator, without shipping it) | vendors (ships or ports
#                  code from it) | cites (names it as a reference for methods or data)
#
# `checked` is the date of the last update run (docs/UPDATING.md, step 4). Status values are
# taken from the authors' own wording where available.

checked: 2026-11-13

