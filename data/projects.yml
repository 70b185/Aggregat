  - id: multitone
    name: Multitone (shared multi-boot kernel design for Digitone II firmwares)
    author: w0ts
    kind: research
    devices: [digitone-2]
    repo: https://github.com/w0ts/multitone
    status: wip
    tested: not-stated
    license: "none yet (all rights reserved until the design picks one)"
    last_activity: '2026-11-22'
    notes: >
      A design, not built: a small boot kernel that could start a Digitone II firmware kept on the +Drive instead of
      the one in flash and fall back to a safe one when that fails, plus one shared rule for the extra data each custom
      firmware keeps (+Drive sector ranges, RAM ranges, machine-type numbers), its identity (number, 4-letter id,
      brand, name, version) and how projects made with another firmware are recognised. A proposed registry gives
      stock DN2 machine types 0..17 and the +Drive slot store 0x000000..0x5D7FFF, and reserves +Drive
      0x5FFE00..0x5FFFFF and RAM 0x476F8000..0x47700000 and 0x47800000..0x47FFFFFF for the kernel; address tables
      per stock version (1.12 first), switched off on others. Nothing has run on a unit or in an emulator; open
      questions Q1-Q8. One commit, 2026-11-22. Found by GitHub search 2026-11-23.
    sources: ["state/NEW.md 2026-11-23", "README, registry/firmwares.txt (2026-11-23)"]
    relations:
    - {type: cites, id: dn2-wishes, evidence: "registry/firmwares.txt: Wishes holds machine types 50..62 and its +Drive and RAM ranges in the proposal"}

  - id: play-dt
    name: PLAY+ (Digitakt mk1)
    author: JohanStache
    kind: mod
    devices: [digitakt]
    repo: https://github.com/JohanStache/play-dt
    status: beta
    tested: emulator
    tested_note: "README: checked in digiemu on the real build over a resumed OS 1.54 snapshot; not tested on a unit (read 2026-11-23)"
    base_os: "Digitakt mk1 OS 1.54; elekloader core 4.1+ and machine-pages (render event)"
    license: GPL-2.0-or-later
    version: "0.4 (2026-11-22, untagged): DRNK added as PLAY value 12"
    last_activity: '2026-11-22'
    notes: >
      Nine new values for the ONESHOT machine's PLAY knob after the stock four; in each, LOOP becomes that mode's
      control and is renamed on the SRC and LFO pages. Raises the ONESHOT descriptor's PLAY maximum (0x401ab6cc) from
      3 to 12; stock plays values above 3 as FWD, and the mod replaces the block in machine-pages' render event,
      reading the voice record at 0x8000edc4 + 94 x track. It hooks the same PLAY text site as DIGISLICER
      (0x4005f91c), so the two do not combine. 0.2 removed STOP, so patterns saved with 0.1 on VARI or later play the
      next mode. No .syx in the repo; an .elemod for elekloader. Two commits, created 2026-11-22. Found by GitHub
      search 2026-11-23.
    features:
      - "nine new ONESHOT PLAY modes: PING, VARI, STUT, SCRB, HALF, SWEL, CRWL, SKIP, DRNK"
      - "LOOP becomes each mode's control (turnaround point, drift rate, stutter note, scrub position...)"
      - "tempo-synced stutter, tape-style half speed, reverse swell, grain crawl, tape skips and a drunk walk"
    install: "add elemods/play-dt-0.4-os1.54.elemod to an elekloader build with core 4.1+ and machine-pages, from your own Digitakt_OS1.54.syx"
    sources: ["state/NEW.md 2026-11-23", "README, mod.json (2026-11-23)"]
    relations:
    - {type: mod_for, id: elekloader, evidence: 'README: an elekloader .elemod needing core 4.1+ and machine-pages'}

