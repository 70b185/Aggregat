      QEMU cut down to the Raspberry Pi 4B and the devices Sidecar's engine needs: boots the Sidecar engine image,
      answers over Ethernet, puts an Analog Rytm MKII stand-in on its USB-A side and gives its USB-C gadget a raw MIDI
      TCP port, so an OS upgrade or an elkbench run can go through the emulated Pi into analog-emu. A local experiment,
      not meant for QEMU upstream.
      2026-11-19 (README): a usb-teensy device stands in for the Teensy 4.1 relay of the Sidecar firmware (its link
      protocol and the HalfKay bootloader, with fault options for flows that failed on the unit), behind an emulated
      high-speed USB hub, so a Teensy flash through the Pi can be rehearsed in the emulator.
      2026-11-22 (README): an Analog Four MKII stand-in (usb-a4, USB id 1935:0b47, same link protocol as the Rytm
      stand-in: 256-byte blocks in for 8 channels, 200-byte blocks out for 6) makes a two-box Pi possible, with a
      gate script that boots, unplugs and replugs the Rytm and the A4 in both orders. The emulated Pi now has its SD
      card on EMMC2 as the real Pi 4. The Digitakt is not modelled.
      2026-11-23 (README): several gate runs can share one host: stubs link over unix sockets in a private folder
      and forwarded ports fall back to free ones.
      2026-11-27 (README): a Digitakt (mk1) stand-in, usb-digitakt (USB id 1935:0b2c), speaks the same link protocol with
      368-byte blocks in for 12 channels (MAIN, tracks 1-8, INPUT) and 88-byte blocks out for 2, taken from the Sidecar
      firmware's device profile table; nothing of the Digitakt's firmware is in it and no Digitakt emulator stands behind
      it (a stub plays a sine on MAIN). The two-box gate now takes any pair of Rytm, A4 and Digitakt in both attach orders
      and can check the engine's slots and per-box voice requests (Rytm 8, A4 4, Digitakt 8).
    sources: [state/NEW.md 2026-11-10, README, "README (2026-11-19)", "README (2026-11-22)", "README (2026-11-23)", "README (2026-11-27)"]
