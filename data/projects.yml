      forum post also embeds github.com/elekloader/elekloader (web app at elekloader.github.io/elekloader); forks exist
      (AvroraPolnareff, naturarum, toonst, simonjohansson); none is listed, as none has changes of its own. Forum:
      builder issue reported 2026-10-19. Licence GPL-2.0-or-later. 2026-11-10 (8daa2ea): the shop's list, forms and bots
      moved to elekloader/shop (#338); mods are submitted there. machine-pages 1.8-1.10, machines-dn1 0.5/0.6 and
      machines-dn2 0.5 add mono machines and MIDI CCs (emulator-tested per TESTS.md). The linker now refuses odd jump
      targets into mod RAM after a Digitakt II froze at boot (I61). The README offers a Windows .exe; not every release
      carries the macOS .dmg. 2026-11-10 (main): core-ar2 0.13 opens the Rytm MKII's TEST slots 44-52 to mod machines,
      adds per-voice trig and velocity getters, screen calls through stock's routines and per-mod knob ids;
      machine-pages 1.7 tagged. 2026-11-12 (main): core-a4mk2 0.6 brings core-ar2 0.10-0.13's foundations to the Analog
      Four MKII (field defaults, the modified mark, the project-save event, payloads, knob looks, screen calls) and a
      37.7 MB mods' area. Builds pick older core or helper versions by themselves when a mod patches a place a newer one
      took (Tone+FX's Digitakt files and Digi EQ 1.0c link with DT1 core 4.0 only; OB-1 0.6 with machine-pages 1.2), and
      released versions stay available while a listed mod needs them.
