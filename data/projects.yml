    version: "KYOTI V1.8 / V1.8C / V1.8BC, CLYPS (CL47c, OS VERSION CLYPS V1.0) and BLACKPYRAMIDS_303 promoted FINAL 2026-11-25; VARISPEED (VRG3), VARISPEED_EMUS, ERASE_EMPTY_TRIGLESS_LOCKS (MIDI too), BATCH_BUGFIXES and the other feature images FINAL since 2026-11-20; V1.7 kept as tag ref/kyoti-v1.7-2026-11-09"
    last_activity: "2026-11-25"
    notes: >
      Feature and fix builds keeping the stock feel: mute modes, pattern jump, sidechain compressor, varispeed,
      repitch. Tested on an MKI. Licence: MIT; distribution: patch-your-own. Listed by altstrument. 2026-11-02:
      MUTE_MODES KEYHOLD fixes octabam#934: with SIDECHAIN_COMPRESSOR a muted track that had been the KEY played again
      once KEY moved away; held tracks now keep the post-FX cut until unmuted. Confirmed on an Octatrack MKI.
      2026-11-09: RELOAD_FROM_PROJECT reloads one track's slice of the Part from the card ([BANK] + [TRACK n]) or a
      whole pattern ([PTN] + [BANK] + trig), landing on the next step while playing; a click from a copy with
      interrupts masked was fixed on the unit (I60); the REC_TRIG_MUTE fix was confirmed on hardware. 2026-11-10:
      octabam's HOOKS chain lets RELOAD_FROM_PROJECT and FREE LOOP share their UI-tick site in one image
      (emulator-checked, not flashed). 2026-11-13 (NOTES.md): BLACKPYRAMIDS_303 is being rebuilt as one packaged DSP
      engine for the Modwerk base (not flashed); its host check is bit-exact against the emulator twin.
      2026-11-14 (README, NOTES, module README): RELOAD_FROM_PROJECT takes over the landing rules of the author's
      Clyps work: a reloaded track lands one tick before the step boundary, so it is never a step late; a FULL
      reload's sound settings change only with the first trig that sounds, never on a ringing sample; trig conditions
      (1:2, PRE, FILL, also after STOP and PLAY) carry on as if the saved sequence had always played. A twelfth hook
      at the stock trig-condition reset does this. The standalone image passed every walk-through item on the author's
      MKI the same day; not yet run in an octabam-built image.
      2026-11-17 (README, NOTES, FLASHING, Clyps manual and scope): new CLYPS, a clip launcher after Ableton's Session
      view: [PTN] + [BANK] shows the active track's sequence in all 16 patterns of a bank; a trig loads one onto the
      track (with its sound when [FUNC] is held) while the others play on; originals, per-track temp saves and card
      reloads put things back. It keeps ~10 MB of sample memory and always ships with DIRECT JUMP, never beside
      RELOAD_FROM_PROJECT. KYOTI V1.8 (RELOAD + DIRECT JUMP) and V1.8C (CLYPS) replace V1.7; every image now carries
      the three bug fixes. DIRECT JUMP V7.2.2 releases tracks that SILENCE TRACKS mutes just before a jump, curing a
      pop on the unit (an earlier fix inferred in the emulator did not); V7.3 counts a jump's position and trig
      conditions from the last normal pattern change, confirmed by ear in V1.8C on 2026-11-16.
      2026-11-17 (Clyps manual): a card reload of another pattern ([PTN] + [BANK] + trig) is cued by stock's CHAIN
      AFTER setting, or lands legato when DIRECT JUMP is on; Clyps' "x" marks only an edited sequence, never an edited
      Part.
      2026-11-20 (README, NOTES, FLASHING, START_HERE, BUILD_KYOTI, blackpyramids-303 module README, BC handoff): new
      combined image KYOTI V1.8BC = V1.8C + BLACKPYRAMIDS_303 (the TB-303 voice); it gives up PLATE REV as well as
      SPRING REV (a project saved with either loads that FX2 as NONE) and keeps about 10 MB of sample memory.
      BLACKPYRAMIDS_303 now allows one voice per DSP core on every path: the machine list, TRACK PASTE, an SRC page
      paste and (in V1.8BC) Clyps loads refuse a second one with ONE 303 PER CORE!, and a UI-task check repairs any
      other way (a project saved with two keeps the lower track). Its SRC page now copies and pastes as a BLKPYRAMD; a
      muted BLKPYRAMD track starts no note in MUTE MODE DT-T. On a pattern or Part change the voice now carries over
      until the track's own first trig, ties hold across a pattern boundary, and the first note after a load gets
      its full GATE; before, the last step was lost, a pop could sound and the first note was a blip (found on the
      author's MKI in octabam test images, fixed). VARISPEED_EMUS VEM11 prices a Part switch as the overlap of old
      and new sounds: over the DSP budget it drops held notes to OT, then steps the new Part's engines down, and a
      held VARI note keeps its speed until its own next trig (it changed about 145 ms early before). Open: once,
      after pasting a BLKPYRAMD track into another Part's pattern, the sequencer did not advance on PLAY (not
      reproduced); loading a project with two voices on a core not tried on the unit.
      2026-11-21 (NOTES, FLASHING, README, START_HERE, BUILD_KYOTI, octabam module READMEs): release candidates
      RC1-RC3 bundle three changes. VARISPEED now enters VARI at QUAN 1/1 unless the track left VARI with another
      QUAN, remembers that across a save and keeps a held VARI note's speed through a Part switch; its state moved
      out of the NEIGHBOR bytes it had shared with BLACKPYRAMIDS_303 into four Part bytes stock never edits, and older
      projects migrate on load. EMPTY_PATTERN_LED_FIX also lights [BANK] for trigless locks that carry a locked value
      (318 B, +0.3-0.5 % CPU with [BANK] held). ERASE_EMPTY_TRIGLESS_LOCKS now covers MIDI tracks (I173). Two
      BLACKPYRAMIDS_303 bugs found on the MKI: a 303 chosen on a FLEX track was silent (I172, fixed in RC2) and a
      track leaving the 303 played a burst of its FLEX sample (I174, fixed in RC3, not flashed). On 2026-11-20
      VARISPEED, VARISPEED_EMUS, ERASE, BATCH_BUGFIXES and the other feature images were promoted FINAL; KYOTI
      V1.8 / V1.8C / V1.8BC, BLACKPYRAMIDS_303 and CLYPS wait for RC3, and their builders refuse without the WIP
      opt-in until then. Pin pull requests for octabam's three modules are open (octabam#1200-1202).
      2026-11-25: the Clyps manual follows CL47/CL47b/c (ORIG PTN+PRT renamed ORIG PTN; pattern view acts on the bank
      shown and opens on the playing bank; each pattern keeps its own box per track; a card reload of a pattern in
      another bank is cued like a bank change). Docs only, no new release.
      2026-11-26 (NOTES, README, FLASHING, START_HERE, BUILD_KYOTI, CLYPS_SCOPE): CLYPS (CL47c), BLACKPYRAMIDS_303 and
      KYOTI V1.8 / V1.8C / V1.8BC were promoted FINAL on 2026-11-25 after a V1.8BC test image passed every test on the
      author's MKI; the V1.8BC final is that image byte for byte, the others carry the same code but were not flashed
      as such. Clyps changes since CL38: a cued pattern change blinks its slot until it lands, [PTN] and the card
      reload act on the bank shown, the view no longer jumps to a landing, and the aiming arrows hide once something
      lands on them. Test images found two faults: draws from the UI tick task left garbage on the screen (I223)
      and a failed card read blocked every later card reload until a reboot (I224, emulator); both fixed. The
      finals keep 12 sample-memory pages (V1.8), 1,711 (V1.8C), 1,710 (CLYPS) and 1,723 (V1.8BC). A BLKPYRAMD tie
      across a Part switch between two different tracks is cut at the change (not a regression; not scheduled).
    features:
      - "mute modes, incl. Digitakt-style with ringing tails"
      - "direct pattern jump, locked to the clock, trig conditions kept"
      - "CLYPS: launch any pattern's track sequence onto one track, alone or with its sound, Ableton-style"
      - "reload a track, its sound or a pattern from the project on the card"
      - "BLACKPYRAMIDS_303: a TB-303 voice as a track machine on the DSP, one per core"
      - "sidechain compressor with key listen; varispeed and repitch"
      - "three stock bug fixes in every image"
