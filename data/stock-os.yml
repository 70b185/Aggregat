# Stock OS register: Elektron's own OS files, how to recognise them, and which projects use which version.
# Source file: edit this, then run scripts/rebuild.py (it writes hardware/STOCK-OS.md). Metadata only: names, hashes,
# dates. Never commit the files themselves.
#
# releases: one entry per OS file. sha256 = SHA-256 of the .syx as the projects named in `sources` publish it.
#   pinned_by: catalogued projects whose repository holds this exact value, found by searching every reachable
#   catalogued repo on `pinned_checked` (vendored copies count; a project can pin a file it only uses as a donor).
#   other_sha256 / other_note: a different value seen for the same file name, not resolved.
#   released: the date Elektron's release notes show the version (only where we read it), with released_note.
# support: for devices that got a new OS while mods existed (the three of 2026-10-01), every project that needs a
#   particular file. use: patch (builds firmware from it) | donor (takes parts of it for another device) | analysis
#   (emulator, research) | runs-on (the unit must run it; nothing patched). os: versions accepted now, newest first.
#   ported: when the project first supported the newest OS, if it existed before (evidence: the commit).
