      workflow for module authors: offline rig renders with WAV/JSON compare, per-block profiles, Workbench sessions
      (a private emulator card plus captures). The debug module gained opt-in observers for the firmware's view stack
      (DT2 1.17, DN2 1.12) and for live parameter words (DT2 1.17 only). A stock-Delay reference case ran on the
      emulator and on a physical DT2 (OS 1.17, runtime 0.13.2 development image with the debug module): echo spacing
      64.05 ms emulated against 62.49 ms on the unit, decay per repeat within 0.0011 dB. FREQ SHIFT gained SPREAD,
      DRIFT, RATE and FDBK (rig and emulator only).
      2026-11-27 (new finding 131, findings 07/19/71, TESTING, MODULE-AUTHORING, ports/fw README, new dkglyph tool and
      glyph STYLE.md): finding 131 maps the Digitone II 1.12 MACHINE SEL rows (groups, dividers, keys) and a stock cursor
      fault after a SYN/FLTR page change (SB43). A settings page can now be built from a table of fields using the stock
      choice popup, and SETTINGS rows appear and go after a live load or unload without a project change. A service with a
      hook in interrupt context (lfo) is refused a live reload and needs a restart, after an lfo reload's unload step
      never returned on the Digitone II (cause not found). The Rust emulator now delivers forced interrupts by default.
      New glyph tool for 1-bit icons and animated value glyphs, with the stock screen measures written down; not yet drawn
      on a device.
      2026-11-28 (new lfo-table, Ascend and Project manager READMEs, module-distribution plan, services/lfo, ports/fw,
      device files, design notes dkm and project, MODULE-AUTHORING, INSTRUMENTATION): runtime 0.13.6. A new platform
      module core/lfo-table is in every DT2 and DN2 patch set and adds LFO waves 7-14 by copying the four 7-entry wave
      tables and repointing their lea operands; the lfo service no longer hooks the LFO interrupt and fills the table
      from the UI task under the interrupt mask, after the 2026-11-27 reload hang. Modules can publish typed settings
      and answer read-only queries from a Workbench page (149 B request, 870 B reply, one at a time). A new .dkm
      header tag (PAYLOADS) is refused by older runtimes. New LIFECYCLE and STATE_CARRIED log events show where a
      boot, load or reload hangs. The distribution plan keeps firmware patching in the browser and installs only built
      module files. All host or emulator only.
