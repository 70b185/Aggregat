    author: nrdsrfr
    kind: tool
    list: musician
    devices: [syntakt]
    repo: https://github.com/nrdsrfr/synpat
    status: wip
    tested: "unit"
    tested_note: "README: tested against one Syntakt on OS 1.42: slot list and project reads (byte-identical to Transfer's backup), writes into an empty slot incl. a multi-chunk write with verified read-back, the queue end to end with the written project playing on the unit; 0x0C to 0x0A conversion not checked on a device (read 2026-11-24); a blank project (version 0x0D) written to empty slot 125 read back identical and loads empty on the unit (README 2026-11-25)"
    license: "MIT"
    last_activity: '2026-11-25'
    notes: >
      Unofficial tool that copies patterns (with their kits) between Syntakt projects, including across project
      format versions, and backs up and loads projects over USB MIDI. A Python codec for the .stprj project file
      (container, LZ4 blocks, layout) with a command line (info, verify round trip, copy) and a local web GUI that talks
      to the unit through WebMIDI and Elektron's RPC; runs in Docker. No README and no licence file; four commits on
      2026-11-22 by the author, who also publishes the synfact release copy. Changes no firmware. Found by GitHub
      search 2026-11-23.
      2026-11-24 (README and LICENSE added): copies patterns with their kits between Syntakt project backups
      (.stprj) or projects read from the unit over USB MIDI, queues many copies into one destination and writes the
      result as a new file or into an empty slot only (checked again before writing, confirmed, verified by read-
      back); never overwrites or deletes on the unit or on disk. Browser GUI from a small local Python server with
      Web MIDI (Chrome or Edge), plus a command line; project versions 0x0A, 0x0C and 0x0D (0x08 refused). Not
      affiliated with Elektron.
      2026-11-25: can start a new blank project in an empty slot (built from an embedded blank image; only version and
      firmware ID taken from a user project). Writes only to empty slots, checked again before writing and verified by
      read-back; never overwrites or deletes (a permanent rule). Target: macOS with Chrome (Edge works). Audition
      selects a pattern by Program Change (needs PRG CH RECEIVE on). New DESIGN.md and PRODUCT.md.
    features:
      - "copy a pattern and its kit from one Syntakt project into another, also across project versions"
      - "queue copies from several projects into one destination"
      - "back up and load projects over USB MIDI from a local web page"
      - "new blank project for an empty slot; writes only to empty slots, verified by read-back"
