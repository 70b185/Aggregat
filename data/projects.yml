  - id: a4mk1-arplocks
    name: a4mk1-arplocks (ARP page p-locks)
    author: ClaidArremer
    kind: mod
    devices: [analog-four-keys]
    repo: https://github.com/ClaidArremer/a4mk1-arplocks
    license: "MIT"
    status: wip
    tested: unit
    tested_note: "README: hardware-verified on an Analog Four MK1, OS 1.56 (read 2026-11-16)"
    base_os: "Analog Four MK1 OS 1.56 only (not MKII or Analog Keys)"
    version: "mod 0015-arp-locks (main, 2026-11-16: SLD switch dropped, MPE switch only)"
    last_activity: "2026-11-16"
    notes: >
      A mod (id 0015-arp-locks) for hugz202's A4 MK1 build framework: the user builds a patched OS from their own
      stock 1.56 file; no Elektron files are shipped. ARP values go into the free lock slots 101-108 of each step, which
      the pattern already saves; the arpeggiator reads a per-track copy with the locked values. Two switches on the ARP
      page's empty knobs, saved with the kit: SLD (303 slide for 0002-slide-303) and MPE on/off for a4mk1-mpe. Cannot
      share an image with 0007, 0008, 0010 or 0012 (code space and hook points). Found by GitHub search 2026-11-16.
      2026-11-17: the SLD (303 slide) switch was dropped on 2026-11-16; knob J stays as the MPE on/off switch, drawn
      like LEGATO's, off by default, and works only with 0013-mpe built with kit_switch=1. Code placement moved; re-run
      pack.py for other mod sets. The README does not say whether this build was tried on a unit.
    features:
      - "parameter-lock every ARP page control per trig (mode, speed, range, note length, legato, notes 2-4)"
      - "locked ARP values saved with the pattern and cleared the stock way"
      - "MPE on/off switch per kit on the ARP page (knob J), off by default"
    sources: [state/NEW.md 2026-11-16, "README (2026-11-16)", "README and registry (2026-11-17)"]
    relations:
    - {type: mod_for, id: a4-mk1-mods, evidence: 'README: a mod for hugz202''s AE-analog-four-mods build framework (mod id 0015-arp-locks)'}

  - id: a4mk1-mpe
    name: a4mk1-mpe (MPE for the Analog Four MK1)
    author: ClaidArremer
    kind: mod
    devices: [analog-four-keys]
    repo: https://github.com/ClaidArremer/a4mk1-mpe
    license: "MIT"
    status: wip
    tested: unit
    tested_note: "README: hardware-verified on an Analog Four MK1, OS 1.56, with a ROLI Seaboard RISE (read 2026-11-16)"
    base_os: "Analog Four MK1 OS 1.56 only (not MKII or Analog Keys)"
    version: "mod 0013-mpe (main, 2026-11-16: optional kit switch)"
    last_activity: "2026-11-16"
    notes: >
      A mod (id 0013-mpe) for hugz202's A4 MK1 build framework that adds MPE to poly mode: Lower Zone with channel 1 as
      manager and channels 2-5 as the four voices, member bend range 48 semitones. Live only while poly mode is on and
      the active track is a poly voice; otherwise everything is stock. Cannot share an image with 0010-wave-osc or
      0012-res-limit. The kit's MPE switch sits on a4mk1-arplocks' ARP page. Found by GitHub search 2026-11-16.
      2026-11-17: the kit switch is now a build parameter (kit_switch, default 0 = MPE always available); with 1 MPE
      follows byte 52 of the FX track's spare storage, off by default (it was on by default before). The example build
      no longer includes 0002-slide-303.
    features:
      - "MPE Lower Zone on the four poly voices (channels 2-5, manager on 1)"
      - "strike, per-note bend, slide (CC74) and pressure routed through the stock modulation menus"
      - "MPE configuration message sets the member count; 0 turns MPE off"
      - "optional per-kit MPE on/off switch (with a4mk1-arplocks)"
    sources: [state/NEW.md 2026-11-16, "README (2026-11-16)", "README and mod.toml (2026-11-17)"]
    relations:
