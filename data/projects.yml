      2026-11-12 (findings 121-125): DT2 1.17 project/kit storage and UI sites for mods, USB mode take-over, +Drive
      fast close and measured throughput ceilings, the SHARC cycle counter; a read-only eMMC diagnostic test module
      (card-info); module kind service renamed tool, new module entry point dk_module. No tag yet.
      2026-11-13 (finding 126, finding 123 update, MODULE-AUTHORING): runtime 0.6.0 drops the old module contract
      (dkm_init, the Api table and slots): every module uses dk_module and named imports, and a .dkm built for the old
      contract is refused (E_CONTRACT), so modules must be rebuilt. New core adapter sdhc-large lets the stock card
      driver move up to 511 KiB per command instead of 64 KiB for buffers the runtime registers; measured upload speed
      levers on a DN2 (8 MB in about 1.9-2.2 s with all on, 3.0 s off) and none on the DT2; the USB take-over is off by
      default after a second failure on a unit (I80).
      2026-11-10 (findings 118-119, 56fbc11): finding 119 reads a track's Sound parameter words through anchored functions (folded into devices/digitakt-2.md); new modules Overdrive curves and TB303; a public site (https://eleklabs.github.io/digikit/) patches the stock .syx in the browser, flashes over USB and installs modules; the README still does not call the bootstrap-menu recovery tested.
