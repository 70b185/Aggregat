  - id: dn2-wishes
    name: DN2 WISHES
    author: w0ts
    kind: mod
    devices: [digitone-2]
    repo: https://github.com/w0ts/dn2-wishes
    status: wip
    tested: partly
    tested_note: "CHANGELOG: test build v0.69.2-fdn8lite was installed on the author's unit on 2026-11-22 and its bus FDN8 cost measured on the system meter (about 17.8-18.4k cycles a block per playing FDN8, four at once); v0.69.2-fdn8lite2 passed only the brick-guard checks, not the full release check, and is not installed; every build must pass the ship gate (emulators of both processors) before a flash (read 2026-11-23)"
    base_os: "Digitone II OS 1.12; the builder also reads the user's Digitakt II DSP section, Machinedrum UW OS 1.63 and Monomachine OS 1.32B files"
    license: AGPL-3.0
    version: "0.69.2 (2026-11-22; upstream dn2mk2 v0.68/v0.69 merged, PERFORM); test builds v0.69.2-dualboot (SAFE MODE with the stock sound), -fdn8hw (FDN8 on the DSP's hardware loops) and -all (both, 2026-11-22, not installed); untagged own releases"
    last_activity: '2026-11-22'
    notes: >
      A Digitone II OS 1.12 firmware built on the dn2mk2 mod (a GitHub fork of De-Pattern's dn2mk2-firmware with about
      300 commits of its own since it branched; the history also carries upstream's and dn2-firmware-explore's). Its
      own machines are types 50-56 in MACHINE SEL: JUNO (a Juno-106 voice), ANALOG (two oscillators, five filter
      models), DRONE, SOPHIE, TB-303 (Open303), PLAITS and DRUM; paraphonic mode on ANALOG and JUNO; insert effects
      (FUZZ, TAPE, FOLD, CHOR, WIDE, HARM, FDN8, XDLY, SUB, DIST, GATER, RING, JUNO); a modulation matrix; a voice
      budget that takes an old note's voice before the DSP runs out of time. The machines ported from the Monomachine,
      Machinedrum and Digitakt II come from dn2mk2. A browser builder makes the image from the user's own Elektron
      files and flashes it over USB; a build may be flashed only after the ship gate prints CLEARED TO FLASH
      (bootstrap and updater stock byte for byte, both processors emulated, stock audio compared bit for bit).
      Proposes the Multitone shared multi-boot rule (multitone). Found as a new repo of a catalogued author 2026-11-23.
      2026-11-24 (CHANGELOG): three test builds, none installed on a unit: v0.69.2-dualboot keeps a copy of stock
      1.12's DSP program on the +Drive (sent once over USB, checked sector by sector) so SAFE MODE can play with the
      stock sound; v0.69.2-fdn8hw runs FDN8's loops as the DSP's hardware loops (about 4 % less per bus FDN8 in the
      emulator, bit-identical sound); v0.69.2-all combines both, gives each DT2 sample machine its own icon and
      counts the notes, voices and inserts the guard left out. Offered as a hidden TEST entry on the builder.
    features:
      - "seven own machines: JUNO, ANALOG, DRONE, SOPHIE, TB-303, PLAITS and DRUM"
      - "paraphonic mode on ANALOG and JUNO: a chord through one filter"
      - "13 insert effects per track, among them a FDN8 reverb, tape, fold, ring and gater"
      - "a modulation matrix and a voice budget against DSP overload"
      - "all dn2mk2 machines (Monomachine, Machinedrum, Digitakt II ports) on OS 1.12"
      - "browser builder that builds from your own files and flashes over USB"
    install: "the project's web builder: give it your own Digitone II OS 1.12 file (and the other Elektron files it asks for); it builds and flashes over USB"
    sources: ["state/NEW.md 2026-11-23", "README, CHANGELOG, VERSION, LICENSE, about page source (2026-11-23)", "CHANGELOG, README (2026-11-24)"]
