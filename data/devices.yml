# Device catalogue. Focus phase 1: the small boxes (Digitakt, Digitone, Syntakt, Analog Heat),
# including their MKII / second-generation versions.
# phase 2 (catalogue): Octatrack, Analog Four/Rytm/Keys, Model:Cycles/Samples, Machinedrum, Monomachine.
# Scope: every Elektron device that custom firmware or mods are written for. Add a device here as soon as the
# first such project appears (Tonverk: none yet, only research notes and requests).

# recovery: has the stock-OS recovery path been used on a real unit? proven (two or more reports, or one project
# using it routinely) | reported (one report) | documented (described, never reported used) | unknown. Source: the
# G1 row of research/RESEARCH-MAP.md; keep both in step. The website's mod finder shows it next to every mod.
devices:
  - slug: digitakt
    name: Digitakt (MKI)
    recovery: proven            # proven | reported | documented | unknown
    recovery_note: Startup-menu recovery used on a unit (RESEARCH-MAP G1, 2026-11-11).
    family: Digitakt
    phase: 1
  - slug: digitakt-2
    name: Digitakt II
    recovery: reported            # proven | reported | documented | unknown
    recovery_note: One recovery report on a unit, OS 1.16; a second on 1.17 is still wanted (G1, task T1).
    family: Digitakt
    phase: 1
  - slug: digitone
    name: Digitone (MKI) / Digitone Keys
    recovery: reported            # proven | reported | documented | unknown
    recovery_note: One recovery report on a unit, OS 1.44 (digitone-arp-mod; G1).
    family: Digitone
    phase: 1
  - slug: digitone-2
    name: Digitone II
    recovery: proven            # proven | reported | documented | unknown
    recovery_note: Recovery over DIN MIDI used by several projects on units (dn2-cfw, Overtone, dn2mk2; G1).
    family: Digitone
    phase: 1
  - slug: syntakt
    name: Syntakt
    recovery: documented            # proven | reported | documented | unknown
    recovery_note: Recovery documented by SyntHack; no report of it being used (G1).
    family: Syntakt
    phase: 1
  - slug: analog-heat
    name: Analog Heat (MKI, MKII, +FX)
    recovery: documented            # proven | reported | documented | unknown
    recovery_note: Official recovery for the Heat +FX documented by Elektron; no community report (G1).
    family: Analog Heat
    phase: 1
    note: >
      No community firmware mod found yet (2026-10-31). Generic tooling covers it: elektron-firmware-tool
      (firmware container), Elektroid (sample/SysEx manager) and Overwitch (Overbridge audio on Linux)
      list Analog Heat MKI/MKII/+FX. screendump names it as 'not implemented'. Neither the Lapin list
      nor altstrument.org has a firmware entry for it. Last official OS we saw on elektron.se: Analog Heat MKI/MKII OS 1.22
      (2024-10-16); the +FX has its own OS (release notes last updated 2024-10-16) and MKII firmware
      is not interchangeable with +FX.
  - slug: octatrack
    name: Octatrack (MKI, MKII)
    recovery: proven            # proven | reported | documented | unknown
    recovery_note: Recovery used on a unit (G1).
    family: Octatrack
    phase: 2
    note: >
      Phase 2: catalogue imported from altstrument on 2026-11-01 (metadata only); no hardware notes yet.

