    - {name: "Track manager", path: "modules/tool/digikit/track-manager", tested: "emulator", note: "2026-11-21: host tests only; the device test on DT2 and DN2 is pending; 2026-11-22: its device test runs in the emulator on DT2 and DN2 (name saved and kept over a restart; device-test ledger)", what: "Names the tracks in a SETTINGS screen and shows the active track's name while TRK + YES is held"}
    - {name: "Ascend", path: "modules/fx/digikit/ascend", devices: [digitakt-2, digitone-2], tested: "not-stated", note: "added 2026-11-28; no test status stated, no unit run", what: "Barber-pole phaser send effect whose notches keep rising or falling: RATE, DIR (down or up), DENS, DEPTH and MIX"}
