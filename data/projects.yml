  - id: dn2mk2
    name: DN2 mk2 Mod (dn2mk2-firmware)
    author: "De-Pattern (README says: built on the upstream project by Angel Linares / xrcstrecords - not verified by us)"
    kind: mod
    devices: [digitone-2]
    repo: https://github.com/De-Pattern/dn2mk2-firmware
    links:
      patcher_web: https://de-pattern.github.io/dn2mk2/patcher.html
      import_tool_web: https://de-pattern.github.io/dn2mk2/
      version_history: https://github.com/De-Pattern/dn2mk2-firmware/blob/main/FIRMWARE.md
      safety_doc: https://github.com/De-Pattern/dn2mk2-firmware/blob/main/docs/SAFETY.md
    status: wip
    base_os: "Digitone II stock OS 1.11 ONLY (1.10 must update to 1.11 first; 1.12+ must go back to 1.11). Also needs the user's own Digitakt II OS 1.17 (or 1.16), Machinedrum UW OS 1.63 and Monomachine SFX-6 OS 1.32B files"
    version: "v0.33 (STEADY) per FIRMWARE.md; the web patcher page still mentions v0.27-v0.29"
    last_activity: null
    notes: >
      Adds Digitakt II sample machines (ONESHOT, WERP, STRETCH, REPITCH, GRID, SLICE) with sample browser and
      recorder, PERC (34 Machinedrum machines incl. TRX, EFM, GND, P-I), Monomachine voices (SID 6581, DPRO WAVE/DDRW/DENS,
      VO-6) and a CPU guard. Browser-based patcher builds from the user's own files ("nothing is uploaded") and saves only
      if the output sha256 matches a build that passed scripts/ship_gate.py. Hardware: README says verification is pending per
      version; FIRMWARE.md says nearly every v0.21-v0.33 entry was checked in emulators and "not seen on hardware yet".
      Main open problem: DSP time (heavy voices cut sound). Flashing a 1.12 unit takes it back to a 1.11 base, projects
      saved under the newer OS may not open. 1,491 commits, 8 stars, AGPL-3.0-or-later. FIRMWARE.md says built firmware
      is kept on the repo's `builds` branch (not main) - unlike most projects here, which only ship patchers; we link
      only to the repo and docs, not to builds. Withdrawn builds: v0.4-v0.7 (oversized image).
    sources: [GitHub README, FIRMWARE.md, patcher web page]

