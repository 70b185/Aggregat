    notes: >
      2026-11-12: the Octatrack card firmware builder is retired: modules reach an Octatrack only through the Modwerk
      base, over USB or as one set file (MODWERK0.SET) on the card; Tuner, Stem Rec and Temp Save paused until they
      have base versions; Spectrum, Modulation, Character and MIDI Scenes removed for good; CPU-rendered machines get a
      budget (CPU FULL) after FM Synth froze an MKII (I79); POLY8 and FM Synth carry a Heavy CPU badge; checks refuse
      writes into the stock DELAY table and odd jump targets; the DT2 base hides the raw +Drive block write from
      modules; Octatrack modules moved to sdk/octatrack/modules; new experimental Crossfader and Live Looper for the
      Digitakt I (OS 1.54) and Amiga, a tracker-style sample machine, for the Octatrack.
      2026-11-11/12: the Octatrack base and USB installs are open to everyone (first install still from the card, at
      most 20 modules per set; Tuner, Stem Rec and Temp Save card-only); USB Audio is off unless the set has the USB Audio
      module; skipping modules at boot moved from FUNC to holding PROJ at power-on (MKI keeps FUNC); the octabam pin is
      frozen (Modwerk follows only elekloader upstream); Analog BD 0.1.7 has a new 909 model; base-update and SYNTIZ
      incidents I75 and I76.
      2026-11-09/10: Octatrack beta: the silence after USB DISK MODE (finding 72) was the base mistaking stock's DSP
      pause for a stall, fixed (I69); FM Synth with many FLEX tracks no longer loses the audio on PLAY; the Octatrack
      page asks for a power cycle when the DSP has stopped; Temp Save 0.1.0 withdrawn from USB installs (card build
      stays). Modwerk also loads effects onto Zoom MultiStomp pedals now (ZDL files over USB; not an Elektron device).
