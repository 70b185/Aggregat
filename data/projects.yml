    notes: >
      Native Rust emulator that runs the ColdFire and SHARC+ firmware together, with front panel, display and audio,
      plus a web panel (WASM core), a Tauri desktop app, the patch toolchain "patchkit" (applies modules to the user's
      own .syx), a headless scenario runner with pinned PCM hashes, a control socket for patch injection and
      DSP/ColdFire analysis databases with Ghidra tooling. README caveats: the DSP "does not run in real time yet", the
      browser host is parked on branch wip/browser-host, "no patched firmware has been installed on a device", and
      recovery via the bootstrap menu is "not tested on hardware". patchkit refuses to change sections 2, 4 and 8.
      2026-11-12 (b657f37, via altstrument): a USB take-over for fast sample transfer in the workbench with a read-back
      hash check per file, a diagnostic module that reads card information, a restructured SDK, fixes to the card image
      and the patch kit on Windows. 982 commits, AGPL-3.0-or-later with extra section-7 terms (attribution, origin,
      names) in NOTICE; page shows 46 open issues. GitHub marks it as not a fork. The org ElekLabs has 2 public repos:
      digikit and a fork of js216/selache. Original author: the GitHub profile m-dwyer is named "Em D" (Melbourne),
      which is exactly the credit ElekLabs' NOTICE requires ("digikit by Em D"); Overtone credits digikit to "Em D" as
      well. The earlier repo m-dwyer/digikit (196 commits, 4 stars, GPL-2.0-or-later, README at the time: "no audio",
      last visible file HANDOVER-2026-09-16) shows no move/archive notice and does not mention ElekLabs. ElekLabs has no
      public members, so the pages themselves do not show who runs it; the maintainer (user of this repo) states that Em
      D develops in ElekLabs/digikit (2026-10-31, not verifiable on the pages). The licence changed from
      GPL-2.0-or-later to AGPL-3.0-or-later with extra terms. Treat both repos as one project line, ElekLabs/digikit
      being the current one. Mod READMEs that say "digikit's emulator" mean this project.
      2026-11-14 (finding 123 rewritten, findings 128-129, docs/MODULES.md, docs/ADDRMAP.md): the USB take-over is
      deleted (its commands answer E_STATE); core/usb-bulk-audio adds a vendor bulk OUT interface to the USB
      AUDIO/MIDI configuration at boot, so there is no mode switch (a probe sent 200 MB at 28 MB/s while audio played;
      real uploads 3.38 MB/s on a DN2, 2.74 MB/s on a DT2). Runtime 0.7.0: modules declare machines and effects with
      builder calls and the runtime commits them at once or refuses; a module of another major.minor is refused
      (E_CONTRACT); the patched-in content macros are gone. An address map names code addresses in crash records and
      profiles; the debug module can keep a card log that survives a crash. Finding 128 (static): the SHARC hook sites
      cannot move into run-time services, because the ColdFire uploads the whole DSP image before the card is
      readable.
      2026-11-15 (MODULE-AUTHORING, design/module-sdk, handover): modules no longer declare their DSP cycles;
      module:check measures the worst steady block and stores a per-voice or per-effect DSP cost in the package, and
      one shared rule (largest voice cost x voices + effect costs within the headroom) now runs in the boot planner,
      the menu, patchkit fit and the web Transfer tab, which refuses a selection over the limit ('DSP LOAD need >
      free'). Modules built for the old descriptor must be rebuilt. Runtime limits now listed: 512 KiB arena, 64 KiB
      per module, 8 machine rows, 3 FX slots, DSP area 512 KiB (DT2) / 320 KiB (DN2). The SDK sample kernel has since
      landed (2026-11-16): the Shot machine fell from about 5,000 to about 2,450 (DT2) / 2,660 (DN2) emulator
      instructions a block, bit-identical.
      2026-11-16 (findings 130 and 132, sdk/dsp/REGISTERS.md, handovers; runtime 0.8.2, untagged): one generated DSP
      register contract for module code (clobber, keep, stack, never_write), checked by patchkit build but only as a
      warning so far; the fx, machines, samples and lfo services are separate crates, the step before loadable services;
      module DSP tests moved to a SHARC-only rig (about 45 s instead of about 21 min). Finding 103 was partly withdrawn:
      several values reported as measured on silicon came from probe instructions the old assembler had mis-encoded (see
      digitakt-2-dsp-optimizing.md). No new unit run in this period.
      2026-11-17 (findings 133-135, plans usb-fast-batch, runtime-slimming, r12-8-sharc-stubs, digikit-hot-reload,
      handovers; runtime 0.8.3, untagged): a Fast USB speed round ran on a DN2 (OS 1.12) and a DT2 (OS 1.17) on
      2026-11-16 with every file hash-checked: one store-table commit for up to 16 files, copy/write overlap and
      fewer +Drive steps per file took a sample pack from 2.42 to 3.56 MB/s (DN2) and 2.32 to 3.07 MB/s (DT2) and a
      9.8 MB file to 4.37 / 4.13 MB/s; a cached USB receive was slower and was dropped. Finding 133 (static): the card
      takes one transfer at a time under global mutexes, so parallel writers cannot help. Services become separate
      .dks files bound to the user's own firmware at install (patchkit bind; bound files hold firmware bytes and are
      never committed): lfo.dks is merged, Transfer installs the services a module needs (both emulator-tested),
      fx.dks and machines.dks are on a branch. Hot reload is an active plan again (finding 135, static firmware facts), not built. Facts in
      devices/digitakt-2.md.
      2026-11-18 (findings 136-141, devices/syntakt.toml, plan syntakt.md): Syntakt OS 1.42 support in the emulator
      only. The emulator runs MAIN and the second ColdFire (section 7) in lock step, with digital audio (analog tracks
      silent); patchkit builds a no-seal 1.42 image that changes only section 3 and refuses sections 1, 2, 4, 6, 7 and
      8; the runtime, menu, health and input adapters boot on the emulated 1.42 and load the debug module over
      emulated USB MIDI. Nothing has been flashed to a Syntakt. The DT2 and DN2 device files gained [protect] windows
      (hardware blocks a content module may not address; the packer refuses such a module) and [container] roles; the
      bulk OUT interface (core/usb-bulk-audio) is now in the default device image of both.
      2026-11-18 (docs/PATCHING, MODULES, ARCHITECTURE, plans runtime-and-services and r12-8-sharc-stubs, port files):
      machines and effects are run-time modules only; patchkit now refuses a patch-time machine or effect row. The
      services machines.dks and fx.dks have landed: unbound files hold no firmware bytes, `patchkit bind` makes the
      stock tails from the user's own firmware, and Transfer installs the services a module needs (emulator example on
      DN2 1.12: machines.dks 29,718 bytes). The SHARC hook sites now jump through 16 slot words that a service fills
      (4 used). core/usb-bulk-audio (Fast USB beside USB audio) moved from a separate patch set into the default
      `device` and `device-introblank` sets on both devices. `patchkit pack` refuses a content module whose code or
      data holds an address inside a device's protected windows (flash controller, FPGA, peer buses). The DN2 OS 1.11
      port file grew from 277 to 358 anchors (1.12: 359), adding the USB, card-driver, DSP voice and link anchors. No
      new unit run in these files.
      2026-11-18 (findings 147-149, handover 2026-11-18, plans extension-model and port-file, MODULES, LFO module docs):
      runtime 0.9.0 refuses modules built for an older minor runtime version and duplicate keys in a boot selection; a
      new module kind lfo-shape (template and a first module, lfo_shapes_1, with seven 32-sample shapes; the service
      holds up to eight, as wave numbers 7 and up) and a core/lfo image adapter in every DT2 and DN2 patch set; content
      modules reload without a boot (refused while the transport plays); one port file per device and firmware, picked
      by the firmware hash, is planned. Findings 147-149 read the play state, the filter type and the LFO paths
      statically on DT2 1.17 and DN2 1.12. All emulator or static; no new unit run. An open risk the plan lists: after
      the last SysEx block the workbench flash flow can report done while the unit still writes flash.
      2026-11-20 (finding 150 new, findings 110 and 148 updated, device files, plans and design digikit-project,
      extension-model, INSTRUMENTATION): the module file limit (upload stage buffer) doubles to 128 KiB on DT2, DN2
      and Syntakt. Finding 150 reads the stock machine and filter type setters and the KitActive wrapper the machine
      chooser calls; finding 110 adds checked hook sites for a planned project service (slot setter, save, save exit)
      and what each stock project path (new, delete, clear, paste, format, load, rename) does; finding 148 traces the
      SHARC filter dispatch (two jump tables bounded at 7). The planned project service keeps per-project digikit data
      in projects/<slot>-<name>.dkp files, written after a successful stock save and archived, never deleted, when a
      slot changes hands. A calibration fit turns emulator instruction counts into device cycles from paired
      profiles. All static or emulator; no new unit run.
      2026-11-21 (findings 151-157, plans card-write-guard, track-manager, usb-winusb, syntakt "Hardware bring-up",
      PATCHING "Flashing a Syntakt"): Syntakt hardware sets. The patched 1.42 image was 32 KB over the 2 MiB upgrade
      limit, so a core adapter (peer-image) stores the second CPU's section 7 packed and unpacks and hash-checks it in
      MAIN before it is streamed; a `device-peer` image with only that adapter and the full `device` set boot on the
      maintainer's unit. The first full image hung at the logo because the Syntakt bootstrap stages MAIN at 0x40200000
      (DT2/DN2 0x40400000) and its in-place unpack overran (I183); patchkit now keeps an 8 KiB margin and refuses less.
      DIGIKIT > MODULES froze the unit because core/ui used Digitakt II key ids (I181); the first store lay beyond the
      unit's 1.82 GiB card (I182) and is now fixed at 1-1.5 GiB, checked against the driver's capacity. A new adapter
      card-guard hooks the firmware's eMMC write and erase and refuses requests outside each writer's sectors (on for the
      Syntakt, emulator-tested), against a stock Data API write that trusts the host's size (SB35). Also: a key-event
      hook site and the stock View and NameView classes (finding 155) with a planned shortcuts service and a track-manager
      tool module (host tests only); a WinUSB descriptor hook for the Fast USB interface (built, not yet tested on
      Windows or a unit); a DN2 unit calibration showing device/emulator SHARC cost factors from 1.01 (ALU) to 2.69
      (memory). The public site still does not offer the Syntakt.
      2026-11-22 (finding 158, FINDINGS, plans runtime-contract-and-lifecycle and ledgers/device-test-inventory,
      PATCHING, TESTING, AGENTS): the repository was reorganised (runtime/, services/, image-modules/, ports/;
      content modules under modules/<kind>/<author>/<name>) and checked byte for byte with a manifest tool. Finding
      158, a static survey on DT2 1.17 and DN2 1.12 read once, says the ColdFire main OS runs from writable DDR, so
      almost every hook site and firmware table could be installed by the runtime at load instead of being flashed;
      the firmware has no indirect-call dispatcher to reuse; on the SHARC no load-time path exists, so 30 voice and
      effect sites stay flashed. A new plan (one package lifecycle for modules and services) follows from it. A new
      size gate measured the stored container against the 2,096,640-byte cap: DT2 1.17 1,616,928 B, DN2 1.12
      2,028,608 B, Syntakt 1.42 2,102,528 B (5,888 B over; the first planned fix loads the DIGIKIT menu from the
      card). An inventory lists 105 device-test files that run on emulated units; a smoke set of 8 runs on each of
      DT2 and DN2. No new unit run.
      2026-11-23 (finding 159 new, FINDINGS, plans resident-core-and-system-package, rc2s-1-boundary-inventory,
      rc3-header-table-v4, observability, runtime-contract-and-lifecycle, device files, ARCHITECTURE, TESTING):
      finding 159 (static) says the Syntakt image size is bound by the bootstrap's in-place unpack, so the stored
      literal tail of MAIN is padding, not waste, and no packer setting can beat it. The planned fix splits the
      runtime into a flashed resident core (about 108 KB) and a system package (about 167 KB) loaded from the
      card, with a new core-only level. The lfo service now installs its hooks at load; core/lfo left the DT2 and
      DN2 images. Header table v4 will refuse all older module files. No new unit run.
      2026-11-24 (HEAD e3f877a): the DIGIKIT menu and the runtime lifecycle moved out of the flashed image into a
