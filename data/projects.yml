    notes: >
      Agent skill (Claude Code, Codex, Cursor; install with `npx skills add`) for developing Digitone II
      firmware mods: ColdFire MAIN OS patching in C, SHARC DSP audio code, verification in two emulators
      (digikit + a whole-DSP SHARC emulator), rebuild/re-sign/flash over USB. Encodes stock-firmware addresses,
      hook sites, the ColdFire-to-DSP frame format, free memory and "hardware rules the emulators cannot check,
      which each once silenced a real unit" (contents not yet read by us - see hardware/MINING.md).
      Examples: double_time (sequencer clock hook), track_trim (-6 dB on track 1). Needs Python 3.11+, dnfw,
      m68k GCC, digikit. MIT (digikit-derived files GPL-2.0), 2 commits, 10 stars. Overtone was built with it.
      Closest existing relative of this repo's hardware/ folder.
    sources: [GitHub README, Overtone README]
