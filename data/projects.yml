    notes: >
      Mod system for the Syntakt bringing Digitakt mk1 sample machines (ONE SHOT, WERP, REPITCH, SLICE), a per-project
      sample pool with long samples in slots 65-128 and a basic sample manager. Experimental. MIT. 18 stars at first
      sight. Found by GitHub search 2026-11-02; README start read. 2026-11-02: the GitHub repo no longer answers
      (deleted, renamed or private); details here are from the earlier read. 2026-11-03: the Lapin list links it as an
      external web app, https://synfact.app (builds custom Syntakt firmware from the user's stock OS file).
      2026-11-03: the project moved to GSM1980/synfact-dev and was rebuilt on elekloader (GPL-2.0; the old release
      repo was MIT): a core (mods/core-st) with hook bus, UI and SETTINGS events, SMZ4 banks of machines and modules
      that can change without reinstalling, long-sample storage (HZFS) and a project sample pool. Mods: SP sample
      machines, SY FM DTONE, audio recorder, third LFO, arpeggiator, POLY, system info, sample manager. Builds change
      MAIN and a bounded part of AUDIO only; a recovery core that never loads the bank can replace a bank that stops
      the unit from starting. Also builds in the browser (synfact.app). A snapshot of the old release repo survives as
      nrdsrfr/synfact-release (2026-10-17). 2026-11-06: project lifecycle audit after a user report of slow project
      load and save; arp-st leaves default carriers absent (81 % fewer emulated instructions); RANDOMIZE pages
      documented. 2026-11-09: new docs SETUP, MACHINES (writing a machine), MACHINE-REFERENCE and SAFE-BOOT-
      SMZ4-07-16; a safe-boot trial crashed every boot until core 1.7.1 (I62); a companion window broke BASE/WDTH
      until 1.7.2 (I63). 2026-11-14: a MAIN-CPU optimisation release across core and optional mods (full bank 86 % ->
      83 % MAIN on a stock pattern); a withdrawn development core of the same number crashed every boot because a
      routine sat in boot storage that startup wipes (I104); LFO3 1.3 fully suspends an engine with neutral depth or
      no valid destination, which can change active RANDOM sequences; samplers' stereo code borrows the Chorus SRAM
      windows when Chorus is absent. 2026-11-17: new playhead-st 1.0 (per-track step order, saved in a free tail of
      each kit slot that stock never reads); Chorus 1.2 (assembly, bit-identical buses); core 1.8.2 fixes a stock
      deferred view cleanup that drops a close raised during UI composition, which left ARP blank after mute on the
      owner's unit (ARP 1.9.1-1.10.4 reports); core 1.9.0 (host API 15) lets Recorder 1.4 run MAIN reduced (mixer, FX
      and modulation skipped) while a finished take is edited, and speeds MAIN LR stereo capture (owner's unit: 92 %
      MAIN in PLAY, 99 % recording before); new docs RECORDER-AUDIO-PAUSE and RECORDER-CAPTURE-CPU are in Spanish.
      2026-11-18 (docs/OS142-PORT.md, STOCK-SAMPLE-CORE-OVERLAP.md, mod CHANGELOGs): source builds now target Syntakt
      OS 1.42 (core 2.0.0; all 108 resident patch sites re-audited; no single code offset between 1.41 and 1.42). Core
      2.0 requires SMZ4 feature 16 and contract 0x53594605 and refuses older and untagged banks, so every bank must be
      rebuilt. Core 2.0.1 fixes a boot crash with many stock samples: stock's sample blob in MAIN grew over Synfact's
      resident core at 0x46000000 (I145); the core now streams stock samples to the voice CPU page by page and draws
      waveforms only when a page asks. The web builder and SMZ catalogue are not yet on 1.42.
      2026-11-18, later (docs/INTEGRATING.md, SYNFACT-WEB.md, js/README.md): the documented web core route now takes
      Syntakt OS 1.42; the normal build has ten optional groups (Playhead added; ARP needs LFO3) plus the always-on
      modulation skip, 768 selections the matrix checks against the reference build.
      2026-11-19 (MACHINE-REFERENCE, FORMAT, TESTS, ADAPTING, mod READMEs and CHANGELOGs): core 2.0.3 (chorus-st now
      needs it), arp-st 1.10.7, playhead-st 1.1-1.2.1 with four new modes and a modal selector drawn through the native
      Bitmap API; playhead now builds before the other UI modules so its modal takes keys first. The OS 1.42 suite
      checks 218 stock preimages. Synfact names firmware routines by their OS 1.41 address even in 1.42 modules; only
      the newly named 1.42 addresses are 1.42. All new work emulator only.
      2026-11-20 (new docs AUDIO-MEMORY-MAP, LFO3-MODULE-ONLY-INVESTIGATION, PROJECT-OPERATIONS-CPU,
      STOCK-MAIN-CPU-PROFILE in Spanish; new mods icache-lock-st and mix-fast-st; high-memory probe; core-st README,
      SAMPLE-POOL, SMZ4, mod CHANGELOGs): core 2.1.0 stops the sequencer and runs MAIN's reduced audio path while a
      native project worker (new, save, load, rename, copy, paste, clear, delete) runs, without the recorder. 2.1.1
      frees the bank file's AUDIO section from MAIN's heap after boot (it stayed until reboot: 108,640 bytes in the
      normal bank, 711,152 with the MD machine) and compiles cold core files at -Os, so the 64 KiB resident reserve
      goes from 176 to 11,616 bytes free. 2.1.2 fixes a module-only bank (LFO3, ARP, zero machines): the registry
      never became active, so LFO3's page showed ERR labels; confirmed on the owner's unit. 2.2.0 grows the bank's
      AUDIO section to 4 MiB and moves the sample pool above AUDIO's own page (63.62 MiB of long samples, 31.30 before);
      new contract 0x53594606, so every bank must be rebuilt. 2.3.0 checks that a whole sample batch fits before
      changing AUDIO (AUDIO FULL), and Sample Manager 1.3 shows sizes and a project memory meter. New always-in-bank
      modules: mix-fast-st (skips zero gain ramps in the stock mix kernels, exact) and icache-lock-st (locks hot stock
      audio code in half of MAIN's I-cache); both CPU savings are models, pending the unit. An emulator profile of
      stock 1.42 says about half of MAIN's cost is instruction-cache misses. A test-only probe machine (type 70)
      checks on the unit that nothing writes the new high AUDIO zone and measures the AUDIO stack depth; no result yet.
      2026-11-21 (new comp-st README, FX-BUS-COMPRESSOR-FEASIBILITY in Spanish, REAL-SYSTEM-PROFILE; ADAPTING, FORMAT,
      MACHINE-REFERENCE, SMZ4, mod CHANGELOGs, commits of 2026-11-20): new comp-st 0.2.0, a compressor on the FX track
      bus only. Its DSP is SyntHack OS's master-comp (MIT, kept in upstream/); the controls come from the user's own
      Digitakt OS 1.54 file. Detector on the FX ADC pair, gain through the two FX VCAs, parallel MIX; settings in the
      kit slot tail [0x15d0, 0x15e0). Core 2.4.0 (host API 16) adds event 15 FX_CV and takes over the shared Kit sites
      from Chorus 1.2.2 and LFO3 1.3.2; older cores reject such a bank. The owner reports comp-st 0.2.0 working on the
      unit. An emulator profile of the full shipped bank found that the mods are not an I-cache miss source; the stock
      audio block is, so a better lock set cannot win much.
      2026-11-23 (new COMP-SIDECHAIN-FILTER-FEASIBILITY in Spanish; comp-st, core-st and samplers-st READMEs,
      mod.json and CHANGELOGs; MACHINE-REFERENCE, ADAPTING, TESTS): comp-st 1.0.0 is COMP's first release: a
      high-pass on the detector only (SCF: off plus 127 cutoffs, 60 Hz to 1 kHz), ATK and REL in ms, THR 127 by
      default. On the unit MAIN rose with 0.2.0's COMP page open; the GR meter's repaints were the cause, now
      capped at 10 Hz (I196). Core 2.5.0 lets samplers-st 1.6.0 run a stereo track's right channel inside the
      stock chain; emulator only.
      2026-11-24 (main 2026-11-23): core 2.6.1 raises the module limit to 32; two new machines, SY MnM (digimono-st
      0.8.1, Monomachine-style types) and MD MACHINEDRUM (md-st 0.2, vendors soejrd/mdkit at 96157fe, CC0); a new
      offline tool tools/monomachine-reference compares the bank oscillators with the Monomachine's own DSP run
      through Monomodule on the user's OS 1.32B. FM+ table arrays taken from the Monomachine OS are committed at the
      owner's request (with a recipe and hashes); the DigiPRO tables are not. The web builder now takes several OS
      donors (Digitone 1.44, Digitakt 1.54, Monomachine 1.32B) and offers 13 optional groups. Unit CPU readings per
      machine and the AUDIO cost model are on the Syntakt page.
      2026-11-25: comp-st 1.1.0 (RAT up to INF as a limiter without lookahead, GR readout, settings survive a power
      cycle without a save when LFO3 is in the bank), samplers-st 1.6.2 (playhead line back, I212), digimono-st 0.8.2
      and md-st 0.3 (lists read the playing Kit, I213; MD KIT YES loads Machinedrum new-kit values), playhead-st
      1.3.0. These versions are host-tested only.
      2026-11-26 (main 2026-11-25; new docs/SP-WAVETBL.md, kitload-st, state-st and wavetable-st; core-st README,
      ADAPTING, FORMAT, MACHINE-REFERENCE, TESTS, commit messages): core 2.7.0 adds two events at the end of the
      PATTERN menus' constructors, used by the new kitload-st draft (a kit bank in a saved project, from a contributor's
      pull request). Core 2.8.0 stores wavetables in the project pool and sends the tempo to machines; the new SP
      WAVETBL machine (type 72) does what the Tonverk's Wavefinder does and reads Tonverk-style wavetable files after a
      conversion by the SDK or the browser tool. Core 2.8.1 and 2.9.0 let COMP, ARP, Playhead and Recorder keep their
      settings across a power cycle without a project save and without LFO3: the shared metadata and lock backend
      moved from LFO3 into an internal state-st service, module settings go into redundant records next to the bank,
      and the core now finds KitActive through the application object; the address Playhead and COMP used before was
      pattern memory (I116 updated). Two unit findings: kitload-st's question did not show until the menu was made to
      repaint (I225), and a native dial left a mark on SP WAVETBL's page (I226). Everything else host,
      Unicorn and emulator only.
      2026-11-27 (icache-lock-st README, CHANGELOG, mod.json): ICACHE LOCK 0.1.1. Version 0.1 masked interrupts for about
      2,300 instructions once a second while it refilled and locked the cache, and the owner heard intermittent clicks;
      bypassing only the refill removed them. 0.1.1 keeps audio interrupts on during the refill and defers it to the next
      UI tick near either edge of the codec's 32-frame DMA half-buffers or while a MAIN render interrupt is pending;
      tested click-free on the Syntakt (OS 1.42, core 2.9.0, a 19-module bank) with the same MAIN CPU reading (I240).
    features:
      - "SP sample machines: ONE SHOT, WERP, REPITCH and SLICE, with a project sample pool and long samples"
      - "new machines: SY FM DTONE, SY MnM (Monomachine-style types), MD MACHINEDRUM, SP WAVETBL (dual wavetable)"
      - "audio recorder: record, trim, normalize and save samples"
