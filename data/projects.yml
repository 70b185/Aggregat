      v0.38 (2026-11-02): Direct Jump state kept in its own +Drive sector (0x6FF000); per-project sample lists at +Drive 0x6D0000-0x6E02FF, two checked copies each. Root cause of the silent new samples: the DSP plays a pool slot only below the directory's count, and live adds did not update the count.
      v0.39 (2026-11-03): recordings had kept only ~2 ms since v0.38 because the DSP recorder took words 2-4 of every new link command as source, channel and threshold, and v0.38 sent a check command at every take's start; now only the recorder's own commands set them.
