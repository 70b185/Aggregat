  - id: dn2-dt2-firmware-research
    name: DN2 DT2 firmware research
    author: armio
    kind: mod
    devices: [digitone-2]   # the Digitakt II OS is only a donor file
    repo: https://github.com/armio/dn2-dt2-firmware-research
    links:
      web_app: https://armio.github.io/dn2-dt2-firmware-research/
      recorder: https://github.com/armio/dn2-dt2-firmware-research/blob/main/docs/recorder.md
      release: https://github.com/armio/dn2-dt2-firmware-research/blob/main/releases/r012.json
      candidate: https://github.com/armio/dn2-dt2-firmware-research/blob/main/releases/r027.json
    status: stable
    tested: partly
    tested_note: "README (2026-11-12): R012 confirmed on hardware; R027 owner-tested, not instrumented, USB audio untested since R023/R024 broke it (I74); R021/R022 fixes still pending hardware confirmation"
    base_os: "Digitone II OS 1.11 (target) + Digitakt II OS 1.16 (donor); both official files supplied locally"
    version: "R027 candidate (2026-11-12): adds SEM, a seventh filter type (Oberheim-style state-variable model from Faust: low-pass, notch, high-pass, band-pass) with its response drawn on the FILTER page; browser build only; R025 stopped the right effects chain running for every voice. R022 (2026-11-06): working-project sample autosave and sampler SYN-page routing fixes; native replay passed, hardware confirmation pending; includes R020 cold-start guard and R013 FORMAT SAMPLES; an iPhone USB freeze is unresolved; R012 remains the stable target"
    last_activity: "2026-11-12"
    notes: >
      Source-only recipes for Digitone II firmware with six Digitakt II sample machines (ONESHOT, WERP, STRETCH,
      REPITCH, GRID, SLICE), stereo samples, sample browsing, DT2 parameter graphics and SLICES trig mode.
      Recorder adds recording/resampling, source selection, normalization, trimming, audition, saving to +Drive
      and optional track assignment; VOICE cycles Voice Setup, Sample Manager and Recorder. Class-compliant USB
      audio provides 42 capture channels at 48 kHz/24 bit (MAIN, tracks 1-16, DELAY, REVERB, CHORUS, INPUT as
      stereo pairs) and a stereo return. R012 needs only the official DN2 1.11 and DT2 1.16 OS files; silent
      compatibility data replaces the private sample bank, and users load their own playable samples afterward.
      Native and browser builders verify exact inputs and the output: 2,563,872 bytes, SHA-256 4a2742a4...63a3a9a.
      The browser builds locally without uploading files; neither builder flashes the instrument. No firmware
      images or samples are distributed. Historical exact T1E2/R003/R008/R011 builds still require their original
      private sample bank. R011 fixed USB publication stalling after project changes by selecting its candidate
      destination from current DMA START while preserving ownership checks; R012 retains that fix.
      Owner-confirmed stock audio, samples, Recorder and USB audio on R012, including after project changes.
      Stable does not mean exhaustive validation: exact trimmed-file comparison, full Recorder-source coverage,
      endurance and end-to-end USB latency remain unverified. Builds on dnfw (angellinares/dn2_firmware_explore),
      selache, digikit and elektron-firmware-tool. AGPL-3.0-or-later.
      2026-11-03: README warns new users NOT to install R012 yet. R012 mounts an existing sample filesystem but does
      not create one on a DN2 that never had it; symptoms are 0% Free / 0 bytes in Transfer, stalled uploads, Connection
      failed. The author says stock FORMAT +DRIVE, EMPTY RESET and FACTORY RESET do not create it and can erase projects;
      at that point an on-device formatter was still in development. R013 subsequently added FORMAT SAMPLES with
      erase confirmation; formatting, restart, capacity and post-format uploads were checked on the owner's unit.
      Owner testing of R012 had used storage prepared during development. An earlier track-2 saved-project reload
      report was an unsaved checkpoint; R022 addresses a separate, reproduced failure to refresh the sample table
      in the unsaved working-state backup. This does not establish recovery from an interrupted write or USB freeze.
    features:
      - "six Digitakt II sample machines: ONESHOT, WERP, STRETCH, REPITCH, GRID, SLICE"
      - "mono and stereo samples with waveform views"
      - "slice editing and slice grids"
      - "recorder: record and resample, normalise, trim, save"
      - "sample manager for the +Drive"
      - "class-compliant multichannel USB audio"
      - "SEM filter: low-pass to notch to high-pass, plus band-pass"
    sources: [GitHub README, releases/r012.json, releases/r022.json, docs/recorder.md, docs/browser.md, docs/research/2026-11-03.md, docs/research/2026-11-06-autosave.md, docs/samples.md, "README (2026-11-11)", "README (2026-11-12)", docs/sem-filter.md]
    relations:
    - {type: builds_on, id: dn2-firmware-explore, evidence: 'catalogue notes: builds on dnfw (pinned commit)'}
