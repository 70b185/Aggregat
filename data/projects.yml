  - id: digiseq-digitakt
    name: DIGISEQ (Digitakt)
    author: ClaidArremer
    kind: mod
    devices:
    - digitakt
    repo: https://github.com/ClaidArremer/digitakt-digiseq
    license: "GPL-3.0-or-later from 0.11 (its own code GPL-2.0-or-later; the bundled Grids map is GPL-3.0-or-later); GPL-2.0-or-later before"
    status: wip
    tested: unit
    tested_note: "README: designed and tested on a Digitakt mk1, OS 1.54 (read 2026-11-11; the 0.12 README of 2026-11-20 says the same and gives no separate test of the new types)"
    base_os: "Digitakt mk1 OS 1.54 and 1.53 (elemod files for both)"
    version: "0.13 (2026-11-26, untagged): SHADE acid line type; 0.12 (2026-11-20): EUCLID, TURING and GRIDS types, one settings layout for all types; 0.8 (2026-11-02)"
    last_activity: "2026-11-26"
    notes: >
      Per-track choice of sequencer on the TRIG page's second page (e.g. SNAKE walking a grid). elekloader mod;
      a separate Digitone build exists. GPL. Found by GitHub search 2026-11-02; README start read.
      2026-11-21 (README, CHANGELOG 0.9-0.12, LICENSE; commit of 2026-11-20): three new types, EUCLID (0.9), TURING
      (0.10, after the Music Thing Turing Machine) and GRIDS (0.11, after Mutable Instruments Grids, whose drum map is
      copied unchanged). Because of that map the project as a whole and its .elemod files from 0.11 on are
      GPL-3.0-or-later; LICENSE is now the GPL-3.0 text. 0.11 builds with -Os and keeps one undo copy instead of one per
      track (about 23 KB freed, so it fits beside GESTALT, MASHUP and GLIDE). 0.12 gives every type the same knob layout,
      drops ARP's OFFSETS page and WALK and adds INTRVL (steps through a sample chain's slices). Settings are still not
      saved with the project.
      2026-11-27 (README, CHANGELOG 0.13): new type SHADE, an acid line generator inspired by Spektro Audio's ACDGEN (own
      code): a short motif in a chosen shape (FLOOR, FIFTH, UP, DOWN, ARP, LEAD) repeated to 1-32 steps with VARY changes,
      in a scale over a range; FILL, SLIDE, ACCENT and OCTAVE are thresholds on fixed per-step random values, so turning
      them adds or removes notes one by one. With the GLIDE mod's LEG on, slides glide like a 303; without it a slide is a
      longer note. The README gives no separate unit test of SHADE.
    features:
      - "per-track sequencer types instead of the trigs"
      - "SNAKE: a path through a grid"
      - "185: stage sequencer"
      - "ARP: arpeggiator from held keys or the track's trigs, up to 8 octaves or steps of an interval (walks a slice chain)"
      - "EUCLID: Euclidean rhythm up to 16 steps with accents, chance, ghost notes and SPIN"
      - "TURING: a 16-bit looping shift register after the Music Thing Turing Machine"
      - "GRIDS: one part of Mutable Instruments Grids' drum map per track, with FILL and CHAOS"
      - "SHADE: acid line generator with fill, slides, accents and octave jumps (glides with GLIDE)"
    sources:
    - GitHub search 2026-11-02
    - README
    - "README (2026-11-11)"
    - "README, CHANGELOG and LICENSE (2026-11-21)"
    - "README, CHANGELOG 0.13 (2026-11-27)"
    relations:
    - {type: mod_for, id: elekloader, evidence: 'catalogue notes: "elekloader mod"'}
    - {type: bundles, id: digisnake-digitakt, evidence: 'README: DIGISNAKE for Digitakt, unchanged, as its SNAKE type'}

  - id: glide-digitakt
    name: GLIDE (Digitakt)
    author: ClaidArremer
    kind: mod
    devices: [digitakt]
    repo: https://github.com/ClaidArremer/digitakt-glide
    status: wip
    tested: unit
    tested_note: "CHANGELOG: 0.4 tested on a Digitakt mk1 (OS 1.54); 0.3 withdrawn (p-locked PORT and LEG stopped working) (read 2026-11-14)"
    base_os: "Digitakt mk1 OS 1.53 and 1.54"
    version: "0.4 (2026-11-14)"
    last_activity: "2026-11-14"
    license: "GPL-2.0-or-later"
    notes: >
      Digitone-style portamento and legato for every audio track of the Digitakt mk1, on the TRIG page's two blank
      knobs (G PORT, H LEG). Both are trig parameters, kept in the pattern and p-lockable; they reuse the MIDI chord-note
      fields NOT3 and NOT4, which audio tracks never play, so old patterns open with both OFF. elekloader mod; needs
      core 4.1 and seq-events 0.2; works beside machine-pages, digihealth, PUMP and DIGISEQ. The repo also carries
      built .elemod files. Found by GitHub search 2026-11-14 (empty then); README read 2026-11-14.
    features:
      - "PORT: glide time per track, OFF or 1-127, each note slides from the one before"
      - "LEG: legato, a held-over note glides without restarting the sample or envelopes"
      - "both p-lockable per step and saved with the pattern"
      - "SLICE tracks glide in the chromatic slice modes"
      - "DIGISEQ types glide too, per step"
    sources: [GitHub search 2026-11-14, "README (2026-11-14)"]
    relations:
    - {type: mod_for, id: elekloader, evidence: 'README: needs elekloader core 4.1 and seq-events 0.2'}
    - {type: builds_on, id: digiseq-digitakt, evidence: 'README: built and tested with the seq-events copy in digitakt-digiseq'}

