    notes: >
      Adds Torso T-1-style generated melodies to the stock Euclidean sequencer: each Euclid hit gets a note from a
      pool of scale degrees in the pattern's KB SCALE and ROOT NOTE, moved by a phrase shape and a seeded, lockable
      random sequence. Own NOTES and RANDOM pages opened from the stock Euclid page; off by default per track; works on
      audio tracks (repitched) and MIDI tracks; patterns stay stock; settings are lost at power-off for now. Hooks the
      end of the audio and MIDI step fire (0x400d6e10, 0x400d7234 on OS 1.17). Built from your own OS file with
      shell scripts for Linux; a research log and a design document come with it. Credits Aggregat's rules and
      device facts for its build checks and flash procedure. Found via the owner 2026-11-08.
    features:
      - "generated melodies for the stock Euclidean sequencer, Torso T-1 style"
      - "notes from the pattern's scale and root"
      - "NOTES page: range, phrase shape and length"
      - "RANDOM page: variance, seed and lock"
      - "off by default, patterns are not rewritten"
