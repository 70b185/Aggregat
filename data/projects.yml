    tested_note: "the README calls it experimental and asks for community tests; the docs name only JavaScript syntax checks and local smoke tests, no named unit or OS (read 2026-11-20)"
    version: "3.1 (CHANGELOG, first public version; committed 2026-11-17)"
    last_activity: "2026-11-20"
    notes: >
      A local sound library and audition app in one HTML page for the Analog Four MKI / Analog Keys and the Digitone
      MK1 (Web Audio and Web MIDI in Chrome or Edge; a Windows script starts a local server for MIDI and audio input).
      It lists .afsnd, .dnsnd and .syx files, audio and ZIP archives, reads the manifest and tags of AFSND containers,
      and splits SysEx files into complete messages with basic manufacturer and 7-bit checks. Native sound payloads are
      not decoded: the "proxy preview" is a generic sound seeded from the file bytes, not the instrument's sound, so the
      docs suggest recording the real unit and linking that take. Elektron Transfer's protocol is not implemented;
      native sounds are never sent as raw SysEx, and project, OS and firmware transfer are excluded. A Web MIDI send
      only queues data and is no proof the unit received it. Bilingual docs (English, French). Was a candidate (repo
      created 2026-11-17 with only a LICENSE); the app and docs were merged 2026-11-20 and read the same day.
    features:
      - "library of .afsnd, .dnsnd, .syx, audio and ZIP files with filters, favourites and a JSON inventory"
      - "reads AFSND manifests and tags; splits SysEx dumps into whole messages with basic checks"
      - "audition: browser playback, a rough proxy preview of native sounds, WAV export"
      - "links a recording of the real unit to a sound; captures audio input"
      - "Web MIDI note and SysEx queueing to the unit"
    sources: [GitHub search 2026-11-18, "README, docs/LIMITATIONS, TECHNICAL_NOTES, INSTALLATION, CHANGELOG (2026-11-20)"]

