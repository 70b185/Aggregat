    tested: unit
    tested_note: "KYOTI V1.8C flashed on the author's MKI (2026-11-15; with DIRECT JUMP V7.3 on 2026-11-16); KYOTI V1.8BC flashed on the same MKI 2026-11-18/19 (walk-through items 1-11 pass; its BLACKPYRAMIDS_303 Part-change fixes confirmed in octabam test images); VARISPEED_EMUS VEM11 flashed as 140C_VEMG2 (all 8 checks pass, 2026-11-19); release candidates KY18BC RC1 / KY18C RC1 / 140CVEMRC1 / KY18BC RC2 flashed on the MKI 2026-11-20 (every item passed except two bugs fixed in RC2); Clyps test images CLB1-CLB17 inside V1.8BC flashed on the MKI 2026-11-20..24, the last (KY18BCCLBH, byte for byte the V1.8BC final promoted 2026-11-25) passing every test; KYOTI V1.8, V1.8C, the CLYPS image, the standalone BLACKPYRAMIDS_303 image, BATCH_BUGFIXES alone and most standalone feature images not flashed as such; MKII untested (read 2026-11-26)"
